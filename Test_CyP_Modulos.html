<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Test REE — Control y Protecciones</title>
<style>
:root{
  --blue:#185FA5;--blue-l:#E6F1FB;--blue-m:#378ADD;
  --green:#0F6E56;--green-l:#E1F5EE;--green-b:#1D9E75;
  --red:#993C1D;--red-l:#FAECE7;--red-b:#D85A30;
  --amber:#854F0B;--amber-l:#FAEEDA;
  --gray:#5F5E5A;--gray-l:#F1EFE8;--gray-m:#D3D1C7;
  --text:#2C2C2A;--muted:#888780;
  --bg:#fff;--bg2:#F8F7F4;
  --bd:rgba(0,0,0,0.12);--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Georgia',serif;background:var(--bg2);color:var(--text);min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:2rem 1rem}

/* ── INICIO ── */
#s-inicio{display:block}
.inicio-header{text-align:center;margin-bottom:2rem}
.inicio-header h1{font-size:1.9rem;font-weight:normal;letter-spacing:-.5px}
.inicio-header .sub{color:var(--muted);font-size:.9rem;margin-top:.3rem}
.inicio-header .total-badge{display:inline-block;margin-top:.75rem;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:.3rem .9rem;font-size:.8rem;color:var(--muted)}

/* tarjeta bloque */
.bloque-card{
  background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);
  padding:1rem 1.25rem;margin-bottom:.75rem;cursor:pointer;
  transition:border-color .15s,box-shadow .15s;
  display:flex;align-items:center;gap:1rem;
}
.bloque-card:hover{border-color:var(--blue-m);box-shadow:0 2px 8px rgba(0,0,0,.07)}
.bloque-num{
  width:36px;height:36px;border-radius:50%;background:var(--bg2);
  border:1.5px solid var(--bd);display:flex;align-items:center;
  justify-content:center;font-size:.8rem;font-weight:bold;
  font-family:monospace;color:var(--muted);flex-shrink:0;transition:all .15s;
}
.bloque-card:hover .bloque-num{border-color:var(--blue);color:var(--blue)}
.bloque-info{flex:1;min-width:0}
.bloque-titulo{font-size:.95rem;color:var(--text);line-height:1.4}
.bloque-meta{font-size:.78rem;color:var(--muted);margin-top:.25rem}
.bloque-stats{display:flex;gap:.5rem;flex-shrink:0;align-items:center}
.bs-pill{font-size:.72rem;padding:3px 9px;border-radius:12px;font-weight:bold;white-space:nowrap}
.bs-ok{background:var(--green-l);color:var(--green)}
.bs-fail{background:var(--red-l);color:var(--red)}
.bs-blank{background:var(--gray-l);color:var(--gray)}
.bs-pct{font-size:.78rem;color:var(--muted);font-weight:bold}

/* estado card */
.bloque-card.estado-progress .bloque-num{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
.bloque-card.estado-done .bloque-num{background:var(--green-b);border-color:var(--green-b);color:#fff}
.bloque-card.estado-done{border-color:rgba(29,158,117,.3)}

/* ── TEST ── */
#s-test{display:none}
.test-topbar{display:flex;justify-content:space-between;align-items:center;
  background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);
  padding:.75rem 1.1rem;margin-bottom:1rem}
.test-topbar .ttitle{font-size:.85rem}
.test-topbar .ttitle strong{display:block;font-size:.95rem}
.btn-volver{background:none;border:1px solid var(--bd);border-radius:8px;
  padding:.45rem 1rem;font-size:.82rem;cursor:pointer;color:var(--muted);transition:all .15s}
.btn-volver:hover{border-color:var(--blue);color:var(--blue)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1rem}
.stat{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:.6rem;text-align:center}
.stat .sn{font-size:1.35rem;font-weight:bold}
.stat .sl{font-size:.7rem;color:var(--muted);margin-top:1px}

/* nav dots */
.q-nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1rem}
.q-dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bd);
  font-size:.72rem;font-weight:bold;cursor:pointer;display:flex;align-items:center;
  justify-content:center;color:var(--muted);background:var(--bg);transition:all .15s;font-family:monospace}
.q-dot:hover{border-color:var(--blue);color:var(--blue)}
.q-dot.current{border:2px solid var(--blue);color:var(--blue);background:var(--blue-l)}
.q-dot.correct{background:var(--green-b);color:#fff;border-color:var(--green-b)}
.q-dot.wrong{background:var(--red-b);color:#fff;border-color:var(--red-b)}

/* pregunta */
.q-box{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:1.4rem;margin-bottom:1rem}
.q-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.65rem}
.q-text{font-size:.97rem;line-height:1.65;margin-bottom:1.15rem}
.opt{display:flex;align-items:flex-start;gap:10px;padding:.8rem .95rem;border-radius:8px;
  border:1.5px solid var(--bd);margin-bottom:.45rem;transition:all .2s;
  font-size:.88rem;background:var(--bg2);cursor:pointer;user-select:none}
.opt:hover:not(.locked){border-color:var(--blue-m);background:var(--blue-l)}
.opt.locked{cursor:default}
.opt.sel-ok{border-color:var(--green-b);background:var(--green-l);color:#085041}
.opt.sel-fail{border-color:var(--red-b);background:var(--red-l);color:#712B13}
.opt.show-ok{border-color:var(--green-b);background:var(--green-l);color:#085041}
.opt-key{font-weight:bold;min-width:18px;font-family:monospace;color:var(--muted);flex-shrink:0}
.opt.sel-ok .opt-key,.opt.show-ok .opt-key{color:var(--green-b)}
.opt.sel-fail .opt-key{color:var(--red-b)}

/* feedback */
.feedback{border-radius:8px;padding:.85rem 1rem;margin-top:.9rem;font-size:.86rem;line-height:1.6;display:none}
.feedback.show{display:block}
.feedback.fb-ok{background:var(--green-l);border:1px solid var(--green-b);color:#085041}
.feedback.fb-fail{background:var(--red-l);border:1px solid var(--red-b);color:#712B13}
.fb-title{font-weight:bold;margin-bottom:.3rem}
.fb-ref{font-size:.74rem;margin-top:.45rem;opacity:.75;font-style:italic}

/* nav row */
.nav-row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:1.1rem}
.btn{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:.55rem 1.1rem;
  font-size:.83rem;cursor:pointer;color:var(--text);transition:all .15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn-finish{background:var(--green);color:#fff;border:none;border-radius:8px;
  padding:.7rem 1.6rem;font-size:.88rem;cursor:pointer;display:block;margin:.9rem auto 0;transition:opacity .2s}
.btn-finish:hover{opacity:.88}

/* ── RESULTADO BLOQUE ── */
#s-result{display:none}
.res-banner{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);
  padding:1.75rem;text-align:center;margin-bottom:1rem}
.res-nums{display:flex;justify-content:center;gap:1.5rem;margin:.75rem 0}
.res-num .n{font-size:2.2rem;font-weight:bold;font-family:monospace}
.res-num .l{font-size:.75rem;color:var(--muted)}
.stats-res{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1.25rem}
.rev-section-title{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.65rem}
.rev-item{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:.95rem 1.1rem;margin-bottom:.55rem}
.rev-item.fail{border-left:4px solid var(--red-b)}
.rev-item.blank{border-left:4px solid var(--gray-m)}
.rev-q{font-size:.88rem;line-height:1.5;margin-bottom:.45rem}
.rev-ans{font-size:.8rem;margin-bottom:.35rem}
.rev-exp{font-size:.8rem;line-height:1.5;margin-bottom:.3rem}
.rev-ref{font-size:.73rem;color:var(--muted);font-style:italic}
.tag{font-size:.68rem;padding:2px 7px;border-radius:12px;font-weight:bold;display:inline-block;margin-bottom:.35rem}
.tag-fail{background:var(--red-l);color:var(--red)}
.tag-blank{background:var(--gray-l);color:var(--gray)}
.res-actions{display:flex;gap:.75rem;justify-content:center;margin-top:1.25rem}
.btn-reiniciar{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:.65rem 1.5rem;font-size:.88rem;cursor:pointer}
.btn-volver2{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:.65rem 1.5rem;font-size:.88rem;cursor:pointer;color:var(--text)}
.btn-volver2:hover{border-color:var(--blue);color:var(--blue)}

@media(max-width:500px){
  .stats,.stats-res{grid-template-columns:repeat(2,1fr)}
  .res-nums{gap:1rem}
  .bloque-stats{flex-direction:column;gap:.25rem;align-items:flex-end}
}
</style>
</head>
<body>
<div id="app">

<!-- INICIO -->
<div id="s-inicio">
  <div class="inicio-header">
    <h1>Test Control y Protecciones</h1>
    <div class="sub">Preparación Habilitación REE — Familias 0476 y 0425</div>
    <div class="total-badge">3 módulos · 60 preguntas</div>
  </div>
  <div id="lista-bloques"></div>
</div>

<!-- TEST -->
<div id="s-test">
  <div class="test-topbar">
    <div class="ttitle">
      <strong id="t-titulo">Módulo</strong>
      <span id="t-subtitulo" style="color:var(--muted);font-size:.8rem"></span>
    </div>
    <button class="btn-volver" onclick="volverInicio()">← Inicio</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="sn" id="s-ans" style="color:var(--blue)">0</div><div class="sl">Respondidas</div></div>
    <div class="stat"><div class="sn" id="s-blank">0</div><div class="sl">En blanco</div></div>
    <div class="stat"><div class="sn" id="s-rem" style="color:var(--amber)">0</div><div class="sl">Restantes</div></div>
  </div>
  <div class="q-nav" id="q-nav"></div>
  <div class="q-box">
    <div class="q-label" id="q-label">Pregunta 1</div>
    <div class="q-text" id="q-text"></div>
    <div id="options"></div>
    <div class="feedback" id="feedback">
      <div class="fb-title" id="fb-title"></div>
      <div id="fb-body"></div>
      <div class="fb-ref" id="fb-ref"></div>
    </div>
    <div class="nav-row">
      <button class="btn" onclick="navigate(-1)">← Anterior</button>
      <button class="btn" onclick="navigate(1)">Siguiente →</button>
    </div>
  </div>
  <button class="btn-finish" onclick="finishBloque()">Finalizar módulo</button>
</div>

<!-- RESULTADO -->
<div id="s-result">
  <div class="res-banner">
    <div style="font-size:.85rem;color:var(--muted);margin-bottom:.25rem" id="res-bname"></div>
    <div class="res-nums">
      <div class="res-num"><div class="n" id="res-ok" style="color:var(--green-b)">—</div><div class="l">Correctas</div></div>
      <div class="res-num"><div class="n" id="res-fail" style="color:var(--red-b)">—</div><div class="l">Incorrectas</div></div>
      <div class="res-num"><div class="n" id="res-blank">—</div><div class="l">En blanco</div></div>
    </div>
    <div style="font-size:.82rem;color:var(--muted)" id="res-pct"></div>
  </div>
  <div class="rev-section-title" id="rev-title"></div>
  <div id="review-list"></div>
  <div class="res-actions">
    <button class="btn-volver2" onclick="volverInicio()">← Volver al inicio</button>
    <button class="btn-reiniciar" onclick="reiniciarBloque()">Reiniciar módulo</button>
  </div>
</div>

</div>
<script>
const BLOQUES=[{"titulo": "Módulo 1: Conceptos Básicos de Electrotecnia", "qs": [{"p": "¿Qué representa físicamente la potencia reactiva en un circuito de alterna?", "o": {"a": "La potencia disipada en forma de calor por las resistencias del circuito.", "b": "La energía que oscila entre el campo eléctrico o magnético y la fuente, sin ser consumida.", "c": "La potencia total que entrega el generador al circuito.", "d": "La potencia perdida en el transporte debido a la resistencia de los conductores."}, "c": "b", "ref": "Electrotecnia básica / Potencia en CA", "exp": "La potencia reactiva (Q) representa el intercambio cíclico de energía entre la fuente y los elementos almacenadores (bobinas y condensadores). No se consume ni se disipa; solo circula. La opción a describe la potencia activa. La c describe la potencia aparente. La d es una pérdida óhmica, que también es potencia activa."}, {"p": "¿Por qué la corriente en un circuito puramente inductivo está desfasada 90° respecto a la tensión?", "o": {"a": "Porque la bobina almacena energía en forma de campo eléctrico que retrasa la corriente.", "b": "Porque la tensión en una bobina es proporcional a la variación de la corriente, no a su valor instantáneo.", "c": "Porque la resistencia interna de la bobina limita el paso de corriente en cada semiciclo.", "d": "Porque la frecuencia de la corriente es el doble que la de la tensión en elementos inductivos."}, "c": "b", "ref": "Electrotecnia básica / Inductancia y desfase", "exp": "La ley de Faraday establece que V = L·di/dt. Esto significa que la tensión es máxima cuando la corriente varía más rápido (paso por cero), y es cero cuando la corriente está en su pico. Esto produce un desfase de 90° con la corriente retrasada. La a confunde campo eléctrico con magnético. La c introduce resistencia que no existe en un inductor puro. La d es físicamente incorrecta."}, {"p": "¿Qué ocurre con la impedancia de un condensador cuando aumenta la frecuencia?", "o": {"a": "Aumenta, porque a mayor frecuencia el condensador opone más resistencia al paso de corriente.", "b": "Permanece constante, ya que la impedancia capacitiva no depende de la frecuencia.", "c": "Disminuye, porque a mayor frecuencia el condensador se carga y descarga más rápido.", "d": "Aumenta hasta la frecuencia de resonancia y luego disminuye bruscamente."}, "c": "c", "ref": "Electrotecnia básica / Impedancia capacitiva", "exp": "La impedancia capacitiva es Xc = 1/(2πfC). Al aumentar f, Xc disminuye, lo que significa que el condensador conduce mejor a frecuencias altas. La a es el comportamiento opuesto e incorrecto. La b ignora la dependencia con la frecuencia. La d describe un comportamiento de circuito resonante, no de un condensador aislado."}, {"p": "¿Qué diferencia hay entre valor eficaz y valor de pico de una señal sinusoidal?", "o": {"a": "El valor eficaz es siempre el doble del valor de pico.", "b": "El valor eficaz es el valor que produce el mismo efecto térmico que una corriente continua equivalente, y es menor que el valor de pico.", "c": "El valor de pico es el que se usa en los cálculos de potencia activa porque representa el valor medio de la señal.", "d": "Ambos valores son idénticos en señales sinusoidales perfectas."}, "c": "b", "ref": "Electrotecnia básica / Valores de una señal sinusoidal", "exp": "El valor eficaz (RMS) equivale al valor de pico dividido entre √2 (≈0,707 × Vpico). Es el valor que se usa en potencia y el que indican los instrumentos de medida. La a invierte la relación. La c es incorrecta porque el valor medio de una sinusoide completa es cero. La d solo sería cierta en corriente continua."}, {"p": "¿Qué significa que un sistema trifásico está equilibrado?", "o": {"a": "Que las tres fases tienen la misma frecuencia, igual módulo de tensión y están desfasadas 120° entre sí.", "b": "Que la potencia activa de cada fase es idéntica y la reactiva es nula.", "c": "Que las impedancias de los tres conductores de fase son iguales entre sí.", "d": "Que la tensión entre fases es exactamente √3 veces la tensión de cada fase respecto a tierra."}, "c": "a", "ref": "Electrotecnia básica / Sistemas trifásicos", "exp": "Un sistema equilibrado requiere que las tres tensiones (o corrientes) tengan igual amplitud, igual frecuencia y estén desfasadas exactamente 120° entre sí. La b confunde equilibrio con factor de potencia unitario. La c describe equilibrio de la red de transporte, no del sistema en sí. La d es una consecuencia del equilibrio en estrella, no su definición."}, {"p": "¿Por qué en un sistema trifásico equilibrado la corriente por el neutro es cero?", "o": {"a": "Porque el neutro tiene una resistencia muy elevada que impide el paso de corriente.", "b": "Porque la suma vectorial de las tres corrientes de fase, desfasadas 120° e iguales en módulo, es cero.", "c": "Porque las corrientes de las tres fases se anulan al ser de corriente alterna.", "d": "Porque el conductor de neutro solo conduce corrientes de secuencia homopolar y estas no existen en condiciones normales."}, "c": "b", "ref": "Electrotecnia básica / Sistemas trifásicos equilibrados", "exp": "Matemáticamente, la suma de tres fasores iguales desfasados 120° es siempre cero. Por tanto, no circula corriente por el neutro en condiciones equilibradas. La a es incorrecta porque el neutro puede tener baja impedancia. La c es imprecisa y confusa. La d mezcla conceptos de componentes simétricas con el razonamiento básico."}, {"p": "¿Qué relación existe entre la tensión de fase y la tensión de línea en un sistema trifásico en estrella?", "o": {"a": "La tensión de línea es el doble de la tensión de fase.", "b": "La tensión de línea es igual a la tensión de fase multiplicada por √3.", "c": "La tensión de línea es igual a la tensión de fase dividida entre √3.", "d": "La tensión de línea y la de fase son iguales cuando el neutro está puesto a tierra."}, "c": "b", "ref": "Electrotecnia básica / Tensiones en sistema estrella", "exp": "En un sistema estrella equilibrado, la tensión entre dos fases (línea) resulta de la diferencia vectorial de dos tensiones de fase desfasadas 120°, lo que da VL = √3 × Vf. Por ejemplo, en una red de 400 kV entre fases, la tensión de fase es 400/√3 ≈ 231 kV. La a aplica factor 2, incorrecto. La c invierte la relación. La d solo sería cierta si VL = Vf, lo que es geométricamente imposible en estrella."}, {"p": "¿Qué indica el ángulo de desfase entre tensión y corriente en un circuito de alterna?", "o": {"a": "La diferencia de amplitud entre la tensión y la corriente del circuito.", "b": "El retardo o adelanto temporal con que la corriente sigue a la tensión, determinado por el tipo de carga.", "c": "La frecuencia a la que opera el circuito respecto a la frecuencia nominal.", "d": "La proporción de potencia activa respecto a la potencia de cortocircuito del sistema."}, "c": "b", "ref": "Electrotecnia básica / Desfase en circuitos CA", "exp": "El ángulo φ indica cuánto se adelanta o retrasa la corriente respecto a la tensión. En cargas inductivas la corriente va retrasada (φ > 0); en capacitivas, adelantada (φ < 0). De este ángulo se deriva el factor de potencia (cos φ). La a confunde ángulo con módulo. La c describe la desviación de frecuencia. La d mezcla conceptos de potencia que no tienen relación con el desfase."}, {"p": "¿Qué efecto tiene la saturación del núcleo de un transformador sobre la corriente que consume?", "o": {"a": "La corriente disminuye porque el núcleo saturado aumenta la reluctancia y limita el flujo.", "b": "La corriente se vuelve no sinusoidal y aumenta significativamente, con componentes armónicas elevadas.", "c": "La corriente permanece sinusoidal pero con un desfase mayor respecto a la tensión.", "d": "La saturación solo afecta a la tensión secundaria, no a la corriente primaria."}, "c": "b", "ref": "Electrotecnia básica / Saturación magnética", "exp": "Cuando el núcleo satura, la permeabilidad magnética cae bruscamente. Para mantener el flujo, la corriente magnetizante debe aumentar mucho y se distorsiona, generando armónicos (especialmente el tercero). Esto es lo que ocurre durante el inrush de un transformador. La a confunde el efecto: la reluctancia sube pero la corriente también sube para compensar. La c es incorrecta porque la forma de onda se distorsiona. La d es falsa."}, {"p": "¿Por qué no puede abrirse un seccionador con carga?", "o": {"a": "Porque el seccionador no tiene aislamiento suficiente para soportar la tensión en vacío.", "b": "Porque al no tener cámara de extinción de arco, el arco generado al separar los contactos no se extingue y puede destruir el equipo.", "c": "Porque los enclavamientos eléctricos del sistema de control lo impiden siempre de forma absoluta.", "d": "Porque la corriente de carga sobrecalienta los contactos del seccionador durante la apertura."}, "c": "b", "ref": "Control de maniobra / Seccionadores", "exp": "El seccionador está diseñado para aislar circuitos sin tensión o sin corriente, no para interrumpir corriente. Al no disponer de cámara de extinción de arco, si se abre bajo carga el arco eléctrico no se extingue y puede destruir el equipo o provocar un cortocircuito. La a es incorrecta porque el aislamiento en vacío sí está garantizado. La c es incorrecta porque los enclavamientos pueden fallar o estar fuera de servicio. La d es una consecuencia menor, no la razón principal."}, {"p": "¿Qué es la corriente de cortocircuito simétrica y en qué se diferencia de la asimétrica?", "o": {"a": "La simétrica incluye la componente continua transitoria; la asimétrica es solo la componente de régimen permanente.", "b": "La simétrica es solo la componente alterna de régimen permanente; la asimétrica incluye además una componente continua transitoria que decae con el tiempo.", "c": "Ambas son iguales en valor eficaz pero difieren en la frecuencia de oscilación.", "d": "La simétrica corresponde a faltas trifásicas y la asimétrica a faltas monofásicas o bifásicas."}, "c": "b", "ref": "Electrotecnia básica / Cortocircuitos", "exp": "Al producirse un cortocircuito, la corriente total tiene dos componentes: la alterna simétrica (régimen permanente) y una componente continua que aparece por las condiciones iniciales del circuito y decae exponencialmente. La suma de ambas da la corriente asimétrica, que es mayor y determina los esfuerzos electrodinámicos máximos. La a invierte las definiciones. La c es incorrecta. La d confunde simetría de la corriente con el tipo de falta."}, {"p": "¿Qué función cumple el neutro puesto a tierra en un sistema de alta tensión?", "o": {"a": "Permite aumentar la tensión de servicio sin modificar el aislamiento de los equipos.", "b": "Proporciona un camino de retorno a la corriente de falta monofásica y limita las sobretensiones en las fases sanas durante una falta a tierra.", "c": "Elimina completamente la corriente de falta monofásica al ofrecer un camino de baja impedancia.", "d": "Sirve exclusivamente para la medida de tensión homopolar mediante los TT de neutro."}, "c": "b", "ref": "Electrotecnia básica / Sistemas de neutro", "exp": "Al poner el neutro a tierra se crea un camino para la corriente de falta monofásica, lo que permite a las protecciones detectarla y actuar. Además se limita la sobretensión en las fases sanas a valores próximos a la tensión de fase (no a la tensión entre fases). La a es incorrecta. La c es falsa porque la puesta a tierra no elimina la corriente sino que la proporciona. La d es una función secundaria de medida, no la función principal del neutro."}, {"p": "¿Qué es la componente de secuencia homopolar y cuándo aparece?", "o": {"a": "Es la componente de igual módulo y fase en las tres fases, y aparece en faltas asimétricas que involucran tierra.", "b": "Es la componente que representa el desequilibrio entre fases y aparece en cualquier falta trifásica.", "c": "Es la componente de frecuencia doble que aparece durante la saturación de los transformadores de medida.", "d": "Es la diferencia entre la secuencia directa e inversa y se usa para detectar faltas bifásicas aisladas."}, "c": "a", "ref": "Electrotecnia básica / Componentes simétricas", "exp": "La secuencia homopolar (I0) es igual en las tres fases (mismo módulo y misma fase) y solo aparece cuando existe un camino a tierra para la corriente, como en faltas monofásicas o bifásicas a tierra. En faltas trifásicas simétricas o bifásicas aisladas no aparece componente homopolar. La b describe la secuencia inversa. La c es incorrecta. La d no tiene sentido físico."}, {"p": "¿Por qué los transformadores de medida tienen núcleos separados para medida y para protección?", "o": {"a": "Para reducir el coste de fabricación al poder usar materiales magnéticos de menor calidad en el núcleo de protección.", "b": "Porque el núcleo de medida debe ser preciso en condiciones normales y satura en falta, mientras que el de protección debe mantenerse lineal hasta corrientes de falta elevadas.", "c": "Porque los relés de protección consumen más potencia que los contadores y necesitan un núcleo de mayor sección.", "d": "Para evitar que una falta en el circuito de protección afecte a la lectura del contador de energía."}, "c": "b", "ref": "Electrotecnia básica / Transformadores de medida", "exp": "El núcleo de medida (clase 0,2; 0,5) está optimizado para ser muy preciso en el rango nominal, pero satura ante corrientes de falta para proteger el contador. El núcleo de protección (clase 5P, 10P) debe mantenerse lineal hasta el factor de sobreintensidad nominal (FSN) para que el relé reciba una señal proporcional durante la falta. La a es incorrecta. La c confunde consumo con diseño magnético. La d es una consecuencia secundaria, no la razón principal."}, {"p": "¿Qué significa que un relé de protección tiene característica IDMT?", "o": {"a": "Que dispara siempre en un tiempo fijo independientemente del valor de la corriente de falta.", "b": "Que el tiempo de actuación disminuye al aumentar la corriente de falta, con un mínimo definido por debajo del cual no baja.", "c": "Que el relé mide simultáneamente corriente y tensión para calcular la impedancia de falta.", "d": "Que el relé solo actúa si la corriente supera un umbral fijo durante un tiempo mínimo predefinido."}, "c": "b", "ref": "Protecciones / Característica IDMT", "exp": "IDMT significa Inverse Definite Minimum Time (Tiempo Inverso Mínimo Definido). A mayor corriente de falta, menor es el tiempo de actuación, siguiendo una curva inversa normalizada (IEC o IEEE). Sin embargo, existe un tiempo mínimo por debajo del cual el relé no actúa más rápido, lo que garantiza la coordinación con protecciones aguas abajo. La a describe un relé de tiempo definido (DMT). La c describe un relé de distancia. La d describe un umbral de disparo simple."}, {"p": "¿Qué es el factor de potencia y qué consecuencia tiene un valor bajo sobre la instalación?", "o": {"a": "Es la relación entre potencia reactiva y potencia aparente; un valor bajo indica que la instalación consume poca energía.", "b": "Es la relación entre potencia activa y potencia aparente; un valor bajo implica que circula más corriente de la necesaria para suministrar la misma potencia activa.", "c": "Es la relación entre potencia activa y potencia reactiva; un valor bajo indica un elevado consumo de armónicos.", "d": "Es el coseno del ángulo entre tensión y corriente; un valor bajo mejora la eficiencia del transformador al reducir las pérdidas en el hierro."}, "c": "b", "ref": "Electrotecnia básica / Factor de potencia", "exp": "El factor de potencia (cos φ = P/S) indica qué fracción de la corriente total realiza trabajo útil. Un factor bajo significa que circula mucha corriente reactiva que no hace trabajo pero sí calienta los conductores y ocupa capacidad de transporte. La a confunde las magnitudes. La c mezcla factor de potencia con distorsión armónica. La d tiene la primera parte correcta pero la consecuencia es incorrecta: un factor bajo aumenta las pérdidas, no las reduce."}, {"p": "¿Qué diferencia existe entre una falta franca y una falta resistiva a tierra?", "o": {"a": "La falta franca ocurre en líneas aéreas y la resistiva en cables subterráneos.", "b": "En la falta franca la impedancia en el punto de falta es prácticamente nula; en la resistiva existe una impedancia que limita la corriente y dificulta la detección por las protecciones.", "c": "La falta franca afecta a las tres fases simultáneamente y la resistiva solo a una fase.", "d": "En la falta resistiva la tensión en el punto de falta es cero, mientras que en la franca permanece en el valor nominal."}, "c": "b", "ref": "Electrotecnia básica / Tipos de falta", "exp": "Una falta franca es un cortocircuito directo (Rf ≈ 0) que produce la máxima corriente de falta. Una falta resistiva tiene una resistencia en el punto de falta (arco, terreno seco, árbol) que reduce la corriente y puede hacer que las protecciones no alcancen su umbral de actuación. La a es incorrecta: ambos tipos pueden ocurrir en cualquier elemento. La c describe falta trifásica vs monofásica. La d invierte la realidad."}, {"p": "¿Por qué la impedancia homopolar de una línea aérea es mayor que la directa?", "o": {"a": "Porque la secuencia homopolar circula a mayor frecuencia y la reactancia inductiva aumenta con la frecuencia.", "b": "Porque la corriente homopolar retorna por la tierra y los cables de guarda, que tienen mayor resistencia y reactancia que los conductores de fase.", "c": "Porque la impedancia homopolar incluye la impedancia de los transformadores en ambos extremos de la línea.", "d": "Porque en secuencia homopolar los tres conductores de fase trabajan en paralelo, lo que triplica la impedancia total."}, "c": "b", "ref": "Electrotecnia básica / Parámetros de línea", "exp": "En secuencia homopolar las corrientes de las tres fases son iguales y en fase, por lo que el retorno no puede ser por los conductores de fase sino por la tierra y los cables de guarda. Estos caminos tienen mayor resistividad y reactancia que los conductores de fase, elevando Z0 hasta 3-4 veces Z1. La a es incorrecta porque la frecuencia no cambia. La c incluye elementos externos a la línea. La d confunde el sentido: en homopolar las corrientes suman, no se restan."}, {"p": "¿Qué es el efecto Ferranti y en qué condición de operación aparece?", "o": {"a": "Es el calentamiento del conductor por efecto corona en líneas de muy alta tensión en condiciones de alta humedad.", "b": "Es la elevación de tensión en el extremo receptor de una línea larga cuando opera en vacío o con carga capacitiva.", "c": "Es la distorsión de la forma de onda de tensión producida por la saturación de los transformadores de potencia.", "d": "Es la oscilación de potencia activa entre generadores de una red interconectada tras una perturbación."}, "c": "b", "ref": "Electrotecnia básica / Efecto Ferranti", "exp": "En una línea larga sin carga o con carga capacitiva, la capacidad distribuida de la línea genera potencia reactiva capacitiva. Sin carga inductiva que la absorba, esta potencia eleva la tensión a lo largo de la línea, siendo máxima en el extremo receptor. La a describe el efecto corona. La c describe la distorsión armónica por saturación. La d describe oscilaciones electromecánicas entre máquinas."}, {"p": "¿Qué indica la clase de precisión de un transformador de intensidad?", "o": {"a": "La corriente máxima que puede circular por el primario sin que el núcleo se sature.", "b": "El error máximo porcentual en módulo y fase que el TI puede introducir en la medida dentro de su rango nominal.", "c": "El número de veces que puede soportar la corriente de cortocircuito sin deterioro permanente.", "d": "La potencia máxima en VA que puede suministrar el secundario a los equipos conectados."}, "c": "b", "ref": "Electrotecnia básica / Transformadores de medida", "exp": "La clase de precisión (0,2; 0,5; 1; 5P; 10P) define el error máximo admisible en la reproducción de la corriente primaria. Por ejemplo, un TI clase 0,2 garantiza un error máximo del 0,2% en módulo y un error de fase máximo de 10 minutos dentro de su rango de carga nominal. La a describe la corriente térmica nominal. La c describe la corriente de cortocircuito admisible (Ith). La d describe el burden o carga nominal."}]}, {"titulo": "Módulo 2: Reglamento de Puntos de Medida (RUPM)", "qs": [{"p": "En el proyecto de una planta de generación que se conectará a la red de transporte con una potencia aparente nominal de 15 MVA, ¿qué clasificación mínima recibe el punto de medida y qué configuraciones son obligatorias según el RUPM?", "o": {"a": "Tipo 1, siendo obligatoria únicamente la configuración principal debido al nivel de tensión.", "b": "Tipo 1, siendo obligatorio disponer de configuración principal y, adicionalmente, redundante o comprobante.", "c": "Tipo 2, debiendo instalarse configuración principal y redundante de forma mandatoria.", "d": "Tipo 1, pero se permite prescindir de la medida redundante si existe una medida comprobante en el lado de baja del transformador."}, "c": "b", "ref": "RUPM Art. 7.1.b e ITC Sección 3.1", "exp": "Las fronteras de generación ≥ 12 MVA son Tipo 1. La normativa exige para el Tipo 1 configuraciones redundantes o comprobantes, salvo excepciones en tensiones < 36 kV que no aplican a transporte."}, {"p": "Para una instalación de medida clasificada como Tipo 1, ¿cuál es la clase de precisión mínima exigida para los transformadores de tensión y de intensidad respectivamente?", "o": {"a": "Tensión 0,5 e Intensidad 0,5S.", "b": "Tensión 0,2 e Intensidad 0,2.", "c": "Tensión 0,2 e Intensidad 0,2S.", "d": "Tensión 0,1 e Intensidad 0,1S."}, "c": "c", "ref": "RUPM Art. 9.10 (Cuadro de precisión)", "exp": "El cuadro de clases de precisión especifica taxativamente que para puntos de Tipo 1, los TT deben ser 0,2 y los TI deben ser 0,2S."}, {"p": "Al dimensionar el circuito secundario de un transformador de intensidad destinado a medida, ¿dentro de qué rango debe situarse la carga (burden) para garantizar la precisión reglamentaria?", "o": {"a": "Entre el 50% y el 100% de su potencia de precisión.", "b": "Entre el 25% y el 100% de su potencia de precisión.", "c": "Superior al 10% en transformadores de clase S.", "d": "Exactamente al valor de la potencia nominal asignada."}, "c": "b", "ref": "ITC Sección 5.3 y ITC-RAT 08 Sección 2", "exp": "El reglamento establece que la carga en el circuito secundario dedicado a medida del TI debe estar comprendida entre el 25% y el 100% de su potencia de precisión."}, {"p": "En una subestación con una tensión nominal de 220 kV, el punto de medida principal no puede coincidir con la frontera física. ¿Cuál es la distancia máxima para que se considere que están 'en el mismo lugar' a efectos de evitar coeficientes de pérdidas?", "o": {"a": "50 metros.", "b": "150 metros.", "c": "500 metros.", "d": "1000 metros."}, "c": "c", "ref": "ITC Sección 3.1", "exp": "Para instalaciones de tensión superior a 132 kV, el criterio de coincidencia física se cumple si la distancia es inferior a 500 metros."}, {"p": "¿Qué requisito de caída de tensión máxima debe cumplir el cableado secundario entre un transformador de tensión y el contador en un punto de medida?", "o": {"a": "No superior al 0,5%.", "b": "No superior al 1 por 1000.", "c": "No superior al 1%.", "d": "No está limitada siempre que la sección del cable sea de 2,5 mm²."}, "c": "b", "ref": "ITC Sección 5.2 e ITC-RAT 08 Sección 2", "exp": "Tanto el RUPM como el RAT establecen que la caída de tensión no será superior al 1 por 1000 en el cableado desde el transformador al contador."}, {"p": "En el diseño de una frontera de Tipo 1 con una potencia aparente nominal de 75 MVA, ¿es posible que el equipo redundante comparta los secundarios de los transformadores de medida con el equipo principal?", "o": {"a": "No, el equipo redundante debe ser siempre independiente de cualquier elemento del principal.", "b": "Sí, siempre que la potencia aparente nominal del punto frontera sea igual o inferior a 80 MVA.", "c": "Sí, pero solo se permite compartir los secundarios de los transformadores de tensión.", "d": "Solo si se instalan transformadores de clase de precisión 0,1S para compensar la carga compartida."}, "c": "b", "ref": "ITC Sección 3.1", "exp": "Existe una excepción específica para puntos frontera ≤ 80 MVA donde el equipo redundante puede compartir el secundario de los transformadores de medida del principal."}, {"p": "Según la definición del RUPM, ¿qué caracteriza específicamente a una 'configuración comprobante' respecto a una redundante?", "o": {"a": "Se instala en el mismo punto físico que la principal pero con distinta clase de precisión.", "b": "Se instala en el otro extremo de un solo elemento de red (línea o transformador) respecto al principal.", "c": "Es una medida estimada basada en el histórico de consumos del punto frontera.", "d": "Es la medida obtenida por el Operador del Sistema a través de sistemas SCADA de tiempo real."}, "c": "b", "ref": "RUPM Art. 3.3.c", "exp": "La configuración comprobante se define como el equipo instalado en el otro extremo de un solo elemento respecto del principal, permitiendo la comparación mediante un cálculo de pérdidas."}, {"p": "Si un punto de medida clasificado por energía como Tipo 3 supera el límite superior de su tipo en más de un 5% durante dos años consecutivos, ¿cuál es la consecuencia reglamentaria?", "o": {"a": "Se mantiene la clasificación pero se aumenta la frecuencia de verificaciones individuales.", "b": "El encargado de la lectura modificará su clasificación al tipo superior correspondiente previa notificación.", "c": "Se exige el cambio inmediato de los transformadores de medida sin modificar la clasificación del punto.", "d": "El punto pasa a clasificarse automáticamente como Tipo 1 independientemente del valor de la energía."}, "c": "b", "ref": "ITC Sección 4", "exp": "Cuando durante dos años seguidos la energía supera en más de un 5% el límite del tipo, el encargado de la lectura debe modificar la clasificación al tipo que corresponda."}, {"p": "Usted proyecta una frontera entre la red de transporte y la red de distribución. ¿Dónde debe ubicarse el punto de medida principal según la propiedad de los activos?", "o": {"a": "Siempre en el lado de alta tensión de los transformadores de potencia.", "b": "En el lado de alta si el transformador es del distribuidor, y en el de baja si es del transportista.", "c": "En el lado de baja si el transformador es del distribuidor, y en el de alta si es del transportista.", "d": "En el punto físico de entronque de las líneas, sin considerar la ubicación de los transformadores."}, "c": "b", "ref": "ITC Sección 3.5.1", "exp": "La ubicación depende de la titularidad del transformador: lado de alta si es propiedad del distribuidor y lado de baja si es del transportista."}, {"p": "Para los puntos de medida de tipos 1, 2, 3 y 4, ¿cuál es el requisito mínimo obligatorio respecto al sistema de conexión eléctrica de la medida?", "o": {"a": "Conexión a dos hilos.", "b": "Conexión a tres hilos.", "c": "Conexión a cuatro hilos.", "d": "Conexión a tres o cuatro hilos indistintamente, según decida el responsable del punto."}, "c": "c", "ref": "ITC Sección 5.1", "exp": "Para los tipos 1, 2, 3 o 4, el sistema de medida empleado será obligatoriamente de conexión a cuatro hilos."}, {"p": "¿En qué circunstancias no es obligatorio instalar una caja de centralización de secundarios de medida próxima a los transformadores de medida?", "o": {"a": "Nunca es obligatoria si los contadores están a menos de 50 metros.", "b": "Cuando la tensión nominal es ≤ 45 kV o la distancia al armario de contadores es < 40 metros.", "c": "Solo en instalaciones de Tipo 5 donde no existan transformadores de tensión.", "d": "Cuando el responsable del punto de medida asuma contractualmente el error por caída de tensión."}, "c": "b", "ref": "ITC Sección 5.1", "exp": "La instalación de la caja no es obligatoria para tensiones ≤ 45 kV o distancias inferiores a 40 metros entre los transformadores y el armario."}, {"p": "En cuanto a los secundarios de los transformadores de medida destinados a facturación, ¿qué establece el RUPM sobre la conexión de otros equipos?", "o": {"a": "Pueden conectarse relés de protección siempre que el contador sea el primero de la cadena.", "b": "Deben estar dedicados exclusivamente a equipos de medida para liquidación o tarificación.", "c": "Se permite conectar equipos de control (SCADA) si no superan el 25% de la carga de precisión.", "d": "Solo se permite la conexión de otros equipos si el transformador dispone de más de tres secundarios."}, "c": "b", "ref": "ITC Sección 5.1", "exp": "Los secundarios de medida deben estar dedicados exclusivamente a los equipos destinados a la liquidación o tarificación (contadores, registradores, etc.)."}, {"p": "Para determinar la relación de transformación idónea en un transformador de intensidad de una frontera de generación, ¿qué parámetro debe utilizarse como potencia de diseño?", "o": {"a": "La potencia contratada por la planta para sus servicios auxiliares.", "b": "La potencia aparente nominal del grupo generador.", "c": "La intensidad de cortocircuito máxima en las barras de la subestación.", "d": "La energía anual intercambiada prevista dividida por las horas de utilización."}, "c": "b", "ref": "ITC Sección 5.3.b", "exp": "En fronteras de generación, la potencia de diseño para la idoneidad de la relación de transformación es la potencia aparente del grupo."}, {"p": "En una frontera de cliente conectada a la red de transporte, ¿quién es el responsable de los equipos de medida y cómo se trata administrativamente dicha frontera?", "o": {"a": "El transportista es el responsable, tratándose como una única frontera cliente-transporte.", "b": "El cliente es el responsable, y se trata como dos fronteras (transporte-distribuidor y distribuidor-cliente).", "c": "El distribuidor de la zona es el responsable único por delegación legal del transportista.", "d": "La responsabilidad es compartida al 50% entre el cliente y el Operador del Sistema."}, "c": "b", "ref": "ITC Sección 3.1", "exp": "Las fronteras de clientes con la red de transporte se tratan como dos fronteras administrativas, pero el responsable de los equipos de medida es el cliente."}, {"p": "¿Cómo se define reglamentariamente el término 'Energía anual intercambiada' a efectos de clasificación de puntos de medida?", "o": {"a": "La suma algebraica de la energía activa exportada e importada en un año natural.", "b": "La suma en valor absoluto de la energía activa que atraviesa una frontera en ambos sentidos en un año natural.", "c": "Únicamente la energía activa que entra en la red de transporte desde una instalación de generación.", "d": "La energía activa neta medida en el punto frontera tras descontar las pérdidas del transformador principal."}, "c": "b", "ref": "ITC Sección 1 (Definiciones)", "exp": "Se entiende por energía anual intercambiada la suma en valor absoluto de la energía activa que atraviesa la frontera en ambos sentidos anualmente."}, {"p": "Para la medida de energía reactiva en los puntos de medida, ¿qué exigencia mínima establece el reglamento sobre el sentido de la medida?", "o": {"a": "Solo es obligatorio medir la reactiva en el cuadrante de importación de activa.", "b": "El registro de energía reactiva será realizado en todos los cuadrantes en que sea posible la circulación.", "c": "Es obligatorio emplear cuatro aparatos monofásicos independientes para cada cuadrante de reactiva.", "d": "La reactiva solo se registra si el factor de potencia (cos phi) es inferior a 0,9."}, "c": "b", "ref": "RUPM Art. 9.2", "exp": "El registro de energía reactiva debe realizarse en todos los cuadrantes posibles de circulación, pudiendo emplear uno o más aparatos para ello."}, {"p": "Según el RUPM, ¿qué capacidad mínima de parametrización de periodos de integración debe tener un registrador para puntos de Tipo 1, 2 y 3?", "o": {"a": "Periodos fijos de 60 minutos.", "b": "Periodos de integración de hasta 5 minutos.", "c": "Periodos de integración de 1 minuto para servicios de ajuste.", "d": "Periodos fijos de 15 minutos (cuarto-horarios)."}, "c": "b", "ref": "RUPM Art. 9.7", "exp": "El registrador para puntos tipos 1, 2 y 3 debe ser capaz de parametrizar periodos de integración de hasta 5 minutos."}, {"p": "¿Quién es el sujeto obligado a instalar y mantener los equipos de medida redundantes o comprobantes en una frontera de generación?", "o": {"a": "El encargado de la lectura (Operador del Sistema).", "b": "El responsable del equipo de medida principal.", "c": "El distribuidor de la zona de influencia de la planta.", "d": "La Comisión Nacional de los Mercados y la Competencia (CNMC)."}, "c": "b", "ref": "ITC Sección 3.1", "exp": "La obligación de instalar equipos redundantes o comprobantes corresponde al responsable del equipo de medida principal."}, {"p": "En cuanto al control de la potencia demandada, ¿qué elemento exige el RUPM para los puntos de medida de tipos 1, 2, 3 y 4?", "o": {"a": "Interruptores de control de potencia (ICP) precintables.", "b": "Seis maxímetros con un periodo de integración de 15 minutos.", "c": "Relés de mínima frecuencia para desconexión de cargas críticas.", "d": "Maxímetros con periodo de integración de 5 minutos únicamente para Tipo 1."}, "c": "b", "ref": "RUPM Art. 9.6", "exp": "En los tipos 1, 2, 3 y 4 el control de potencia se efectúa mediante seis maxímetros con periodo de integración de 15 minutos."}, {"p": "Para instalaciones de clientes, ¿qué información adicional mínima deben incorporar los registros de los equipos de medida relativa a la calidad del servicio?", "o": {"a": "El espectro de armónicos hasta el orden 50.", "b": "Número y duración de interrupciones ≥ 3 minutos y tiempo con tensión fuera de límites.", "c": "El flicker (Pst) y el desequilibrio de fases en tiempo real.", "d": "La corriente de cortocircuito máxima detectada en cada evento de falta."}, "c": "b", "ref": "RUPM Art. 9.11", "exp": "Los equipos de clientes deben registrar al menos las interrupciones ≥ 3 minutos y los tiempos con tensión fuera de los límites permitidos."}]}, {"titulo": "Módulo 3: Procedimientos de Operación y Control", "qs": [{"p": "¿Qué diferencia fundamental existe entre un interruptor automático y un seccionador en cuanto a su capacidad de maniobra?", "o": {"a": "El interruptor puede operar con o sin carga; el seccionador solo puede operar en ausencia de corriente.", "b": "El seccionador puede interrumpir corrientes de cortocircuito; el interruptor solo interrumpe corrientes nominales.", "c": "El interruptor opera únicamente por mando remoto; el seccionador puede operarse manualmente en cualquier condición.", "d": "Ambos pueden interrumpir corriente, pero el seccionador lo hace más lentamente para proteger el aislamiento."}, "c": "a", "ref": "Control de maniobra / Equipos de corte", "exp": "El interruptor automático está diseñado con cámara de extinción de arco para interrumpir corrientes en carga e incluso corrientes de cortocircuito. El seccionador carece de esta capacidad y solo puede operarse cuando el circuito está sin corriente, garantizando la separación visible del circuito. La b invierte completamente las capacidades. La c es incorrecta porque ambos pueden tener mando local y remoto. La d es falsa porque el seccionador directamente no puede interrumpir corriente."}, {"p": "¿Qué es el dispositivo antibombeo de un interruptor y cuándo actúa?", "o": {"a": "Es un dispositivo que amortigua mecánicamente el golpe de los contactos durante el cierre para reducir el desgaste.", "b": "Es una lógica que impide que el interruptor realice cierres repetitivos si la orden de cierre se mantiene activa tras un disparo.", "c": "Es un sistema hidráulico que regula la velocidad de apertura del interruptor ante corrientes de cortocircuito.", "d": "Es un relé que bloquea el cierre del interruptor si la presión del SF6 está por debajo del umbral mínimo."}, "c": "b", "ref": "Control de maniobra / Dispositivo antibombeo", "exp": "Si una protección dispara el interruptor y la orden de cierre permanece activa (por ejemplo, un pulsador atascado o una lógica de reenganche mal diseñada), el antibombeo impide que el interruptor intente cerrar repetidamente sobre una falta permanente, protegiendo mecánicamente el equipo. La a describe un amortiguador mecánico que no existe con ese nombre. La c describe un regulador de velocidad de apertura. La d describe un bloqueo por baja presión de gas, que es una función distinta."}, {"p": "¿Qué indica la señal 52a y la señal 52b de un interruptor y para qué se usan?", "o": {"a": "52a indica posición abierto y 52b indica posición cerrado; se usan para confirmar el estado del interruptor en el sistema de control.", "b": "52a indica posición cerrado y 52b indica posición abierto; se usan para confirmar el estado real del interruptor y detectar discordancias.", "c": "52a es la orden de cierre y 52b es la orden de apertura; son las señales de mando que envía el SCADA al interruptor.", "d": "Ambas indican posición cerrado pero provienen de sensores diferentes para redundancia; si discrepan indica fallo del sensor."}, "c": "b", "ref": "Control de maniobra / Señales de posición", "exp": "Por convenio, 52a es el contacto auxiliar que replica la posición del contacto principal: cerrado cuando el interruptor está cerrado. La señal 52b es el contacto normalmente cerrado: activo cuando el interruptor está abierto. Ambas señales se usan en la lógica de control, enclavamientos y detección de discordancias. La a invierte las definiciones. La c confunde señales de posición con señales de mando. La d es incorrecta porque tienen estados complementarios, no iguales."}, {"p": "¿Qué es el mando sincronizado (Point-on-Wave) de un interruptor y para qué tipo de equipos se aplica principalmente?", "o": {"a": "Es un sistema que sincroniza el cierre de los tres polos del interruptor para que actúen exactamente al mismo tiempo.", "b": "Es un sistema que controla el instante exacto de cierre de cada polo individualmente para minimizar transitorios de conexión, aplicado principalmente en bancos de condensadores y transformadores.", "c": "Es un sistema de sincronismo entre dos redes que verifica que la diferencia de tensión y frecuencia es admisible antes del cierre.", "d": "Es un protocolo de comunicación entre el relé de sincronismo y el SCADA para coordinar el cierre en el instante adecuado."}, "c": "b", "ref": "Control de maniobra / Mando sincronizado", "exp": "El mando sincronizado controla el instante de cierre de cada polo de forma independiente para que ocurra en el momento óptimo de la onda de tensión, minimizando las corrientes de inrush en transformadores o los transitorios de sobretensión en bancos de condensadores. La a describe el mando convencional simultáneo de los tres polos. La c describe la función del relé de sincronismo ANSI 25. La d confunde el concepto con un protocolo de comunicación."}, {"p": "¿Qué ocurre si se da una orden de cierre a un interruptor mientras está ejecutando una apertura?", "o": {"a": "El interruptor completa el cierre inmediatamente después de terminar la apertura de forma automática.", "b": "El dispositivo antibombeo memoriza la orden y la ejecuta en el siguiente ciclo de mantenimiento.", "c": "El interruptor completa primero la apertura y el dispositivo antibombeo bloquea el cierre posterior hasta que la orden se retire y se vuelva a enviar.", "d": "El interruptor se bloquea mecánicamente en posición intermedia hasta que un operador intervenga manualmente."}, "c": "c", "ref": "Control de maniobra / Dispositivo antibombeo", "exp": "La secuencia de apertura tiene prioridad sobre el cierre. Una vez iniciada la apertura, el interruptor la completa. El antibombeo detecta que hubo un disparo mientras la orden de cierre estaba activa y bloquea cualquier intento de nuevo cierre hasta que la orden se retire completamente y se vuelva a enviar de forma deliberada. La a describe un comportamiento peligroso que el antibombeo precisamente evita. La b es inventada. La d no es el comportamiento estándar de los interruptores."}, {"p": "¿Qué es un enclavamiento en el contexto del control de una subestación y cuál es su finalidad?", "o": {"a": "Es una orden de mando que el operador envía para bloquear temporalmente un equipo durante el mantenimiento.", "b": "Es una condición lógica o mecánica que impide la ejecución de una maniobra si no se cumplen previamente determinadas condiciones de seguridad.", "c": "Es un protocolo de comunicación entre el sistema de control local y el SCADA para coordinar maniobras simultáneas.", "d": "Es un registro histórico de las maniobras realizadas que impide repetir una secuencia errónea ya ejecutada."}, "c": "b", "ref": "Control de maniobra / Enclavamientos", "exp": "Los enclavamientos son condiciones previas que deben cumplirse para autorizar una maniobra. Su finalidad es evitar maniobras incorrectas que puedan provocar cortocircuitos, daños en equipos o riesgo para las personas. Pueden ser lógicos (implementados en el sistema de control) o mecánicos (físicamente imposibilitan la maniobra). La a describe un bloqueo manual, que es diferente. La c confunde enclavamiento con protocolo de comunicación. La d describe un registro de eventos, no un enclavamiento."}, {"p": "¿Qué diferencia hay entre un enclavamiento lógico (por software) y un enclavamiento mecánico?", "o": {"a": "El enclavamiento lógico es más seguro porque no puede anularse bajo ninguna circunstancia; el mecánico puede desactivarse manualmente.", "b": "El enclavamiento mecánico actúa físicamente sobre el equipo impidiendo la maniobra; el lógico actúa sobre el sistema de control pero puede ser anulado por el operador bajo su responsabilidad.", "c": "Ambos tienen el mismo nivel de seguridad pero el lógico es más rápido de implementar y el mecánico más fiable en entornos con interferencias electromagnéticas.", "d": "El enclavamiento lógico protege contra faltas eléctricas y el mecánico protege contra errores humanos exclusivamente."}, "c": "b", "ref": "Control de maniobra / Tipos de enclavamiento", "exp": "El enclavamiento mecánico (cerrojos, llaves de bloqueo) impide físicamente la maniobra y no puede evitarse salvo con herramientas. El enclavamiento lógico opera en el software del sistema de control y, aunque protege contra errores, puede ser anulado por un operador autorizado que asume la responsabilidad. Por eso los enclavamientos críticos de seguridad se implementan siempre de forma mecánica además de lógica. La a invierte la realidad. La c es parcialmente correcta pero no responde a la diferencia fundamental. La d es incorrecta."}, {"p": "¿Por qué el seccionador de puesta a tierra no puede cerrarse si el seccionador principal de la posición está cerrado?", "o": {"a": "Porque el seccionador de tierra no tiene capacidad de corte y se dañaría al intentar cerrar con tensión.", "b": "Porque cerrar el seccionador de tierra con el circuito energizado provocaría un cortocircuito franco trifásico a tierra extremadamente destructivo.", "c": "Porque el reglamento exige que solo pueda haber un seccionador cerrado por posición en cada momento.", "d": "Porque la corriente de tierra dañaría el sistema de medida de los TI de la posición."}, "c": "b", "ref": "Control de maniobra / Enclavamientos de puesta a tierra", "exp": "El seccionador de puesta a tierra está diseñado para conectar el circuito a tierra cuando este ya está sin tensión, garantizando la seguridad del personal. Si se cierra con el circuito energizado, se crea un cortocircuito trifásico a tierra con toda la energía de la red, lo que destruye el equipo y puede ser fatal. La a es incorrecta porque el problema no es el daño al seccionador de tierra sino el cortocircuito. La c no corresponde a ningún criterio reglamentario de ese tipo. La d es una consecuencia menor y no la razón principal."}, {"p": "¿Qué condición debe cumplirse obligatoriamente antes de poder cerrar un seccionador de barras?", "o": {"a": "Que la tensión en las barras sea superior al 95% de la tensión nominal.", "b": "Que el interruptor de la misma posición esté en posición abierto.", "c": "Que el relé de sincronismo haya dado conformidad a la maniobra.", "d": "Que el seccionador de línea de la misma posición esté previamente cerrado."}, "c": "b", "ref": "Control de maniobra / Enclavamientos de seccionadores", "exp": "El seccionador no puede interrumpir corriente. Por tanto, antes de operar cualquier seccionador (abrirlo o cerrarlo) el interruptor de la posición debe estar abierto para garantizar que no circula corriente por el seccionador durante la maniobra. La a no es una condición de enclavamiento estándar para seccionadores. La c es una condición para el cierre del interruptor, no del seccionador. La d sería una secuencia incorrecta que podría provocar un arco peligroso."}, {"p": "¿Por qué el relé de sincronismo (ANSI 25) es un enclavamiento previo al cierre de un interruptor de línea?", "o": {"a": "Porque verifica que la línea no tiene ninguna falta antes de autorizar el cierre.", "b": "Porque si se cierra un interruptor conectando dos sistemas no sincronizados se producen corrientes y esfuerzos mecánicos muy elevados que pueden dañar los equipos.", "c": "Porque la normativa exige que todo cierre de interruptor en AT sea autorizado por un relé de sincronismo.", "d": "Porque el relé de sincronismo mide la impedancia de la línea y verifica que no hay ningún elemento interpuesto."}, "c": "b", "ref": "Función ANSI 25 / Control de maniobra", "exp": "Si se cierran dos sistemas con diferente tensión, frecuencia o ángulo de fase, el transitorio resultante genera corrientes de igualación muy elevadas (similares a un cortocircuito) y esfuerzos mecánicos que pueden dañar transformadores, generadores e interruptores. El relé 25 verifica que ΔV, Δf y Δφ están dentro de márgenes admisibles antes de autorizar el cierre. La a es una función de las protecciones de línea, no del 25. La c no refleja correctamente el motivo técnico. La d describe una función de relé de distancia."}, {"p": "¿Qué diferencia existe entre mando local y mando remoto en el control de una subestación?", "o": {"a": "El mando local solo puede usarse en emergencias; el remoto es el modo de operación habitual desde el centro de control.", "b": "En mando local el operador actúa directamente sobre el equipo o el armario de control de la bahía; en mando remoto las órdenes se envían desde el SCADA o centro de control.", "c": "El mando local permite operar todos los equipos de la subestación desde un único punto; el remoto solo permite operar un equipo a la vez.", "d": "En mando remoto el sistema de enclavamientos está desactivado para permitir mayor flexibilidad operativa."}, "c": "b", "ref": "Control de maniobra / Modos de control", "exp": "El mando local implica que el operador está físicamente presente en la subestación y opera los equipos desde el panel de control de la bahía o directamente en el equipo. El mando remoto permite operar desde el centro de control a través del sistema SCADA. Normalmente existe un selector local/remoto que prioriza uno u otro modo. La a es incorrecta porque el mando local es también un modo de operación habitual. La c invierte las capacidades. La d es incorrecta y peligrosa: los enclavamientos operan en ambos modos."}, {"p": "¿Qué significa que un equipo está en estado 'fuera de servicio bloqueado' y quién puede cambiarlo?", "o": {"a": "Que el equipo ha disparado por una protección y no puede rearmarse hasta que la protección se rearme automáticamente.", "b": "Que el equipo está intencionadamente impedido de operar por decisión del operador o del centro de control, y solo puede desbloquearse por personal autorizado mediante acción deliberada.", "c": "Que el equipo tiene un fallo mecánico detectado por el sistema de autodiagnóstico y está pendiente de revisión por mantenimiento.", "d": "Que el equipo está en modo de prueba y solo acepta mandos desde el panel local de la bahía."}, "c": "b", "ref": "Control de maniobra / Estados de los equipos", "exp": "El estado bloqueado es una acción deliberada del operador para impedir que un equipo pueda ser maniobrado accidentalmente, por ejemplo durante trabajos de mantenimiento próximos o por condiciones de red especiales. Solo puede desbloquearse mediante una acción explícita y autorizada. La a describe el estado tras un disparo por protección, que es diferente. La c describe un bloqueo por fallo de autodiagnóstico. La d describe el modo de prueba local."}, {"p": "¿Qué es la inhibición de mandos y en qué situaciones se aplica?", "o": {"a": "Es la desactivación temporal del sistema SCADA para realizar actualizaciones de software sin afectar a la operación.", "b": "Es la suspensión temporal de la capacidad de dar órdenes a un equipo desde un determinado nivel de control, manteniendo la supervisión activa.", "c": "Es el bloqueo automático de todos los mandos de la subestación cuando se detecta una falta en las barras principales.", "d": "Es la función que impide dar dos órdenes simultáneas al mismo equipo desde niveles de control diferentes."}, "c": "b", "ref": "Control de maniobra / Inhibición de mandos", "exp": "La inhibición de mandos permite suspender la capacidad de operar un equipo desde un nivel de control (por ejemplo, desde el SCADA) mientras se mantiene la capacidad de supervisión y el mando local. Se aplica durante trabajos de mantenimiento, pruebas o situaciones en las que se quiere evitar interferencias desde el centro de control mientras se trabaja localmente. La a describe el mantenimiento del sistema SCADA. La c describe un bloqueo automático de protecciones. La d describe la gestión de prioridad de mandos."}, {"p": "¿Qué información aportan las señales de posición de un interruptor al sistema SCADA?", "o": {"a": "Únicamente si el interruptor está abierto o cerrado, sin información sobre el estado de los mecanismos internos.", "b": "El estado real de los contactos principales, permitiendo detectar posición abierto, cerrado, intermedia o discordancia entre polos.", "c": "La corriente que circula por cada polo del interruptor en tiempo real para supervisión de carga.", "d": "El número de maniobras realizadas y el desgaste estimado de los contactos para planificación del mantenimiento."}, "c": "b", "ref": "Control de maniobra / Señales de posición", "exp": "Las señales 52a y 52b combinadas permiten al SCADA conocer el estado real del interruptor: cerrado (52a activa, 52b inactiva), abierto (52a inactiva, 52b activa), o discordancia (ambas activas o ambas inactivas), lo que indica un fallo en el equipo o en el cableado. También permite detectar discordancia entre polos en interruptores trifásicos. La a es demasiado limitada. La c es información de medida de corriente, no de posición. La d corresponde al contador de maniobras."}, {"p": "¿Cuál es el orden correcto de maniobra para poner en servicio una línea desde una subestación con esquema de doble barra?", "o": {"a": "Cerrar el interruptor de línea, cerrar el seccionador de barras, cerrar el seccionador de línea.", "b": "Cerrar el seccionador de barras, cerrar el seccionador de línea, cerrar el interruptor.", "c": "Cerrar el seccionador de línea, cerrar el interruptor, cerrar el seccionador de barras.", "d": "Cerrar el interruptor, cerrar el seccionador de línea, cerrar el seccionador de barras."}, "c": "b", "ref": "Control de maniobra / Secuencias de maniobra", "exp": "La secuencia correcta es siempre: primero los seccionadores (que no cortan corriente) y después el interruptor (que sí tiene capacidad de corte). Dentro de los seccionadores, primero el de barras y luego el de línea. Al cerrar el interruptor en último lugar, si hay algún problema en la línea, este puede despejarlo. La a, c y d colocan el interruptor en posiciones incorrectas de la secuencia, lo que podría obligar a los seccionadores a operar bajo carga."}, {"p": "¿Cuál es el orden correcto para dejar una posición de línea en mantenimiento (descargo)?", "o": {"a": "Abrir el seccionador de línea, abrir el seccionador de barras, abrir el interruptor, cerrar el seccionador de puesta a tierra.", "b": "Abrir el interruptor, abrir el seccionador de línea, abrir el seccionador de barras, cerrar el seccionador de puesta a tierra.", "c": "Cerrar el seccionador de puesta a tierra, abrir el interruptor, abrir el seccionador de línea, abrir el seccionador de barras.", "d": "Abrir el interruptor, abrir el seccionador de barras, abrir el seccionador de línea, cerrar el seccionador de puesta a tierra."}, "c": "b", "ref": "Control de maniobra / Secuencias de descargo", "exp": "El descargo sigue la secuencia inversa a la puesta en servicio: primero se abre el interruptor (único equipo con capacidad de corte de corriente), luego los seccionadores (en cualquier orden pero sin corriente), y finalmente se cierra el seccionador de puesta a tierra para garantizar la seguridad del personal. La a abre seccionadores antes que el interruptor, lo que los obligaría a cortar corriente. La c cierra la puesta a tierra con el circuito aún energizado, lo que provocaría un cortocircuito. La d tiene un orden de seccionadores que puede ser válido pero abre primero el de barras."}, {"p": "¿Por qué antes de cerrar el interruptor de enlace entre dos barras se debe verificar el sincronismo?", "o": {"a": "Porque el interruptor de enlace tiene menor capacidad de corte que los interruptores de línea y necesita condiciones más favorables.", "b": "Porque si las dos barras tienen diferente tensión o están desfasadas, al cerrar el enlace se produce una corriente de igualación que puede ser muy elevada.", "c": "Porque el reglamento de operación exige siempre la verificación de sincronismo antes de cualquier cierre de interruptor en AT.", "d": "Porque las protecciones diferenciales de barra pueden interpretar la corriente de igualación como una falta interna y disparar innecesariamente."}, "c": "b", "ref": "Control de maniobra / Sincronismo en maniobras", "exp": "Si dos barras tienen diferente tensión, frecuencia o ángulo de fase y se conectan a través del interruptor de enlace, se genera una corriente de igualación cuya magnitud depende de la diferencia de tensión entre ambas barras y la impedancia del enlace. En casos extremos puede ser comparable a una corriente de cortocircuito. La a es incorrecta porque la capacidad del interruptor de enlace es equivalente a la de los demás. La c no es del todo correcta porque en barras del mismo sistema normalmente están sincronizadas. La d es una consecuencia posible pero no la razón principal."}, {"p": "¿Qué es un reenganche y en qué tipo de faltas tiene sentido aplicarlo?", "o": {"a": "Es el cierre automático del interruptor tras un disparo por protección, y tiene sentido principalmente en líneas aéreas donde la mayoría de las faltas son transitorias.", "b": "Es la reposición manual del servicio tras un disparo, y se aplica en transformadores de potencia tras verificar que no hay daño interno.", "c": "Es el rearme automático de las protecciones tras un disparo, y se aplica en cualquier tipo de elemento de la subestación.", "d": "Es el cierre del interruptor de reserva cuando el principal ha disparado, y se aplica en esquemas de doble interruptor."}, "c": "a", "ref": "Función ANSI 79 / Automatismos", "exp": "El reenganche (ANSI 79) cierra automáticamente el interruptor tras un disparo por protección, después de un tiempo muerto que permite que el arco de la falta se extinga. Es efectivo en líneas aéreas donde la mayoría de las faltas (rayo, contorneos) son transitorias y desaparecen solas. No se aplica en transformadores, cables o barras porque las faltas en estos equipos suelen ser permanentes y el reenganche agravaría el daño. La b describe la reposición manual. La c confunde el reenganche con el rearme de protecciones. La d describe una transferencia automática de reserva."}, {"p": "¿Qué es la supervisión del circuito de disparo (ANSI 74TC) y por qué es importante?", "o": {"a": "Es una función que cuenta el número de disparos del interruptor para planificar el mantenimiento de los contactos.", "b": "Es una función que supervisa de forma continua la integridad del circuito eléctrico de la bobina de disparo del interruptor, haciendo circular una pequeña corriente de prueba.", "c": "Es una función que verifica que la tensión de los servicios auxiliares de CC es suficiente para garantizar el disparo del interruptor.", "d": "Es una función que bloquea el disparo del interruptor si detecta que la bobina de apertura está en cortocircuito."}, "c": "b", "ref": "Control de maniobra / Supervisión de bobinas ANSI 74TC", "exp": "El 74TC hace circular una corriente de miliamperios por el circuito de disparo de forma continua. Si el circuito está interrumpido (cable roto, bobina fundida, contacto deteriorado), la corriente desaparece y el relé genera una alarma. Esto es crítico porque un fallo en el circuito de disparo impediría que la protección actuara ante una falta real. La a describe un contador de maniobras. La c describe la supervisión de la tensión de CC, que es una función diferente. La d invierte la lógica: el 74TC detecta circuito abierto, no cortocircuito."}, {"p": "¿Qué indica una discordancia de polos en un interruptor trifásico y qué protección se encarga de detectarla?", "o": {"a": "Indica que los tres polos no han completado la maniobra al mismo tiempo; se detecta mediante la función ANSI 50BF.", "b": "Indica que uno o más polos están en posición diferente al resto (uno abierto y dos cerrados, o viceversa); se detecta mediante la función ANSI 52PD o lógica específica de discordancia de polos.", "c": "Indica que la corriente en una fase es diferente a las otras dos; se detecta mediante la función ANSI 46 de desequilibrio de intensidades.", "d": "Indica que el mecanismo de accionamiento de un polo ha fallado mecánicamente; se detecta mediante sensores de presión del sistema hidráulico."}, "c": "b", "ref": "Control de maniobra / Discordancia de polos", "exp": "La discordancia de polos (pole discordance) ocurre cuando los tres polos de un interruptor trifásico no están todos en la misma posición, creando un sistema desequilibrado que puede dañar transformadores y generadores por las corrientes de secuencia inversa generadas. Se detecta comparando las señales de posición de cada polo individualmente. La a describe la función 50BF que detecta fallo del interruptor en abrir, no discordancia. La c describe la detección por efecto eléctrico, no la causa. La d es parcialmente correcta pero no describe la función de protección estándar."}]}];

const estado=BLOQUES.map(b=>({answers:new Array(b.qs.length).fill(null),done:false}));
let bloqueActual=0,curQ=0;

function renderInicio(){
  document.getElementById('s-inicio').style.display='block';
  document.getElementById('s-test').style.display='none';
  document.getElementById('s-result').style.display='none';
  const lista=document.getElementById('lista-bloques');
  lista.innerHTML='';
  BLOQUES.forEach((b,i)=>{
    const ans=estado[i].answers,total=b.qs.length;
    const respondidas=ans.filter(a=>a!==null).length;
    const correctas=ans.filter((a,j)=>a!==null&&a===b.qs[j].c).length;
    const incorrectas=respondidas-correctas,enBlanco=total-respondidas;
    const pct=respondidas>0?Math.round(correctas/respondidas*100):null;
    let estadoClass='';
    if(respondidas>0&&respondidas<total)estadoClass='estado-progress';
    else if(respondidas===total)estadoClass='estado-done';
    let statsHTML='';
    if(respondidas>0){statsHTML=`<div class="bloque-stats"><span class="bs-pill bs-ok">✓ ${correctas}</span><span class="bs-pill bs-fail">✗ ${incorrectas}</span>${enBlanco>0?`<span class="bs-pill bs-blank">○ ${enBlanco}</span>`:''} ${pct!==null?`<span class="bs-pct">${pct}%</span>`:''}</div>`;}
    const tituloLimpio=b.titulo.replace(/^Módulo \d+[:\s]*/i,'').trim();
    lista.innerHTML+=`<div class="bloque-card ${estadoClass}" onclick="iniciarBloque(${i})"><div class="bloque-num">${i+1}</div><div class="bloque-info"><div class="bloque-titulo">${tituloLimpio}</div><div class="bloque-meta">${total} preguntas${respondidas>0?' · '+respondidas+' respondidas':''}</div></div>${statsHTML}</div>`;
  });
}

function iniciarBloque(idx){
  bloqueActual=idx;
  const b=BLOQUES[idx];
  curQ=0;
  if(estado[idx].done){mostrarResultado();return;}
  const primeraSinRes=estado[idx].answers.findIndex(a=>a===null);
  if(primeraSinRes>=0)curQ=primeraSinRes;
  document.getElementById('s-inicio').style.display='none';
  document.getElementById('s-result').style.display='none';
  document.getElementById('s-test').style.display='block';
  const tituloLimpio=b.titulo.replace(/^Módulo \d+[:\s]*/i,'').trim();
  document.getElementById('t-titulo').textContent='Módulo '+(idx+1);
  document.getElementById('t-subtitulo').textContent=tituloLimpio;
  document.getElementById('s-rem').textContent=b.qs.length;
  buildNav();renderQ();
}

function buildNav(){
  const b=BLOQUES[bloqueActual],ans=estado[bloqueActual].answers;
  const nav=document.getElementById('q-nav');nav.innerHTML='';
  b.qs.forEach((_,i)=>{
    const d=document.createElement('div');
    let cls='q-dot';
    if(i===curQ)cls+=' current';
    else if(ans[i]!==null)cls+=(ans[i]===b.qs[i].c?' correct':' wrong');
    d.className=cls;d.textContent=i+1;d.onclick=()=>goTo(i);nav.appendChild(d);
  });
}

function renderQ(){
  const b=BLOQUES[bloqueActual],ans=estado[bloqueActual].answers;
  const q=b.qs[curQ],answered=ans[curQ]!==null;
  document.getElementById('q-label').textContent=`Pregunta ${curQ+1} de ${b.qs.length}`;
  document.getElementById('q-text').textContent=q.p;
  const opts=document.getElementById('options');opts.innerHTML='';
  Object.entries(q.o).forEach(([k,v])=>{
    const d=document.createElement('div');
    let cls='opt';
    if(answered){cls+=' locked';if(k===q.c)cls+=' show-ok';if(k===ans[curQ]&&ans[curQ]!==q.c)cls+=' sel-fail';}
    d.className=cls;
    d.innerHTML=`<span class="opt-key">${k.toUpperCase()})</span><span>${v}</span>`;
    if(!answered)d.onclick=()=>selectAnswer(k);
    opts.appendChild(d);
  });
  const fb=document.getElementById('feedback');
  if(answered){
    const isOk=ans[curQ]===q.c;
    fb.className='feedback show '+(isOk?'fb-ok':'fb-fail');
    document.getElementById('fb-title').textContent=isOk?'✓ Respuesta correcta':'✗ Respuesta incorrecta';
    document.getElementById('fb-body').textContent=q.exp;
    document.getElementById('fb-ref').textContent='📖 '+q.ref;
  }else{fb.className='feedback';}
  buildNav();updateStats();
}

function selectAnswer(k){estado[bloqueActual].answers[curQ]=k;renderQ();}
function navigate(d){const n=curQ+d,total=BLOQUES[bloqueActual].qs.length;if(n>=0&&n<total){curQ=n;renderQ();}}
function goTo(i){curQ=i;renderQ();}

function updateStats(){
  const ans=estado[bloqueActual].answers,total=BLOQUES[bloqueActual].qs.length;
  const resp=ans.filter(a=>a!==null).length;
  document.getElementById('s-ans').textContent=resp;
  document.getElementById('s-blank').textContent=total-resp;
  document.getElementById('s-rem').textContent=total-resp;
}

function volverInicio(){
  document.getElementById('s-test').style.display='none';
  document.getElementById('s-result').style.display='none';
  renderInicio();
}

function finishBloque(){estado[bloqueActual].done=true;mostrarResultado();}

function mostrarResultado(){
  document.getElementById('s-test').style.display='none';
  document.getElementById('s-inicio').style.display='none';
  document.getElementById('s-result').style.display='block';
  const b=BLOQUES[bloqueActual],ans=estado[bloqueActual].answers;
  let ok=0,fail=0,blank=0;
  ans.forEach((a,i)=>{if(a===null)blank++;else if(a===b.qs[i].c)ok++;else fail++;});
  const total=b.qs.length,pct=total>0?Math.round(ok/total*100):0;
  const tituloLimpio=b.titulo.replace(/^Módulo \d+[:\s]*/i,'').trim();
  document.getElementById('res-bname').textContent='Módulo '+(bloqueActual+1)+' — '+tituloLimpio;
  document.getElementById('res-ok').textContent=ok;
  document.getElementById('res-fail').textContent=fail;
  document.getElementById('res-blank').textContent=blank;
  document.getElementById('res-pct').textContent=`${pct}% de respuestas correctas sobre el total del módulo`;
  const list=document.getElementById('review-list');list.innerHTML='';
  const toReview=b.qs.map((q,i)=>({q,i,a:ans[i]})).filter(({a,q})=>a===null||a!==q.c);
  if(toReview.length===0){
    document.getElementById('rev-title').textContent='¡Perfecto! Todas las respuestas son correctas.';
  }else{
    document.getElementById('rev-title').textContent=`Para repasar — ${toReview.length} pregunta${toReview.length>1?'s':''}:`;
    toReview.forEach(({q,i,a})=>{
      const isBlank=a===null,cls=isBlank?'blank':'fail';
      const tag=isBlank?'<span class="tag tag-blank">En blanco</span>':'<span class="tag tag-fail">Incorrecta ✗</span>';
      const ua=a?`Tu respuesta: <strong>${a.toUpperCase()}) ${q.o[a]}</strong>`:'No respondida.';
      const ca=`<br>Correcta: <strong>${q.c.toUpperCase()}) ${q.o[q.c]}</strong>`;
      list.innerHTML+=`<div class="rev-item ${cls}">${tag}<div class="rev-q"><strong>${i+1}.</strong> ${q.p}</div><div class="rev-ans">${ua}${ca}</div><div class="rev-exp">${q.exp}</div><div class="rev-ref">📖 ${q.ref}</div></div>`;
    });
  }
  window.scrollTo(0,0);
}

function reiniciarBloque(){
  estado[bloqueActual].answers=new Array(BLOQUES[bloqueActual].qs.length).fill(null);
  estado[bloqueActual].done=false;
  iniciarBloque(bloqueActual);
}

renderInicio();
</script>
</body>
</html>
