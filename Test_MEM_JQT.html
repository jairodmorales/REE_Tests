<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Test REE — Montaje Electromecánico (JQT)</title>
<style>
:root{
  --blue:#185FA5;--blue-l:#E6F1FB;--blue-m:#378ADD;
  --green:#0F6E56;--green-l:#E1F5EE;--green-b:#1D9E75;
  --red:#993C1D;--red-l:#FAECE7;--red-b:#D85A30;
  --amber:#854F0B;--amber-l:#FAEEDA;
  --gray:#5F5E5A;--gray-l:#F1EFE8;--gray-m:#D3D1C7;
  --text:#2C2C2A;--muted:#888780;
  --bg:#fff;--bg2:#F8F7F4;
  --bd:rgba(0,0,0,0.12);--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Georgia',serif;background:var(--bg2);color:var(--text);min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:2rem 1rem}

/* ── INICIO ── */
#s-inicio{display:block}
.inicio-header{text-align:center;margin-bottom:2rem}
.inicio-header h1{font-size:1.9rem;font-weight:normal;letter-spacing:-.5px}
.inicio-header .sub{color:var(--muted);font-size:.9rem;margin-top:.3rem}
.inicio-header .total-badge{display:inline-block;margin-top:.75rem;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:.3rem .9rem;font-size:.8rem;color:var(--muted)}

/* tarjeta bloque */
.bloque-card{
  background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);
  padding:1rem 1.25rem;margin-bottom:.75rem;cursor:pointer;
  transition:border-color .15s,box-shadow .15s;
  display:flex;align-items:center;gap:1rem;
}
.bloque-card:hover{border-color:var(--blue-m);box-shadow:0 2px 8px rgba(0,0,0,.07)}
.bloque-num{
  width:36px;height:36px;border-radius:50%;background:var(--bg2);
  border:1.5px solid var(--bd);display:flex;align-items:center;
  justify-content:center;font-size:.8rem;font-weight:bold;
  font-family:monospace;color:var(--muted);flex-shrink:0;transition:all .15s;
}
.bloque-card:hover .bloque-num{border-color:var(--blue);color:var(--blue)}
.bloque-info{flex:1;min-width:0}
.bloque-titulo{font-size:.95rem;color:var(--text);line-height:1.4}
.bloque-meta{font-size:.78rem;color:var(--muted);margin-top:.25rem}
.bloque-stats{display:flex;gap:.5rem;flex-shrink:0;align-items:center}
.bs-pill{font-size:.72rem;padding:3px 9px;border-radius:12px;font-weight:bold;white-space:nowrap}
.bs-ok{background:var(--green-l);color:var(--green)}
.bs-fail{background:var(--red-l);color:var(--red)}
.bs-blank{background:var(--gray-l);color:var(--gray)}
.bs-pct{font-size:.78rem;color:var(--muted);font-weight:bold}

/* estado card */
.bloque-card.estado-progress .bloque-num{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
.bloque-card.estado-done .bloque-num{background:var(--green-b);border-color:var(--green-b);color:#fff}
.bloque-card.estado-done{border-color:rgba(29,158,117,.3)}

/* ── TEST ── */
#s-test{display:none}
.test-topbar{display:flex;justify-content:space-between;align-items:center;
  background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);
  padding:.75rem 1.1rem;margin-bottom:1rem}
.test-topbar .ttitle{font-size:.85rem}
.test-topbar .ttitle strong{display:block;font-size:.95rem}
.btn-volver{background:none;border:1px solid var(--bd);border-radius:8px;
  padding:.45rem 1rem;font-size:.82rem;cursor:pointer;color:var(--muted);transition:all .15s}
.btn-volver:hover{border-color:var(--blue);color:var(--blue)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1rem}
.stat{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:.6rem;text-align:center}
.stat .sn{font-size:1.35rem;font-weight:bold}
.stat .sl{font-size:.7rem;color:var(--muted);margin-top:1px}

/* nav dots */
.q-nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1rem}
.q-dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--bd);
  font-size:.72rem;font-weight:bold;cursor:pointer;display:flex;align-items:center;
  justify-content:center;color:var(--muted);background:var(--bg);transition:all .15s;font-family:monospace}
.q-dot:hover{border-color:var(--blue);color:var(--blue)}
.q-dot.current{border:2px solid var(--blue);color:var(--blue);background:var(--blue-l)}
.q-dot.correct{background:var(--green-b);color:#fff;border-color:var(--green-b)}
.q-dot.wrong{background:var(--red-b);color:#fff;border-color:var(--red-b)}

/* pregunta */
.q-box{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:1.4rem;margin-bottom:1rem}
.q-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.65rem}
.q-text{font-size:.97rem;line-height:1.65;margin-bottom:1.15rem}
.opt{display:flex;align-items:flex-start;gap:10px;padding:.8rem .95rem;border-radius:8px;
  border:1.5px solid var(--bd);margin-bottom:.45rem;transition:all .2s;
  font-size:.88rem;background:var(--bg2);cursor:pointer;user-select:none}
.opt:hover:not(.locked){border-color:var(--blue-m);background:var(--blue-l)}
.opt.locked{cursor:default}
.opt.sel-ok{border-color:var(--green-b);background:var(--green-l);color:#085041}
.opt.sel-fail{border-color:var(--red-b);background:var(--red-l);color:#712B13}
.opt.show-ok{border-color:var(--green-b);background:var(--green-l);color:#085041}
.opt-key{font-weight:bold;min-width:18px;font-family:monospace;color:var(--muted);flex-shrink:0}
.opt.sel-ok .opt-key,.opt.show-ok .opt-key{color:var(--green-b)}
.opt.sel-fail .opt-key{color:var(--red-b)}

/* feedback */
.feedback{border-radius:8px;padding:.85rem 1rem;margin-top:.9rem;font-size:.86rem;line-height:1.6;display:none}
.feedback.show{display:block}
.feedback.fb-ok{background:var(--green-l);border:1px solid var(--green-b);color:#085041}
.feedback.fb-fail{background:var(--red-l);border:1px solid var(--red-b);color:#712B13}
.fb-title{font-weight:bold;margin-bottom:.3rem}
.fb-ref{font-size:.74rem;margin-top:.45rem;opacity:.75;font-style:italic}

/* nav row */
.nav-row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:1.1rem}
.btn{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:.55rem 1.1rem;
  font-size:.83rem;cursor:pointer;color:var(--text);transition:all .15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn-finish{background:var(--green);color:#fff;border:none;border-radius:8px;
  padding:.7rem 1.6rem;font-size:.88rem;cursor:pointer;display:block;margin:.9rem auto 0;transition:opacity .2s}
.btn-finish:hover{opacity:.88}

/* ── RESULTADO BLOQUE ── */
#s-result{display:none}
.res-banner{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);
  padding:1.75rem;text-align:center;margin-bottom:1rem}
.res-nums{display:flex;justify-content:center;gap:1.5rem;margin:.75rem 0}
.res-num .n{font-size:2.2rem;font-weight:bold;font-family:monospace}
.res-num .l{font-size:.75rem;color:var(--muted)}
.stats-res{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1.25rem}
.rev-section-title{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.65rem}
.rev-item{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:.95rem 1.1rem;margin-bottom:.55rem}
.rev-item.fail{border-left:4px solid var(--red-b)}
.rev-item.blank{border-left:4px solid var(--gray-m)}
.rev-q{font-size:.88rem;line-height:1.5;margin-bottom:.45rem}
.rev-ans{font-size:.8rem;margin-bottom:.35rem}
.rev-exp{font-size:.8rem;line-height:1.5;margin-bottom:.3rem}
.rev-ref{font-size:.73rem;color:var(--muted);font-style:italic}
.tag{font-size:.68rem;padding:2px 7px;border-radius:12px;font-weight:bold;display:inline-block;margin-bottom:.35rem}
.tag-fail{background:var(--red-l);color:var(--red)}
.tag-blank{background:var(--gray-l);color:var(--gray)}
.res-actions{display:flex;gap:.75rem;justify-content:center;margin-top:1.25rem}
.btn-reiniciar{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:.65rem 1.5rem;font-size:.88rem;cursor:pointer}
.btn-volver2{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:.65rem 1.5rem;font-size:.88rem;cursor:pointer;color:var(--text)}
.btn-volver2:hover{border-color:var(--blue);color:var(--blue)}

@media(max-width:500px){
  .stats,.stats-res{grid-template-columns:repeat(2,1fr)}
  .res-nums{gap:1rem}
  .bloque-stats{flex-direction:column;gap:.25rem;align-items:flex-end}
}
</style>
</head>
<body>
<div id="app">

<!-- INICIO -->
<div id="s-inicio">
  <div class="inicio-header">
    <h1>Test Montaje Electromecánico</h1>
    <div class="sub">Preparación Habilitación REE — Material complementario</div>
    <div class="total-badge">12 bloques · 150 preguntas</div>
  </div>
  <div id="lista-bloques"></div>
</div>

<!-- TEST -->
<div id="s-test">
  <div class="test-topbar">
    <div class="ttitle">
      <strong id="t-titulo">Bloque</strong>
      <span id="t-subtitulo" style="color:var(--muted);font-size:.8rem"></span>
    </div>
    <button class="btn-volver" onclick="volverInicio()">← Inicio</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="sn" id="s-ans" style="color:var(--blue)">0</div><div class="sl">Respondidas</div></div>
    <div class="stat"><div class="sn" id="s-blank">0</div><div class="sl">En blanco</div></div>
    <div class="stat"><div class="sn" id="s-rem" style="color:var(--amber)">0</div><div class="sl">Restantes</div></div>
  </div>
  <div class="q-nav" id="q-nav"></div>
  <div class="q-box">
    <div class="q-label" id="q-label">Pregunta 1</div>
    <div class="q-text" id="q-text"></div>
    <div id="options"></div>
    <div class="feedback" id="feedback">
      <div class="fb-title" id="fb-title"></div>
      <div id="fb-body"></div>
      <div class="fb-ref" id="fb-ref"></div>
    </div>
    <div class="nav-row">
      <button class="btn" onclick="navigate(-1)">← Anterior</button>
      <button class="btn" onclick="navigate(1)">Siguiente →</button>
    </div>
  </div>
  <button class="btn-finish" onclick="finishBloque()">Finalizar bloque</button>
</div>

<!-- RESULTADO -->
<div id="s-result">
  <div class="res-banner">
    <div style="font-size:.85rem;color:var(--muted);margin-bottom:.25rem" id="res-bname"></div>
    <div class="res-nums">
      <div class="res-num"><div class="n" id="res-ok" style="color:var(--green-b)">—</div><div class="l">Correctas</div></div>
      <div class="res-num"><div class="n" id="res-fail" style="color:var(--red-b)">—</div><div class="l">Incorrectas</div></div>
      <div class="res-num"><div class="n" id="res-blank">—</div><div class="l">En blanco</div></div>
    </div>
    <div style="font-size:.82rem;color:var(--muted)" id="res-pct"></div>
  </div>
  <div class="rev-section-title" id="rev-title"></div>
  <div id="review-list"></div>
  <div class="res-actions">
    <button class="btn-volver2" onclick="volverInicio()">← Volver al inicio</button>
    <button class="btn-reiniciar" onclick="reiniciarBloque()">Reiniciar bloque</button>
  </div>
</div>

</div><!-- /app -->
<script>
const BLOQUES=[{"titulo":"Bloque 1 (Zonas climáticas, viento, hielo y criterios mecánicos","qs":[{"p":"Una instalación exterior situada a 450 m s.n.m. se clasificaría normalmente, para hipótesis climáticas RLAT, como:","o":{"a":"Zona B: Altitud comprendida entre 500 m y 1.000 m s.n.m.","b":"Zona C: Altitud superior a los 1.000 m s.n.m.","c":"Zona A: Altitud no superior a los 500 m s.n.m.","d":"Zona de Alta Contaminación: Sujeta a criterios de diseño específicos de Red Eléctrica para costa."},"c":"c","ref":"RLAT ITC-LAT-07 Apartado 3.1","exp":"El RLAT clasifica las zonas climáticas por altitud; la Zona A corresponde a instalaciones situadas a menos de 500 m sobre el nivel del mar."},{"p":"Si una subestación está a 650 m s.n.m., el criterio reglamentario de partida para cargas climáticas sería:","o":{"a":"Zona A, siempre que se justifique una baja exposición a vientos dominantes según norma ISO.","b":"Zona B, por situarse en el intervalo de altitud reglamentaria de 500 m a 1.000 m.","c":"Zona C, debido a que el nivel de aislamiento nominal (BIL) es superior a 170 kV.","d":"Zona A, si se emplean conductores con recubrimientos que mitiguen la acumulación de partículas de hielo."},"c":"b","ref":"RLAT ITC-LAT-07 Apartado 3.1","exp":"Las instalaciones situadas entre 500 y 1.000 metros de altitud se encuadran obligatoriamente en la Zona B para el cálculo de esfuerzos mecánicos."},{"p":"En una conexión flexible entre pórtico y equipo, la hipótesis de temperatura máxima se usa principalmente para:","o":{"a":"Determinar la tensión mecánica de tracción máxima para el dimensionamiento del herraje de amarre.","b":"Validar que la carga secundaria (burden) del TC no sature el núcleo ante variaciones de resistencia.","c":"Establecer la capacidad de cortocircuito simétrica de los conectores de potencia en régimen térmico.","d":"Comprobar la flecha máxima y asegurar el cumplimiento de las distancias eléctricas mínimas de seguridad."},"c":"d","ref":"UNE-EN 61936-1 Apartado 4.3.2 / ITC-RAT-12","exp":"La temperatura máxima de servicio provoca la mayor dilatación del conductor (flecha máxima), lo que compromete las distancias de aislamiento fase-tierra y fase-fase."},{"p":"En un conductor tendido, la hipótesis de baja temperatura suele ser crítica para:","o":{"a":"Verificar la tensión mecánica máxima y los esfuerzos transmitidos a los apoyos, aisladores y bornes de equipo.","b":"Verificar el cumplimiento de la distancia mínima de aislamiento vertical (gálibo) al nivel del suelo.","c":"Determinar la clase de precisión requerida para los transformadores de tensión en punto frontera.","d":"Calcular la longitud de fuga específica para aisladores poliméricos en zonas de alta salinidad."},"c":"a","ref":"UNE-EN 61936-1 Apartado 4.3.2","exp":"La baja temperatura provoca la contracción del conductor, alcanzando su tracción máxima y transmitiendo mayores cargas estructurales a pórticos y aparamenta."},{"p":"Al aumentar la velocidad de viento de cálculo sobre un conductor, debe revisarse especialmente:","o":{"a":"Únicamente la ampacidad en régimen permanente debido al efecto de convección forzada.","b":"La impedancia de transferencia de la malla de puesta a tierra ante transitorios rápidos.","c":"La carga transversal, la desviación lateral del conductor (swing) y las distancias de seguridad reales.","d":"La relación de transformación nominal y el factor de límite de precisión de los TC."},"c":"c","ref":"UNE-EN 61936-1 Apartado 4.3.5 / ITC-RAT-15","exp":"El viento ejerce una fuerza transversal que desplaza los conductores (balanceo), reduciendo las distancias de aislamiento fase-fase y fase-estructura."},{"p":"En una salida de línea desde pórtico, el esfuerzo longitudinal debe considerarse porque:","o":{"a":"Es el factor determinante para la selección exclusiva de la grapa de suspensión y el herraje.","b":"Puede gobernar el diseño estructural del pórtico, sus cimentaciones y las cadenas de amarre.","c":"Dicho esfuerzo se considera nulo por normativa si existe un cable de guarda superior debidamente tensado.","d":"Solo influye en el cálculo de la sección térmica de los puentes de tierra de las estructuras metálicas."},"c":"b","ref":"UNE-EN 61936-1 Apartado 4.3.2 / ITC-RAT-15","exp":"El tiro longitudinal de los conductores es una de las cargas normales principales que definen la estabilidad mecánica y el diseño de las fundaciones de los pórticos de amarre."},{"p":"Al pasar de Zona A a Zona B, el efecto más relevante en el cálculo mecánico es:","o":{"a":"La disminución obligatoria de la carga vertical permanente sobre los aisladores soporte de barras.","b":"La eliminación de la hipótesis de viento máximo debido a la atenuación por altitud.","c":"Una reducción del factor de corrección Ka para el nivel de aislamiento nominal de la instalación.","d":"La inclusión obligatoria de la carga de manguito de hielo sobre los conductores en los cálculos de tracción."},"c":"d","ref":"RLAT ITC-LAT-07 Apartado 3.1 / UNE-EN 61936-1 4.3.4","exp":"La Zona B reglamentaria exige considerar la formación de hielo, incrementando significativamente el peso lineal y la carga vertical sobre apoyos y equipos."},{"p":"Aunque un emplazamiento sea Zona A, puede justificarse revisar hielo si:","o":{"a":"La altitud es próxima al límite de 500 m o los requerimientos del proyecto exigen un criterio conservador.","b":"La instalación dispone de equipos blindados (GIS) situados en el interior de edificios de obra civil.","c":"El conductor principal es un cable aislado directamente enterrado o en galería hormigonada.","d":"Se pretende sustituir legalmente la hipótesis de viento transversal por una carga vertical equivalente."},"c":"a","ref":"RLAT ITC-LAT-07 / ITC-RAT-20","exp":"El proyectista puede adoptar criterios más estrictos que el mínimo reglamentario para garantizar la robustez del diseño electromecánico."},{"p":"Si el conductor se tiende con mayor tensión inicial que la prevista, el efecto más probable es:","o":{"a":"Un incremento del margen dieléctrico ante sobretensiones de frente rápido (VFT).","b":"Un incremento severo de los esfuerzos mecánicos sobre pórticos, cadenas de aisladores y bornes de equipos.","c":"Una reducción de la impedancia de secuencia positiva del vano por efecto geométrico.","d":"La mejora de la clase de precisión de los transformadores de intensidad de la posición."},"c":"b","ref":"UNE-EN 61936-1 Apartado 4.3.2 / ITC-RAT-15","exp":"Un exceso de tensión mecánica reduce la flecha pero aumenta peligrosamente la carga longitudinal sobre las estructuras y la solicitación mecánica en los bornes de la aparamenta."},{"p":"En un vano corto de subestación, el cálculo mecánico sigue siendo necesario porque:","o":{"a":"La flecha relativa siempre es superior a la de las líneas de transporte de gran longitud.","b":"Permite omitir la verificación de los esfuerzos electrodinámicos originados por el cortocircuito.","c":"Puede transmitir esfuerzos estáticos importantes a los bornes de equipos sensibles ante variaciones térmicas.","d":"Garantiza que el conductor no experimentará vibraciones eólicas en ningún rango de frecuencia."},"c":"c","ref":"UNE-EN 61936-1 Apartado 6.2.9.2 / ITC-RAT-15","exp":"Incluso en vanos cortos, las contracciones por frío pueden ejercer tensiones mecánicas inadmisibles sobre las porcelanas o terminales de los equipos si no están calculadas."},{"p":"Si se aumenta el diámetro de un conductor tendido, debe revisarse:","o":{"a":"Exclusivamente la capacidad térmica de cortocircuito (Integral de Joule) del nuevo conductor.","b":"Únicamente la flecha máxima vertical en la hipótesis climática de temperatura de +85 ºC.","c":"Solo la resistencia de contacto en los herrajes bimetálicos para evitar la corrosión galvánica.","d":"Peso, carga de viento, conectores, efecto corona, flecha máxima y esfuerzos estructurales resultantes."},"c":"d","ref":"ITC-RAT-15 / UNE-EN 61936-1 Apartado 4.3.5","exp":"Un cambio dimensional afecta a la superficie expuesta al viento, al peso propio y a la distribución del campo eléctrico superficial, requiriendo un recalculo integral."},{"p":"Una hipótesis conservadora de hielo en embarrados flexibles de subestación puede usarse para:","o":{"a":"Validar la robustez del diseño estructural ante condiciones meteorológicas desfavorables no habituales.","b":"Reducir artificialmente las cargas mecánicas totales sobre las cimentaciones de los pórticos.","c":"Eliminar la necesidad técnica de realizar el cálculo de viento máximo según los criterios del RLAT.","d":"Sustituir la comprobación obligatoria de distancias dieléctricas en condiciones normales de operación."},"c":"a","ref":"ITC-RAT-20 / UNE-EN 61936-1","exp":"Adoptar hipótesis de carga adicionales permite asegurar que el sistema electromecánico es resiliente frente a fenómenos meteorológicos extremos."},{"p":"La carga de viento sobre un conductor se traduce principalmente en:","o":{"a":"Un incremento del error de amplitud en la medida oficial según el reglamento RUPM.","b":"Un esfuerzo transversal sobre el conductor, herrajes y estructuras de soporte (pórticos o apoyos).","c":"Una mejora sustancial de la longitud de fuga de las cadenas de aisladores por efecto de limpieza.","d":"Una reducción de la corriente nominal admisible por el aumento de la resistencia óhmica."},"c":"b","ref":"UNE-EN 61936-1 Apartado 4.3.5","exp":"El viento actúa perpendicularmente al eje del conductor, generando momentos flectores en los soportes y desviaciones angulares en las cadenas."},{"p":"La carga de hielo sobre un conductor genera principalmente:","o":{"a":"Una reducción del peso lineal total debido al desplazamiento del volumen de aire.","b":"Una disminución de las solicitaciones verticales aplicadas sobre los aisladores soporte de barras.","c":"La anulación de los esfuerzos longitudinales sobre los pórticos de amarre en caso de rotura.","d":"Un aumento del peso lineal del vano y de las cargas verticales transmitidas a los equipos y estructuras."},"c":"d","ref":"RLAT ITC-LAT-07 / UNE-EN 61936-1 Apartado 4.3.4","exp":"El manguito de hielo añade masa al conductor, lo que incrementa la tracción mecánica longitudinal y la carga vertical sobre la aparamenta."},{"p":"Para verificar una estructura soporte de una salida aérea, la combinación más completa incluye:","o":{"a":"Exclusivamente el peso propio de los conductores y aisladores en condiciones de vacío (reposo).","b":"Únicamente el viento transversal máximo incidente a la temperatura de referencia de +15 ºC.","c":"Peso, tiro longitudinal, viento máximo, hielo si aplica y esfuerzos por desequilibrio o rotura.","d":"Solo la corriente nominal permanente para evaluar la dilatación térmica de la estructura metálica."},"c":"c","ref":"UNE-EN 61936-1 Apartado 4.3.1 / ITC-RAT-15","exp":"El dimensionamiento estructural robusto requiere considerar la superposición de cargas permanentes, variables y excepcionales para garantizar la estabilidad del conjunto."}]},{"titulo":"Bloque 2: Conductores tendidos, flecha y cadenas","qs":[{"p":"Un conductor flexible demasiado corto entre equipo y barra puede provocar:","o":{"a":"Un incremento descontrolado de la impedancia de secuencia cero en el tramo afectado.","b":"Esfuerzos mecánicos inadmisibles sobre los aisladores o bornes ante contracciones por baja temperatura.","c":"Un aumento de la longitud de fuga superficial por el efecto de proximidad a masa.","d":"Una reducción del nivel de cortocircuito simétrico debido a la restricción geométrica."},"c":"b","ref":"UNE-EN 61936-1 Apartado 6.2.9.2","exp":"La norma exige prever las variaciones de longitud por temperatura; un conductor corto transmite tensiones mecánicas estáticas que pueden fracturar porcelanas o dañar sellados de equipos de AT."},{"p":"Una conexión flexible se usa principalmente para:","o":{"a":"Reducir la impedancia de transferencia ante transitorios de frente muy rápido (VFT).","b":"Absorber variaciones dimensionales de origen térmico, tolerancias de montaje y solicitaciones mecánicas.","c":"Mitigar la formación de efluvios por efecto corona en bornes de equipos de AT.","d":"Optimizar el reparto de la densidad de corriente en conductores dispuestos en haz."},"c":"b","ref":"UNE-EN 61936-1 Apartado 6.2.9.2 / ITC-RAT-15","exp":"La flexibilidad es una medida de diseño obligatoria para desacoplar mecánicamente equipos y estructuras frente a dilataciones o vibraciones."},{"p":"Una cadena de amarre debe comprobarse principalmente frente a:","o":{"a":"Únicamente la carga vertical resultante del peso propio del aislador y herrajes asociados.","b":"La tracción longitudinal máxima del conductor considerando las hipótesis climáticas y el coeficiente de seguridad.","c":"El nivel de aislamiento nominal (BIL) sin considerar el impacto de la altitud de la instalación.","d":"La corriente nominal secundaria del devanado de medida de los transformadores de intensidad."},"c":"b","ref":"UNE-EN 61936-1 Apartado 4.3.2 / ITC-RAT-15","exp":"Las cadenas de amarre soportan la tensión mecánica del tendido, que alcanza su valor crítico bajo la hipótesis de baja temperatura o manguito de hielo."},{"p":"En ambiente contaminado, una cadena puede ser mecánicamente válida pero no aceptable porque:","o":{"a":"Su carga de rotura nominal excede los límites operativos del herraje de fijación al pórtico.","b":"El recubrimiento galvánico de los herrajes genera un par galvánico con la estructura de acero.","c":"No cumple con la longitud de fuga mínima específica requerida por el grado de polución ambiental.","d":"La flecha máxima resultante a temperatura de régimen excede los gálibos de seguridad."},"c":"c","ref":"UNE-EN 61936-1 Apartado 6.2.8 / ITC-RAT-12","exp":"El diseño dieléctrico en zonas contaminadas obliga a una longitud de fuga (creepage) mínima para evitar descargas por contorneo superficial bajo humedad."},{"p":"La flecha máxima de un conductor debe revisarse respecto a:","o":{"a":"Distancias eléctricas mínimas de seguridad a suelo, equipos, fases, estructuras y pasillos.","b":"La ubicación exacta del punto frontera definido en el RUPM para el intercambio de energía.","c":"El valor del Ground Potential Rise (GPR) calculado para la malla de tierra general.","d":"La integral de Joule de cortocircuito para evitar el recocido del material conductor."},"c":"a","ref":"ITC-RAT-12 Apartado 3 / UNE-EN 61936-1 7.2.4","exp":"El cálculo de la flecha máxima es crítico para garantizar que no se invaden las distancias mínimas fase-tierra o fase-pasillo exigidas por reglamento."},{"p":"Si se sustituye un conductor por otro de mayor peso lineal, manteniendo la misma tensión de tendido:","o":{"a":"Se produce una reducción proporcional de la flecha máxima debido a la mayor inercia térmica.","b":"Se incrementa la flecha y aumentan las solicitaciones verticales transmitidas a aisladores y equipos.","c":"No existe impacto técnico si el nivel de aislamiento nominal (BIL) permanece constante.","d":"Se reduce automáticamente la carga de viento transversal por el cambio en el coeficiente de arrastre."},"c":"b","ref":"UNE-EN 61936-1 Apartado 4.3.1 / RLAT ITC-LAT-07","exp":"Bajo una misma tracción mecánica, una mayor masa lineal incrementa la profundidad de la catenaria y la carga gravitatoria sobre los soportes."},{"p":"Una cadena de suspensión trabaja principalmente frente a:","o":{"a":"La tracción longitudinal total del conductor en condiciones de frío extremo sin viento.","b":"Cargas verticales de peso y desviaciones transversales (balanceo) provocadas por el viento.","c":"La soportabilidad térmica adiabática ante corrientes de falta a tierra de larga duración.","d":"La tensión auxiliar de alimentación de los sistemas de servicios esenciales de la planta."},"c":"b","ref":"UNE-EN 61936-1 Apartado 4.3.5","exp":"Las cadenas de suspensión están diseñadas para soportar peso y oscilar transversalmente (swing), afectando a las distancias de aislamiento lateral."},{"p":"Una cadena montada con un ángulo distinto al previsto en el diseño original requiere revisar:","o":{"a":"El factor de corrección por altitud del aislamiento externo de la aparamenta asociada.","b":"La descomposición vectorial de esfuerzos y el cumplimiento real de las distancias eléctricas resultantes.","c":"La clase de precisión y el burden secundario de los transformadores de tensión.","d":"La longitud de fuga específica para aisladores poliméricos según la norma IEC 60815."},"c":"b","ref":"ITC-RAT-15 Apartado 3.4 / UNE-EN 61936-1","exp":"Un cambio angular altera la resultante de fuerzas sobre la estructura y puede desplazar el conductor hacia zonas de servidumbre dieléctrica."},{"p":"La tabla de tendido de un conductor debe relacionar normalmente:","o":{"a":"Temperatura ambiente prevista, tensión mecánica a aplicar y flecha teórica del vano.","b":"Relación de transformación, saturación del núcleo y resistencia de los cables secundarios.","c":"Potencia activa, reactiva y pérdidas Joule calculadas a la temperatura máxima de servicio.","d":"Nivel de aislamiento (BIL), grado de contaminación y número de aisladores por cadena."},"c":"a","ref":"RLAT ITC-LAT-07 / Especificaciones Técnicas de Montaje","exp":"La tabla de tendido es la guía de campo que asegura que el conductor se instale con la tensión mecánica adecuada para cumplir con la geometría de diseño."},{"p":"Si la flecha calculada reduce una distancia eléctrica por debajo del criterio admisible, la solución técnica correcta es:","o":{"a":"Validar la instalación si el vano es de corta longitud y no afecta a la vialidad interior.","b":"Reducir el nivel de aislamiento nominal (BIL) declarado para la posición para compensar la falta de aire.","c":"Modificar altura de apoyos, tensión mecánica, geometría del vano o sección del conductor.","d":"Instalar exclusivamente señalización de advertencia de riesgo eléctrico en el perímetro afectado."},"c":"c","ref":"ITC-RAT-12 Apartado 3.3 / UNE-EN 61936-1","exp":"El cumplimiento de las distancias mínimas es un requisito reglamentario de seguridad industrial que no admite excepciones sin rediseño electromecánico."},{"p":"En un conductor tendido conectado directamente a un equipo, debe revisarse especialmente:","o":{"a":"Únicamente que la ampacidad del conductor sea superior a la corriente de carga nominal.","b":"Que la solicitación mecánica sobre el borne no exceda los límites de diseño definidos por el fabricante.","c":"Que el código de colores de las fases coincida con la rotulación del sistema SCADA.","d":"La resistencia de puesta a tierra de la estructura metálica del pórtico de amarre."},"c":"b","ref":"UNE-EN 61936-1 Apartado 6.2.9.2 / ITC-RAT-15","exp":"Los aisladores de aparamenta tienen una capacidad mecánica limitada (cantilever); el tiro del conductor no debe comprometer la integridad estructural del equipo."},{"p":"Un conductor flexible no debe usarse para compensar grandes errores de disposición (layout) porque:","o":{"a":"Puede introducir esfuerzos mecánicos no calculados y violar las distancias mínimas de seguridad.","b":"Incrementa de forma sistemática la resistencia de puesta a tierra de la posición de AT.","c":"Provoca una reducción inaceptable del nivel de aislamiento a impulsos tipo rayo (BIL).","d":"Genera errores de fase que saturan los núcleos de protección de los transformadores de intensidad."},"c":"a","ref":"UNE-EN 61936-1 Apartado 6.2.9.5 / ITC-RAT-12","exp":"Un uso improvisado de conductores flexibles puede derivar en oscilaciones excesivas por viento o tensiones por frío que no fueron consideradas en el diseño original."},{"p":"En un vano con conductor de guarda situado sobre las fases, debe comprobarse:","o":{"a":"Únicamente el peso lineal del cable de guarda superior en condiciones de reposo térmico.","b":"El cumplimiento de los límites de tensión de paso y contacto bajo el vano afectado.","c":"Las distancias dieléctricas entre guarda y fases en las condiciones mecánicas más desfavorables.","d":"La integral de Joule de la pantalla del cable de guarda ante faltas bifásicas aisladas."},"c":"c","ref":"RLAT ITC-LAT-07 / ITC-RAT-15","exp":"Debe verificarse que ante viento o hielo no se produzca un acercamiento peligroso entre el cable de tierra y los conductores en tensión."},{"p":"El criterio de selección integral de una cadena de aisladores debe combinar:","o":{"a":"Únicamente el valor de la longitud de fuga superficial por cada kV de tensión asignada.","b":"Nivel de aislamiento (BIL), grado de contaminación, capacidad de carga mecánica y montaje.","c":"El color del material aislante y la altura total respecto a la base del soporte metálico.","d":"La clase de precisión de medida oficial y la corriente nominal de cortocircuito asimétrica."},"c":"b","ref":"UNE-EN 61936-1 Apartado 6.2.8","exp":"La elección técnica debe equilibrar el rendimiento eléctrico, el comportamiento químico ante polución y la resistencia estructural ante cargas traccionales."},{"p":"Si la longitud de un conductor flexible es excesiva, el riesgo técnico principal es:","o":{"a":"Un incremento inaceptable de la carga secundaria (burden) en el transformador de intensidad.","b":"Movimiento excesivo por viento, invasión de distancias de seguridad o interferencias entre fases.","c":"Una reducción del factor de corrección por densidad del aire para el aislamiento externo.","d":"El aumento de la resistencia de contacto en la malla de puesta a tierra general."},"c":"b","ref":"UNE-EN 61936-1 Apartado 4.3.9 / ITC-RAT-12","exp":"Un exceso de longitud facilita el balanceo (swing) del conductor, lo que puede provocar arcos eléctricos contra estructuras o fases vecinas en condiciones de viento."}]},{"titulo":"Bloque 3: Conductores aislados y cables AT","qs":[{"p":"En cables AT enterrados, el parámetro del terreno más influyente en la ampacidad es:","o":{"a":"La permitividad dieléctrica relativa del lecho de arena de protección.","b":"La resistividad eléctrica transversal de la malla de tierra circundante.","c":"La resistividad térmica del terreno y del material de relleno de la zanja.","d":"La profundidad crítica de penetración de las corrientes de secuencia cero."},"c":"c","ref":"RLAT ITC-LAT-06 / UNE 21144","exp":"La capacidad de disipación de calor del cable hacia el ambiente depende directamente de la resistencia térmica que ofrece el terreno, limitando la temperatura máxima del aislamiento."},{"p":"Si la resistividad térmica del terreno aumenta, normalmente:","o":{"a":"Se incrementa la capacidad de transporte de corriente (ampacidad) del circuito.","b":"Aumenta la tensión inducida en la pantalla metálica por efecto inductivo.","c":"Disminuye la ampacidad admisible para no exceder la temperatura de diseño del cable.","d":"Se reduce el factor de pérdidas dieléctricas (tan delta) del aislamiento principal."},"c":"c","ref":"RLAT ITC-LAT-06 / IEC 60287","exp":"Una mayor resistividad térmica dificulta la evacuación del calor generado por efecto Joule, obligando a reducir la corriente de carga para proteger el aislamiento."},{"p":"En una zanja con varias ternas de cables de AT, debe considerarse:","o":{"a":"Únicamente la terna con la carga nominal más elevada del conjunto.","b":"El efecto de calentamiento mutuo y la aplicación de factores de agrupamiento.","c":"La impedancia de secuencia negativa del conjunto de circuitos en paralelo.","d":"La reducción de la rigidez dieléctrica del terreno por efecto de la ionización local."},"c":"b","ref":"RLAT ITC-LAT-06 Apartado 5 / UNE 21144","exp":"La proximidad de otros cables portadores de carga eleva la temperatura ambiente de la zanja, requiriendo factores de reducción en la intensidad admisible de cada cable."},{"p":"El sistema 'single-point bonding' en pantallas de cables de AT busca:","o":{"a":"Maximizar la corriente permanente por pantalla para mitigar campos magnéticos externos.","b":"Garantizar una conexión sólida a tierra en ambos extremos para mejorar el EPR.","c":"Eliminar la necesidad de instalar descargadores de cubierta (SVL) en los terminales.","d":"Reducir las pérdidas por corrientes circulantes controlando la tensión inducida en la pantalla."},"c":"d","ref":"ITC-RAT-06 / IEEE Std 575","exp":"Al conectar la pantalla a tierra en un solo punto se eliminan las corrientes de circulación que generan pérdidas térmicas, aunque se debe vigilar la tensión inducida en el extremo abierto."},{"p":"El uso de SVL (Sheath Voltage Limiters) en pantallas de cable AT se justifica para:","o":{"a":"Limitar sobretensiones transitorias en la pantalla y proteger la cubierta polimérica.","b":"Incrementar la sección efectiva del conductor principal mediante el control del campo.","c":"Sustituir mecánicamente al terminal de intemperie en configuraciones de interior.","d":"Compensar la reactancia capacitiva serie en cables de muy larga distancia."},"c":"a","ref":"ITC-RAT-06 / UNE-EN 61936-1","exp":"Los SVL son pararrayos de baja tensión que protegen el aislamiento de la cubierta contra sobretensiones causadas por rayos o faltas externas en sistemas de puesta a tierra especial (Single-point/Cross-bonding)."},{"p":"Un cable seco (XLPE) frente a uno de aislamiento de papel impregnado destaca por:","o":{"a":"Una permitividad relativa superior que reduce significativamente la corriente de carga.","b":"Mayor temperatura admisible en régimen permanente y menor complejidad de mantenimiento.","c":"Una rigidez dieléctrica intrínseca menor que facilita la detección de descargas parciales.","d":"La capacidad de operar en redes con neutro aislado de forma indefinida sin envejecimiento."},"c":"b","ref":"ITC-RAT-06 / Especificaciones Técnicas REE","exp":"El XLPE permite temperaturas de servicio de hasta 90ºC (frente a los 65-70ºC del papel) y no presenta riesgos de fugas de aceite o migración de fluidos."},{"p":"En el montaje de terminales de AT, la limpieza es crítica para evitar:","o":{"a":"El aumento de la resistencia de contacto en la conexión bimetálica del borne superior.","b":"La reducción de la sección geométrica efectiva del conductor por oxidación instantánea.","c":"El seguimiento superficial (tracking) y fallos dieléctricos por concentración de campo.","d":"Un incremento del factor de pérdidas dieléctricas en el núcleo central del conductor."},"c":"c","ref":"ITC-RAT-06 / UNE-EN 61936-1","exp":"La contaminación en las interfaces del terminal facilita la creación de caminos conductores superficiales que derivan en perforaciones del aislamiento principal."},{"p":"El radio de curvatura mínimo de un cable AT durante su tendido depende de:","o":{"a":"Únicamente la tensión nominal del sistema y el nivel de aislamiento nominal (BIL).","b":"El peso lineal del cable y la fuerza de tracción máxima ejercida por el cabrestante.","c":"La temperatura ambiente y el coeficiente de fricción del lecho de arena de la zanja.","d":"La construcción del cable, su diámetro exterior y la naturaleza de su pantalla o armadura."},"c":"d","ref":"RLAT ITC-LAT-06 Apartado 3.3.3","exp":"Exceder el radio de curvatura mínimo puede dañar de forma irreversible la estanqueidad de la pantalla metálica y las capas semiconductoras del cable."},{"p":"Los esfuerzos de tracción durante el tendido de cables de AT deben limitarse para:","o":{"a":"Prevenir deformaciones permanentes del conductor y daños en las capas semiconductoras.","b":"Evitar el incremento de la inductancia serie por el estiramiento de los hilos de pantalla.","c":"Garantizar que la capacidad térmica de cortocircuito (I²t) no se reduzca por trefilado.","d":"Minimizar el efecto de corona interna en las vacuolas microscópicas del aislamiento."},"c":"a","ref":"RLAT ITC-LAT-06 / Especificaciones de Montaje","exp":"Una tracción excesiva compromete la integridad estructural del cable, pudiendo crear puntos de concentración de estrés eléctrico que reduzcan su vida útil."},{"p":"Una cubierta exterior polimérica dañada en un cable enterrado puede provocar:","o":{"a":"Una reducción inmediata del nivel de aislamiento a frecuencia industrial del conductor.","b":"Un aumento de la resistencia óhmica del conductor por efecto galvánico con el suelo.","c":"Corrosión electrolítica de la pantalla metálica y degradación por entrada de humedad.","d":"La saturación de los núcleos de protección de los transformadores de intensidad asociados."},"c":"c","ref":"ITC-RAT-06 / ITC-RAT-23","exp":"La cubierta es la barrera contra el agua; su perforación permite la entrada de humedad, degradando la pantalla y favoreciendo la formación de 'arborescencias' (water trees) en el aislamiento."},{"p":"El ensayo de la cubierta exterior (ensayo de tensión en CC) se realiza para:","o":{"a":"Determinar la rigidez dieléctrica del aislamiento principal (XLPE/EPR) del cable AT.","b":"Comprobar la ausencia de daños mecánicos y perforaciones tras las operaciones de tendido.","c":"Cuantificar la corriente de fugas a través de los accesorios de puesta a tierra de pantallas.","d":"Medir la resistencia de aislamiento del conductor principal respecto a la pantalla metálica."},"c":"b","ref":"ITC-RAT-23 / RLAT ITC-LAT-06","exp":"Consiste en aplicar 10 kV CC durante 1 minuto entre la pantalla y tierra para asegurar que la cubierta no ha sufrido daños durante el montaje en zanja."},{"p":"En cables dispuestos en haz (formación triplex), el factor de corrección por proximidad busca:","o":{"a":"Ajustar la reactancia mutua para el cálculo de las caídas de tensión en régimen de carga.","b":"Penalizar la ampacidad debido a la interferencia térmica entre conductores adyacentes.","c":"Compensar la reducción de la rigidez dieléctrica del aire entre las fases del haz.","d":"Corregir el error de medida de los transformadores de intensidad de tipo toroidal."},"c":"b","ref":"RLAT ITC-LAT-06 / UNE 21144","exp":"Los cables próximos se calientan entre sí; el factor de corrección reduce la corriente admisible para evitar que la temperatura de los conductores supere los 90ºC."},{"p":"La profundidad de instalación de una zanja de cables de AT influye directamente en:","o":{"a":"La resistencia térmica terreno-superficie y la protección frente a solicitaciones externas.","b":"La tensión inducida en las pantallas metálicas por el acoplamiento magnético con el suelo.","c":"El factor de pérdidas dieléctricas debido a la presión hidrostática ejercida por el terreno.","d":"La impedancia de secuencia cero necesaria para el ajuste de las protecciones de distancia."},"c":"a","ref":"RLAT ITC-LAT-06 / UNE-EN 61936-1","exp":"A mayor profundidad, aumenta la resistencia térmica hacia el exterior (peor ampacidad) pero se incrementa la seguridad mecánica frente a excavaciones o tráfico pesado."},{"p":"El uso de hormigón pobre o materiales de relleno térmico controlado en zanjas sirve para:","o":{"a":"Incremetar la rigidez dieléctrica del conjunto zanja-cable ante sobretensiones tipo rayo.","b":"Reducir la probabilidad de aparición de corrientes de Foucault en el relleno de la zanja.","c":"Sustituir funcionalmente a la pantalla metálica en la canalización de corrientes de falta.","d":"Garantizar una resistividad térmica estable y baja para optimizar la evacuación de calor."},"c":"d","ref":"RLAT ITC-LAT-06 / Especificaciones de diseño REE","exp":"Los materiales de relleno seleccionados aseguran que, incluso en condiciones secas, la disipación térmica sea constante y permita mantener la capacidad de carga nominal."},{"p":"Aumentar la sección nominal de un cable mejora significativamente su comportamiento frente a:","o":{"a":"La capacidad de transporte de corriente y la soportabilidad térmica ante cortocircuitos.","b":"El nivel de aislamiento nominal (BIL) y la coordinación de aislamiento de la planta.","c":"La longitud de fuga mínima requerida para los terminales en zonas de alta contaminación.","d":"La clase de precisión de los transformadores de tensión asociados a la medida oficial."},"c":"a","ref":"ITC-RAT-06 / ITC-RAT-13","exp":"Una mayor sección reduce la resistencia óhmica (menor calentamiento en carga) y aumenta la masa metálica capaz de absorber la energía térmica de una falta (integral de Joule)."}]},{"titulo":"Bloque 4: Embarrados rígidos y cortocircuito","qs":[{"p":"En embarrados rígidos, la corriente de pico de cortocircuito gobierna principalmente:","o":{"a":"La longitud de fuga específica (creepage) requerida para los aisladores soporte.","b":"La precisión de los núcleos de medida de los transformadores de intensidad asociados.","c":"Los esfuerzos electrodinámicos máximos sobre los conductores y sus estructuras de soporte.","d":"La integral de Joule (I²t) para el cálculo de la estabilidad térmica del conductor."},"c":"c","ref":"ITC-RAT-05 Apartado 5.1 / UNE-EN 60865-1","exp":"La fuerza mecánica máxima entre conductores (esfuerzo electrodinámico) es directamente proporcional al cuadrado de la corriente de pico (Ip), la cual se alcanza en el primer semiciclo del cortocircuito."},{"p":"La corriente eficaz de corta duración se usa para:","o":{"a":"La verificación de la estabilidad térmica de los conductores y embarrados ante faltas.","b":"Determinar la altura de los pórticos de amarre para cumplir con el gálibo de seguridad.","c":"La selección del nivel de aislamiento nominal a impulsos tipo rayo (BIL) de la instalación.","d":"Definir las distancias de los pasillos de mantenimiento en instalaciones de interior."},"c":"a","ref":"ITC-RAT-05 Apartado 6","exp":"La corriente eficaz (Ik) define el calentamiento adiabático que el conductor debe soportar durante el tiempo de despeje de la falta sin exceder las temperaturas límite del material."},{"p":"Si el nivel de cortocircuito sube de 31,5 kA a 50 kA, debe revisarse:","o":{"a":"Únicamente la capacidad de ruptura (poder de corte) del interruptor automático de la posición.","b":"La configuración de los servicios auxiliares de corriente continua y el sistema de control SCADA.","c":"La capacidad térmica y dinámica de barras, conectores, aisladores, aparamenta y red de tierra.","d":"El nivel de aislamiento a frecuencia industrial para evitar el contorneo por sobretensión."},"c":"c","ref":"ITC-RAT-05 / ITC-RAT-13","exp":"Un incremento en la intensidad de falta aumenta cuadráticamente los esfuerzos mecánicos y linealmente la energía térmica disipada en toda la cadena de transporte de corriente y disipación a tierra."},{"p":"Los esfuerzos electrodinámicos entre fases dependen principalmente de:","o":{"a":"La tensión nominal del sistema y el factor de corrección por altitud del aislamiento externo.","b":"La corriente de pico de cortocircuito y la separación geométrica entre ejes de conductores.","c":"La temperatura ambiente máxima de diseño y la velocidad del viento transversal.","d":"La longitud de fuga acumulada en la cadena de aisladores y la resistividad del terreno."},"c":"b","ref":"ITC-RAT-05 Apartado 5.1 / UNE-EN 61936-1","exp":"Según la ley de Biot-Savart, la fuerza es proporcional al producto de las corrientes (en falta Ip²) e inversamente proporcional a la distancia entre los conductores."},{"p":"Si se reduce la separación entre fases en una barra rígida:","o":{"a":"Se reduce proporcionalmente el esfuerzo dinámico sobre los aisladores soporte.","b":"Se incrementa el margen dieléctrico de la instalación ante sobretensiones de maniobra.","c":"No existe impacto técnico relevante si el conductor mantiene su sección circular (tubular).","d":"Aumentan los esfuerzos electrodinámicos y se reduce el margen de aislamiento en aire."},"c":"d","ref":"ITC-RAT-05 / ITC-RAT-12","exp":"Menor distancia implica mayores fuerzas magnéticas de repulsión/atracción ante faltas y, simultáneamente, una reducción del aislamiento galvánico fase-fase."},{"p":"La junta de dilatación en una barra rígida sirve para:","o":{"a":"Absorber las variaciones térmicas longitudinales y evitar tensiones mecánicas en los soportes.","b":"Mitigar la formación de efluvios por efecto corona en los puntos de discontinuidad geométrica.","c":"Sustituir funcionalmente al aislador de apoyo en tramos rectos de gran longitud.","d":"Reducir la inductancia de secuencia cero del embarrado ante faltas monofásicas."},"c":"a","ref":"ITC-RAT-05 Apartado 6","exp":"Los cambios de temperatura provocan dilataciones y contracciones que, de no ser absorbidas, podrían fracturar las porcelanas de los aisladores soporte o dañar bornes de equipos."},{"p":"Una barra tubular abollada debe evaluarse por posible afectación de:","o":{"a":"Aspectos puramente estéticos que no comprometen la seguridad industrial de la planta.","b":"Resistencia mecánica al pandeo, distribución del campo eléctrico superficial y efecto corona.","c":"La carga secundaria (burden) del transformador de tensión en configuración de medida oficial.","d":"La impedancia de secuencia positiva necesaria para el ajuste del relé de distancia (21)."},"c":"b","ref":"ITC-RAT-12 / ITC-RAT-15","exp":"Las deformaciones geométricas concentran el campo eléctrico (gradiente) facilitando descargas parciales y reducen la inercia mecánica de la sección frente a esfuerzos dinámicos."},{"p":"Aumentar la distancia entre apoyos de una barra rígida puede incrementar:","o":{"a":"La precisión de los equipos de medida fiscal al reducirse las interferencias magnéticas.","b":"La longitud de fuga de los aisladores poliméricos debido al mayor gálibo vertical.","c":"La flecha por peso propio y el momento flector en los aisladores ante un cortocircuito.","d":"La densidad de corriente admisible (ampacidad) por la mejora en la ventilación natural."},"c":"c","ref":"ITC-RAT-05 / UNE-EN 60865-1","exp":"Mayores vanos entre apoyos aumentan la deflexión mecánica y el brazo de palanca que actúa sobre los aisladores soporte durante la vibración por cortocircuito."},{"p":"El aislador soporte de barras debe verificarse frente a:","o":{"a":"Su altura total respecto a la rasante de la cimentación de obra civil únicamente.","b":"Capacidad de carga mecánica, nivel dieléctrico (BIL) y esfuerzos dinámicos de cortocircuito.","c":"La composición química del esmalte cerámico para garantizar un nivel IP66.","d":"La corriente nominal secundaria del devanado de protección de los TC de barras."},"c":"b","ref":"ITC-RAT-12 / ITC-RAT-15 / UNE-EN 62271-1","exp":"El aislador debe ser capaz de soportar las sobretensiones previstas y las fuerzas mecánicas combinadas (viento, peso y cortocircuito) sin fallo estructural."},{"p":"Una conexión rígida directa a bornes de equipo es admisible si:","o":{"a":"No transmite esfuerzos mecánicos estáticos o dinámicos inadmisibles al borne del equipo.","b":"El equipo dispone de una placa de características grabada mediante tecnología láser.","c":"Se ha aplicado una pintura epoxídica conductora sobre toda la superficie del conector.","d":"La tensión nominal de la instalación es estrictamente inferior a la categoría de 245 kV."},"c":"a","ref":"ITC-RAT-15 Apartado 3 / UNE-EN 61936-1","exp":"Se deben evitar tensiones mecánicas permanentes o picos de fuerza que puedan comprometer la estanqueidad o la integridad de los bushings de la aparamenta."},{"p":"El cortocircuito mínimo afecta especialmente a:","o":{"a":"La longitud de fuga requerida para aisladores situados en zonas de muy fuerte contaminación.","b":"La magnitud de los esfuerzos electrodinámicos de atracción entre las fases del embarrado.","c":"La sensibilidad y el correcto ajuste de las funciones de protección para faltas lejanas.","d":"La sección térmica del conductor de tierra principal de la malla de la subestación."},"c":"c","ref":"ITC-RAT-09 Apartado 1","exp":"Las protecciones deben ser capaces de detectar y despejar la falta más leve (corriente mínima) para asegurar la protección de las personas y equipos."},{"p":"La verificación dinámica de un embarrado rígido ante cortocircuito debe considerar:","o":{"a":"La frecuencia propia de oscilación de la barra y el efecto de amplificación mecánica.","b":"Únicamente la resistencia óhmica del material a la temperatura de servicio de 85 ºC.","c":"El factor de pérdidas dieléctricas (tan delta) del aislamiento gaseoso SF6 si aplica.","d":"La caída de tensión máxima permitida por el reglamento RUPM en el punto frontera."},"c":"a","ref":"ITC-RAT-05 / UNE-EN 60865-1","exp":"Si la frecuencia de la red (o su armónico) coincide con la frecuencia de resonancia de la barra, los esfuerzos sobre los aisladores pueden multiplicarse peligrosamente."},{"p":"Un embarrado de aluminio frente a uno de cobre de igual ampacidad presenta normalmente:","o":{"a":"Una mayor sección transversal y una menor densidad de corriente (A/mm²).","b":"Una resistencia mecánica a la tracción superior para el mismo diámetro exterior.","c":"La inmunidad total ante fenómenos de corrosión galvánica en ambiente salino.","d":"Un nivel de aislamiento nominal (BIL) superior por sus propiedades intrínsecas."},"c":"a","ref":"ITC-RAT-05 Apartado 6","exp":"Debido a la menor conductividad del aluminio, se requieren conductores de mayor sección para transportar la misma corriente sin exceder el límite térmico."},{"p":"En el cálculo de cortocircuito, el factor 'm' (térmico) y el factor 'n' (dinámico) dependen de:","o":{"a":"La altitud de la subestación y el grado de contaminación ambiental ISO.","b":"La duración de la falta y la relación entre la corriente de pico y la de corta duración.","c":"El nivel de aislamiento nominal (BIL) y el tipo de descargadores de sobretensiones.","d":"La clase de precisión de los transformadores de intensidad de medida fiscal."},"c":"b","ref":"ITC-RAT-05 / UNE-EN 60865-1","exp":"Estos factores ajustan los efectos térmicos y dinámicos en función de la asimetría de la corriente y el tiempo total de circulación de la misma."},{"p":"Una barra rígida debe verificarse reglamentariamente frente a:","o":{"a":"Corriente nominal, cortocircuito, esfuerzos dinámicos, dilatación, distancias y apoyos.","b":"Exclusivamente su capacidad de corriente en régimen permanente (ampacidad).","c":"Únicamente el nivel de cortocircuito mínimo para el ajuste de las protecciones.","d":"La señalización de seguridad y el código de colores definido en el proyecto."},"c":"a","ref":"ITC-RAT-05 / ITC-RAT-15","exp":"La verificación electromecánica debe ser integral para garantizar la estabilidad eléctrica (térmica/dieléctrica) y estructural de la posición."}]},{"titulo":"Bloque 5: Descargadores y coordinación de aislamiento","qs":[{"p":"La distancia entre descargador y equipo protegido debe reducirse porque:","o":{"a":"La impedancia característica de la conexión aumenta el tiempo de frente de la onda incidente.","b":"La inductancia de la conexión suma una caída de tensión (L·di/dt) a la tensión residual del equipo.","c":"Se requiere minimizar el acoplamiento capacitivo entre el descargador y las estructuras de soporte.","d":"La normativa de coordinación de aislamiento prohíbe conexiones superiores a 1 metro en sistemas GIS."},"c":"b","ref":"ITC-RAT-12 / UNE-EN 60071-2","exp":"Una conexión larga introduce una inductancia que, ante corrientes de rayo con altos di/dt, genera una tensión adicional que se suma a la tensión de descarga, reduciendo el margen de protección real en los bornes del equipo protegido."},{"p":"Un descargador de sobretensiones se selecciona principalmente por:","o":{"a":"Su tensión de operación continua (Uc), tensión asignada (Ur), corriente de descarga y capacidad energética.","b":"La longitud de fuga específica (creepage) definida por el grado de contaminación ISO 12944.","c":"El poder de corte nominal en condiciones de cortocircuito asimétrico del sistema.","d":"La rigidez dieléctrica del material polimérico de su envolvente ante impulsos de maniobra."},"c":"a","ref":"ITC-RAT-12 / UNE-EN 60099-4","exp":"La selección técnica requiere validar que el equipo soporte la tensión permanente del sistema (Uc), las sobretensiones temporales (TOV) mediante Ur, y que tenga capacidad para disipar la energía de las descargas previstas."},{"p":"El nivel de aislamiento nominal de un equipo (BIL) debe ser:","o":{"a":"Igual a la tensión residual del descargador para optimizar el coste de la aparamenta.","b":"Superior a la tensión residual del descargador multiplicada por un factor de seguridad (margen).","c":"Inferior a la tensión de cresta de la sobretensión de maniobra más desfavorable.","d":"Independiente de la presencia de descargadores, basándose solo en la altitud de la instalación."},"c":"b","ref":"ITC-RAT-12 Apartado 3.1","exp":"La coordinación de aislamiento exige que el nivel de soportabilidad a impulsos tipo rayo (BIL/LIWV) sea suficientemente superior a la tensión que el descargador deja pasar (tensión residual) para cubrir la degradación y los efectos de distancia."},{"p":"La coordinación de aislamiento busca:","o":{"a":"Garantizar que no existan fallos dieléctricos en la instalación bajo ninguna circunstancia operativa.","b":"Optimizar el diseño técnico-económico correlacionando niveles de soportabilidad y sobretensiones previstas.","c":"Sustituir las distancias de aislamiento en aire por el uso generalizado de descargadores de ZnO.","d":"Definir exclusivamente la altura de los cables de guarda para evitar el impacto directo del rayo."},"c":"b","ref":"ITC-RAT-12 / UNE-EN 60071-1","exp":"El objetivo es seleccionar la soportabilidad dieléctrica de los equipos de forma que el riesgo de fallo sea aceptable frente a las sobretensiones del sistema, minimizando costes de inversión y mantenimiento."},{"p":"Un descargador instalado en el primario de un transformador protege contra:","o":{"a":"Únicamente sobretensiones de frecuencia industrial debidas a la pérdida de neutro en el sistema.","b":"Sobretensiones transitorias de origen atmosférico (rayo) y de maniobra del sistema eléctrico.","c":"Corrientes de cortocircuito monofásicas que superen la capacidad térmica del devanado.","d":"La saturación del núcleo magnético por variaciones bruscas en la demanda de potencia reactiva."},"c":"b","ref":"ITC-RAT-12 / UNE-EN 61936-1","exp":"Los descargadores son dispositivos de protección contra sobretensiones transitorias (rayo y maniobra), limitando el potencial aplicado a los devanados del transformador."},{"p":"El margen de protección de un descargador se define habitualmente como:","o":{"a":"La diferencia entre la tensión residual del descargador y la tensión nominal del sistema en vacío.","b":"El cociente entre la corriente de pico de cortocircuito y la corriente nominal de descarga.","c":"La relación porcentual entre el nivel de soportabilidad del equipo (BIL) y la tensión residual aplicada.","d":"La distancia física máxima permitida entre el descargador y el equipo protegido en instalaciones de intemperie."},"c":"c","ref":"ITC-RAT-12 / UNE-EN 60071-2","exp":"Se suele expresar como (BIL/Up - 1) * 100, donde Up es la tensión residual. Valores típicos de diseño exigen márgenes superiores al 20-25% para asegurar la protección efectiva."},{"p":"En subestaciones con tecnología blindada (GIS), los descargadores suelen ser:","o":{"a":"De tipo autovalvular con explosores en serie para evitar el envejecimiento del material.","b":"Aisladores de porcelana con varistores de carburo de silicio (SiC) y purga de nitrógeno.","c":"Encapsulados en envolvente metálica con aislamiento en SF6, conectados directamente al embarrado.","d":"Eliminados por el diseño, confiando exclusivamente en el apantallamiento del edificio de la GIS."},"c":"c","ref":"ITC-RAT-12 / UNE-EN 62271-203","exp":"En GIS, los descargadores son componentes integrados en el compartimento estanco de SF6, lo que permite una coordinación de aislamiento muy compacta y eficiente."},{"p":"El efecto de las reflexiones de onda en terminales abiertos de una subestación exige:","o":{"a":"Aumentar la resistencia de la malla de tierra para amortiguar el frente de onda incidente.","b":"Verificar la coordinación de aislamiento ante la posible duplicación de la tensión en el punto abierto.","c":"Instalar reactancias serie para limitar la corriente de desplazamiento capacitiva.","d":"Reducir el nivel de aislamiento nominal (BIL) de los seccionadores situados en fin de línea."},"c":"b","ref":"ITC-RAT-12 / UNE-EN 60071-2","exp":"En puntos de discontinuidad (bornes abiertos), la onda de sobretensión se refleja sumándose a la incidente, lo que puede duplicar el potencial y superar el BIL del equipo si no hay protección cercana."},{"p":"Un descargador de óxidos metálicos (ZnO) moderno destaca técnicamente por:","o":{"a":"Su característica V-I altamente no lineal que permite prescindir de explosores en serie.","b":"La necesidad de una corriente de mantenimiento elevada para estabilizar la red cristalina.","c":"Un tiempo de respuesta superior a 100 ms ante transitorios de frente rápido (VFT).","d":"Su baja capacidad de absorción de energía en comparación con los de carburo de silicio."},"c":"a","ref":"ITC-RAT-12 / UNE-EN 60099-4","exp":"La excelente no linealidad del ZnO permite que, a tensión de servicio, la corriente de fuga sea despreciable, actuando instantáneamente como conductor ante sobretensiones sin requerir el cebado de un arco en explosores."},{"p":"La tensión de operación continua (Uc) de un descargador debe seleccionarse considerando:","o":{"a":"Exclusivamente la tensión nominal fase-fase del sistema en régimen permanente.","b":"La tensión máxima fase-tierra del sistema y el método de puesta a tierra del neutro.","c":"La integral de Joule de cortocircuito asimétrico del embarrado de la subestación.","d":"El valor del nivel de aislamiento a impulsos tipo maniobra (BSL) de los aisladores."},"c":"b","ref":"ITC-RAT-12 / UNE-EN 60099-5","exp":"Uc es la tensión eficaz máxima que el descargador puede soportar indefinidamente. Su elección depende de si el sistema es puesto a tierra (factor de falta ~1.4) o tiene neutro aislado/impedancia (factor de falta ~1.73)."},{"p":"El método de las esferas rodantes se aplica reglamentariamente para:","o":{"a":"Determinar la resistencia mecánica de los aisladores ante el impacto de granizo denso.","b":"Calcular el volumen de protección contra impactos directos de rayos en la instalación.","c":"Verificar el radio de curvatura mínimo de los conductores aislados de AT durante el montaje.","d":"Simular el comportamiento de las corrientes de Foucault en el blindaje de una GIS."},"c":"b","ref":"UNE-EN 61936-1 Apartado 7.1 / IEC 62305","exp":"Es el método electrogeométrico utilizado para definir las zonas de apantallamiento y la ubicación de puntas captadoras o cables de guarda para evitar impactos directos sobre la aparamenta en tensión."},{"p":"Un pararrayos tipo 'punta Franklin' basa su efectividad en:","o":{"a":"La creación de una pantalla conductora virtual mediante la ionización del aire circundante.","b":"La concentración de campo eléctrico que facilita la creación de un trazador ascendente (leader).","c":"La reducción de la impedancia de secuencia cero de la estructura metálica que lo soporta.","d":"La eliminación de la componente galvánica del rayo mediante materiales semiconductores."},"c":"b","ref":"UNE-EN 61936-1 / IEC 62305","exp":"La geometría puntiaguda intensifica el gradiente de potencial local, 'atrayendo' la descarga atmosférica hacia un punto controlado y canalizándola de forma segura a la red de tierra."},{"p":"La distancia de aislamiento en aire 'd' (clearance) depende técnicamente de:","o":{"a":"Únicamente la intensidad de cortocircuito simétrica prevista en los cálculos dinámicos.","b":"La tensión soportada nominal a impulsos (rayo o maniobra) adoptada para la instalación.","c":"El coeficiente de dilatación lineal de los conductores rígidos utilizados en las barras.","d":"La carga secundaria (burden) de los transformadores de tensión en el punto frontera."},"c":"b","ref":"ITC-RAT-12 Apartado 6 / UNE-EN 61936-1","exp":"El RAT establece las distancias mínimas en función del BIL (impulsos tipo rayo) o BSL (impulsos tipo maniobra), asegurando que el aire actúe como aislante ante dichas solicitaciones."},{"p":"El BIL (Basic Insulation Level) se verifica mediante ensayos que utilizan:","o":{"a":"Una onda de choque normalizada de 1,2 / 50 µs aplicada entre las partes activas y tierra.","b":"Una tensión alterna a frecuencia industrial aplicada de forma ininterrumpida durante 24 horas.","c":"Una rampa de tensión continua (CC) hasta alcanzar la corriente de fuga crítica del aislador.","d":"Una onda de frente lento de 250 / 2.500 µs para simular fallas monofásicas a tierra."},"c":"a","ref":"ITC-RAT-02 / UNE-EN 60060-1","exp":"El ensayo de impulso tipo rayo simula transitorios rápidos atmosféricos mediante una onda que alcanza el valor de cresta en 1.2 µs y decae al 50% en 50 µs."},{"p":"Un contador de descargas en pararrayos se justifica técnicamente por:","o":{"a":"La monitorización de la actividad de sobretensiones para la gestión del mantenimiento predictivo.","b":"La obligación reglamentaria de registrar el consumo de energía reactiva del descargador.","c":"Su capacidad para limitar la tensión de paso y contacto en la base del soporte metálico.","d":"La necesidad de conmutar automáticamente a un descargador de reserva tras 10 impactos."},"c":"a","ref":"ITC-RAT-12 / Especificaciones Técnicas REE","exp":"Permite registrar el número y, en modelos avanzados, la magnitud de las descargas, lo cual es esencial para evaluar el envejecimiento de los bloques de ZnO y planificar inspecciones tras tormentas."}]},{"titulo":"Bloque 6: TI, TT y puntos de medida oficial","qs":[{"p":"En un TC de protección, es crítico comprobar:","o":{"a":"Únicamente el valor del factor de seguridad (Fs) para el rango de corrientes nominales.","b":"La clase de protección, la carga (burden) real y el comportamiento ante saturación (ALF).","c":"La longitud de fuga específica del aislador para evitar el contorneo por sobretensión.","d":"La impedancia de secuencia positiva para el ajuste del relé de distancia (21)."},"c":"b","ref":"ITC-RAT-08 Apartado 1 / UNE-EN 61869-2","exp":"A diferencia de la medida, en protección es vital que el núcleo no se sature ante corrientes de falta elevadas (garantizado por el Factor de Límite de Precisión o ALF) y que el relé no supere la potencia de precisión (burden)."},{"p":"Aumentar la longitud del cable secundario de un TC provoca:","o":{"a":"Un incremento del burden y posible saturación más temprana del TC ante faltas.","b":"Una mejora en la clase de precisión por el aumento de la resistencia interna del bucle.","c":"Una reducción de la tensión inducida en el secundario por el efecto de la inductancia serie.","d":"La eliminación del error de ángulo ante corrientes de cortocircuito asimétricas."},"c":"a","ref":"ITC-RAT-08 / UNE-EN 61869-2","exp":"La resistencia del cableado secundario se suma a la carga del equipo conectado; un exceso de impedancia obliga al TC a suministrar más tensión, acercándolo a su punto de saturación magnética."},{"p":"Un TC de medida oficial se selecciona priorizando:","o":{"a":"Un factor de límite de precisión (ALF) superior a 20 para evitar saturaciones ante cortocircuitos.","b":"Alta precisión en el rango de operación (clase 0,2S o 0,5S) y carga secundaria adecuada.","c":"Que el núcleo sea compartido con las protecciones diferenciales de barras (87B).","d":"La soportabilidad dinámica ante picos de corriente superiores a 2,5 veces la Ik nominal."},"c":"b","ref":"RUPM / P.O. 10.1 / RD 1110/2007","exp":"La medida fiscal exige clases de precisión especiales (S) que mantienen el error acotado incluso con cargas muy bajas (hasta el 1% de la corriente nominal), cumpliendo los requisitos del Reglamento de Puntos de Medida."},{"p":"Abrir el secundario de un TC en servicio puede provocar:","o":{"a":"Una reducción inmediata de la caída de tensión en el circuito primario de alta tensión.","b":"La mejora de la linealidad de la curva de magnetización del núcleo de protección.","c":"Sobretensiones peligrosas y destructivas en el devanado secundario por saturación del núcleo.","d":"Un incremento de la rigidez dieléctrica del aceite aislante por efecto de la ionización."},"c":"c","ref":"ITC-RAT-08 / RD 614/2001","exp":"Al no haber corriente secundaria que se oponga a la fuerza magnetomotriz primaria, todo el flujo magnetiza el núcleo hasta la saturación profunda, induciendo picos de tensión de varios kV en los bornes abiertos."},{"p":"En un TT de medida oficial se debe comprobar:","o":{"a":"Relación de transformación, clase, carga, caída de tensión secundaria y protección.","b":"Únicamente el nivel de aislamiento a impulsos tipo maniobra (BSL) en bornes secundarios.","c":"La altura del soporte metálico y el gálibo de seguridad al suelo exclusivamente.","d":"La polaridad del núcleo destinado a la protección de distancia (21) de la posición."},"c":"a","ref":"RUPM / P.O. 10.1","exp":"La verificación fiscal exige asegurar que el transformador opera en su rango de precisión (burden) y que la caída de tensión en los cables secundarios no desvíe la lectura de energía."},{"p":"Un error de polaridad de TC puede afectar:","o":{"a":"Únicamente a la capacidad térmica del conductor de fase ante cortocircuito asimétrico.","b":"A las medidas de potencia y la actuación incorrecta de protecciones diferenciales o direccionales.","c":"Al nivel de aislamiento nominal (BIL) de los terminales de alta tensión del equipo.","d":"A la frecuencia de resonancia mecánica del embarrado rígido en condiciones de falta."},"c":"b","ref":"ITC-RAT-08 / ITC-RAT-09","exp":"Las protecciones diferenciales (87) y direccionales (67) comparan vectores; una polaridad invertida se interpreta como una falta interna falsa o como una dirección de corriente opuesta a la real."},{"p":"La ubicación del punto de medida oficial debe coincidir con:","o":{"a":"La posición del armario de control y servicios auxiliares más próximo al edificio de mando.","b":"El punto de menor potencial de paso y contacto calculado en el estudio de tierras.","c":"La frontera de medida definida contractualmente y el esquema de conexión aprobado.","d":"La base de la estructura del transformador de potencia en el lado de menor tensión."},"c":"c","ref":"RUPM / Criterios Fronteras RDT-RndT","exp":"El punto de medida define el límite de responsabilidad jurídica y económica entre el generador/consumidor y el transportista, debiendo situarse lo más cerca posible de la frontera eléctrica."},{"p":"Si se añade carga al secundario de un TT de medida:","o":{"a":"Se garantiza una mejora automática de la precisión por reducción del error de ángulo.","b":"Debe revisarse que no se exceda la carga compatible con su clase de precisión nominal.","c":"Aumenta la soportabilidad térmica del equipo ante sobretensiones transitorias de maniobra.","d":"Se reduce la caída de tensión en el cableado secundario debido al efecto Joule."},"c":"b","ref":"ITC-RAT-08 / RUPM","exp":"Los TT tienen una potencia de precisión (burden) asignada (ej. 50 VA). Superarla desplaza el punto de trabajo fuera de la clase garantizada, aumentando el error de amplitud y de fase."},{"p":"Un secundario de TC de medida no debe compartirse con protecciones porque:","o":{"a":"El RUPM prohíbe el uso de cables apantallados/blindados para servicios de protección.","b":"Se produciría un acoplamiento capacitivo excesivo en el núcleo magnético común.","c":"La saturación de protección dañaría el contador y la carga de medida afectaría la precisión de protección.","d":"Aumentaría el error de fase por encima de los límites de la norma IEC 61869-2."},"c":"c","ref":"ITC-RAT-08 / P.O. 10.1","exp":"Los núcleos de medida saturan a corrientes bajas (Fs) para proteger los instrumentos, mientras que los de protección deben ser lineales a corrientes altas. Mezclarlos compromete ambas funciones."},{"p":"El factor de seguridad (Fs) en un TC de medida sirve para:","o":{"a":"Garantizar que el TC no se sature nunca bajo ninguna condición de falta externa.","b":"Limitar la corriente secundaria ante faltas severas para proteger los instrumentos de medida.","c":"Definir la tracción mecánica máxima admisible en los terminales de salida secundarios.","d":"Ajustar la sensibilidad de arranque de la protección de sobreintensidad temporizada (51)."},"c":"b","ref":"ITC-RAT-08 / UNE-EN 61869-2","exp":"El Fs (ej. Fs < 5) asegura que, ante un cortocircuito primario, el núcleo se sature rápidamente, impidiendo que el secundario entregue corrientes destructivas al contador fiscal."},{"p":"La clase 0,2S en un TC de medida oficial implica:","o":{"a":"Inmunidad total ante interferencias electromagnéticas clase C según norma IEC.","b":"Un tiempo de respuesta inferior a los 2 milisegundos ante transitorios de carga rápida.","c":"Alta precisión (±0,2%) incluso con cargas muy reducidas (hasta el 1% de la corriente nominal).","d":"Que el transformador es apto exclusivamente para instalaciones situadas en Zona B climática."},"c":"c","ref":"RUPM / P.O. 10.1 / UNE-EN 61869-2","exp":"La letra 'S' indica que el transformador mantiene su precisión en un rango extendido hacia corrientes muy bajas, lo cual es vital para facturar correctamente en periodos de baja generación o consumo."},{"p":"En un TT inductivo, la carga simultánea de varios secundarios:","o":{"a":"Puede afectar negativamente a la precisión si la carga total supera la potencia de precisión asignada.","b":"Elimina el riesgo de aparición de fenómenos de resonancia ferromagnética en sistemas de AT.","c":"Incrementa el nivel de aislamiento nominal a frecuencia industrial de forma sistemática.","d":"Reduce significativamente la impedancia de transferencia ante descargas atmosféricas directas."},"c":"a","ref":"ITC-RAT-08 / UNE-EN 61869-3","exp":"La carga total vista por el primario es la suma de los VA de todos los secundarios activos; si se excede la capacidad del equipo, la regulación de tensión cae y el error de medida aumenta."},{"p":"La caída de tensión en el cableado secundario de un TT de medida oficial:","o":{"a":"Es irrelevante para el sistema si el contador dispone de compensación digital de armónicos.","b":"Debe limitarse reglamentariamente (ej. < 0,1%) para no introducir errores en la medida fiscal.","c":"Se compensa automáticamente aumentando la sección de los conductores de fase del primario.","d":"Solo debe verificarse para asegurar el ajuste de la protección de subtensión (27)."},"c":"b","ref":"RUPM / P.O. 10.1","exp":"Una caída de tensión excesiva entre el TT y el contador hace que este 'vea' menos tensión de la real, falseando el cálculo de energía activa y reactiva."},{"p":"El punto frontera en una conexión por cable aislado se sitúa habitualmente en:","o":{"a":"En el terminal del cable (bushing) de la subestación propiedad del Agente generador.","b":"En el seccionador de entrada a la subestación del transportista (RE), siendo este de RE.","c":"En la unión mecánica entre el terminal del cable y el pararrayos de protección de línea.","d":"En la arqueta de tiro situada inmediatamente antes del vallado perimetral de la planta."},"c":"b","ref":"Criterios Fronteras RDT-RndT Apartado 6.2.1.2.c","exp":"Según la normativa de Red Eléctrica, en conexiones por cable, la frontera se establece en el primer elemento de corte de la subestación de transporte, habitualmente el seccionador de entrada."},{"p":"Un transformador de intensidad de núcleo partido (toroidal) se usa en RUPM para:","o":{"a":"Detectar exclusivamente corrientes de secuencia negativa en transformadores de potencia.","b":"Medida fiscal en celdas de MT o GIS cuando no existe espacio para TC convencionales de barras.","c":"Reducir la solicitación mecánica por tracción en las bajantes de los pórticos de amarre.","d":"Actuar como sistema de protección de respaldo (50BF) ante fallos del interruptor automático."},"c":"b","ref":"Criterios Fronteras RDT-RndT Apartado 6.2.1.2.d","exp":"El uso de TI toroidales sobre los cables de salida permite realizar la medida oficial en instalaciones compactas (GIS) cumpliendo con la normalización de Red Eléctrica."}]},{"titulo":"Bloque 7: Malla de puesta a tierra","qs":[{"p":"Una malla con baja resistencia puede ser insegura si:","o":{"a":"El diseño no garantiza que las tensiones de paso y contacto se mantengan bajo los límites de seguridad tolerables.","b":"La impedancia de secuencia cero del sistema es mayor que la resistencia de puesta a tierra global.","c":"Se supera la profundidad crítica de enterramiento de los electrodos verticales (picas) según el RAT.","d":"El coeficiente de reflexión de la onda viajera ante descargas atmosféricas es estrictamente negativo."},"c":"a","ref":"IEEE-80 Clause 8 / ITC-RAT-13 Apartado 1","exp":"Una baja resistencia de tierra (Rg) reduce el potencial total (GPR), pero no garantiza por sí sola la seguridad si la geometría del mallado genera gradientes de potencial internos que excedan lo que el cuerpo humano puede soportar (tensiones de paso y contacto)."},{"p":"IEEE Std 80 se centra en:","o":{"a":"Los criterios de precisión para transformadores de medida destinados a la facturación oficial.","b":"La coordinación de aislamiento dieléctrico ante sobretensiones de frente muy rápido (VFT).","c":"La seguridad de las personas frente a tensiones de paso y contacto en subestaciones de corriente alterna.","d":"El dimensionamiento mecánico de conductores de aluminio ante esfuerzos electrodinámicos de cortocircuito."},"c":"c","ref":"IEEE Std 80 Clause 1 / ITC-RAT-13","exp":"La norma IEEE 80 es el estándar internacional de referencia para el cálculo de mallas de tierra, enfocándose en evitar el riesgo de fibrilación ventricular mediante el control de potenciales de paso y contacto."},{"p":"La capa superficial de grava ayuda porque:","o":{"a":"Aumenta la resistencia de contacto de los pies y reduce la corriente que circularía por el cuerpo humano.","b":"Elimina la componente reactiva de la corriente de falta a tierra mejorando la disipación térmica.","c":"Sustituye la necesidad de un mallado equipotencial en zonas con alto gradiente de potencial local.","d":"Reduce la tensión nominal fase-tierra de la instalación al actuar como un dieléctrico sólido distribuido."},"c":"a","ref":"IEEE-80 Clause 7 / ITC-RAT-13 Apartado 4","exp":"La grava (o asfalto) actúa como una resistencia en serie con el cuerpo del operario; al tener una resistividad alta incluso bajo humedad, limita la corriente que atraviesa el tórax ante un defecto."},{"p":"El EPR (o GPR) representa:","o":{"a":"La energía primaria registrada en los relés de protección durante una falta bifásica.","b":"El aumento del potencial de la red de tierra de la subestación respecto a una tierra remota.","c":"El error de fase acumulado en los transformadores de intensidad de la medida oficial.","d":"La impedancia mutua entre la malla de potencia y la red de tierras de instrumentación (tierra sucia)."},"c":"b","ref":"IEEE-80 Clause 3 / ITC-RAT-13","exp":"El Ground Potential Rise es el potencial máximo que alcanza la malla de tierra respecto a un punto de potencial cero (tierra remota) al ser inyectada por la corriente de falta (GPR = Ig · Rg)."},{"p":"Si aumenta la corriente de falta a tierra:","o":{"a":"Disminuye proporcionalmente el riesgo de transferencia de potenciales hacia servicios externos.","b":"Se reduce el valor eficaz de la tensión de paso debido al efecto de saturación del terreno.","c":"Se simplifica el diseño de la red de tierra al aumentar el gradiente de potencial superficial.","d":"Aumentan las exigencias sobre el GPR, las tensiones de seguridad y la sección térmica del conductor."},"c":"d","ref":"IEEE-80 Clause 11 / ITC-RAT-13 Apartado 3","exp":"Una mayor corriente de falta (Ik) eleva el GPR y los gradientes locales, exigiendo un diseño de malla más robusto y conductores de cobre con sección suficiente para no fundirse (estabilidad térmica)."},{"p":"El tiempo de despeje afecta a la malla porque:","o":{"a":"Define la energía térmica (Integral de Joule) y los límites de tensión tolerables por el cuerpo humano.","b":"Condiciona el nivel de aislamiento nominal (BIL) de los descargadores de sobretensiones.","c":"Es inversamente proporcional a la resistencia de contacto del calzado de seguridad del operario.","d":"Afecta exclusivamente a la capacidad de interrupción de los transformadores de intensidad toroidales."},"c":"a","ref":"IEEE-80 Clause 7 / ITC-RAT-13","exp":"Tanto la norma IEEE-80 (ecuación de Dalziel) como el RAT vinculan la seguridad de las personas a la duración del
