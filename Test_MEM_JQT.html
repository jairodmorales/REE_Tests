 choque eléctrico; a menor tiempo de despeje, el cuerpo tolera una mayor tensión."},{"p":"La tensión de contacto (o de toque) se define como:","o":{"a":"La diferencia de potencial entre dos puntos de la superficie del terreno separados por un metro.","b":"La diferencia de potencial entre una masa metálica y un punto del terreno a un metro de distancia.","c":"El potencial máximo que puede alcanzar un pararrayos de ZnO antes de su conducción térmica.","d":"La caída de tensión inductiva en los puentes de unión entre estructuras metálicas adyacentes."},"c":"b","ref":"IEEE-80 Clause 3 / ITC-RAT-13 Apartado 1","exp":"Representa la tensión a la que queda sometido un operario que toca una estructura en tensión (masa) mientras sus pies están sobre el terreno a un metro de distancia de la misma."},{"p":"La tensión de paso se considera aplicada reglamentariamente entre:","o":{"a":"La mano de una persona y ambos pies situados en el centro de un mallado de tierra.","b":"Dos puntos de la superficie del terreno separados por una zancada de un metro de longitud.","c":"Los terminales secundarios de un transformador de tensión y la malla de tierra general.","d":"La pantalla metálica de un cable de AT y la armadura de la estructura de hormigón."},"c":"b","ref":"IEEE-80 Clause 3 / ITC-RAT-13 Apartado 1","exp":"Es la tensión que experimenta una persona al caminar sobre un terreno con gradientes de potencial, medida entre sus pies separados por un metro, sin contacto con ninguna masa metálica."},{"p":"La conexión de las masas metálicas a la malla de tierra busca:","o":{"a":"Eliminar la impedancia de secuencia positiva para mejorar la estabilidad del sistema.","b":"Garantizar que el sistema SCADA reciba señales de falta a través del conductor de protección.","c":"Incrementar artificialmente la resistencia de tierra para limitar la corriente de cortocircuito.","d":"Lograr la equipotencialidad y facilitar la actuación rápida de los sistemas de protección."},"c":"d","ref":"ITC-RAT-13 Apartado 6 / UNE-EN 61936-1 8.3","exp":"Al conectar las masas a la malla se asegura que ante un defecto el potencial de la masa sea similar al del suelo (seguridad) y se crea un camino de baja impedancia que permite a las protecciones detectar la falta."},{"p":"Un mallado más cerrado en zonas de operación de seccionadores ayuda a:","o":{"a":"Reducir los gradientes de potencial locales y homogeneizar la tensión superficial.","b":"Aumentar la impedancia de transferencia ante transitorios de frente rápido (VFT).","c":"Sustituir funcionalmente a la capa de grava superficial en instalaciones de intemperie.","d":"Eliminar la necesidad de conectar el mando del seccionador a la red de tierra general."},"c":"a","ref":"IEEE-80 Clause 16.5 / ITC-RAT-13","exp":"Un mallado denso (o el uso de alfombrillas metálicas) reduce la diferencia de potencial entre los pies y las manos del operario durante la maniobra, minimizando la tensión de contacto."}]},{"titulo":"Bloque 8: Apantallamiento y tierras superiores","qs":[{"p":"El apantallamiento superior busca:","o":{"a":"Eliminar la componente inductiva de la malla de tierra inferior.","b":"Sustituir funcionalmente a los descargadores de sobretensiones de tipo ZnO.","c":"Reducir la probabilidad de impactos directos de rayos sobre las partes activas y equipos.","d":"Incrementar el nivel de aislamiento nominal (BIL) de las cadenas de suspensión."},"c":"c","ref":"UNE-EN 61936-1 Apartado 8.6","exp":"El sistema de apantallamiento (puntas captadoras o cables de guarda) tiene como objetivo interceptar las descargas atmosféricas para canalizarlas a tierra, evitando el impacto directo sobre la aparamenta."},{"p":"En el método de esfera rodante, un equipo está protegido si:","o":{"a":"El volumen de protección se determina exclusivamente mediante un ángulo fijo de 45º.","b":"El equipo se encuentra a una altura inferior a 10 metros sobre el nivel del suelo.","c":"La esfera de radio 'R' no contacta con el equipo al rodar sobre el sistema de captación.","d":"La bajante de tierra dispone de una sección superior a 95 mm² de cobre electrolítico."},"c":"c","ref":"UNE-EN 61936-1 Apartado 8.6 / IEC 62305","exp":"Según el modelo electrogeométrico, un objeto está protegido si queda situado dentro del volumen que la esfera no puede invadir al estar apoyada en los elementos captadores."},{"p":"El método del ángulo de protección se aplica preferentemente para:","o":{"a":"Estructuras de geometría sencilla dentro de los límites de altura de la norma.","b":"Instalaciones blindadas (GIS) con envolvente metálica puesta a tierra.","c":"Terminales de cables de AT con sistema de single-point bonding.","d":"Determinación de la tensión de contacto en el perímetro del vallado."},"c":"a","ref":"UNE-EN 61936-1 Apartado 8.6","exp":"El método del ángulo es una simplificación del modelo electrogeométrico válida para estructuras simples, siempre que no se superen las alturas críticas definidas por el nivel de protección."},{"p":"El radio de la esfera rodante 'R' depende reglamentariamente de:","o":{"a":"La resistividad eléctrica del terreno medida a un metro de profundidad.","b":"La tensión nominal de la instalación y el nivel de aislamiento (BIL).","c":"La corriente de pico de cortocircuito asimétrica del embarrado principal.","d":"El nivel de protección (LPL) definido según el análisis de riesgo de la norma."},"c":"d","ref":"UNE-EN 61936-1 / IEC 62305","exp":"El radio de la esfera (ej. 20m para nivel I, 45m para nivel III) se selecciona en función de la eficiencia requerida para el sistema de protección contra el rayo."},{"p":"El apantallamiento mediante cables de guarda en pórticos permite:","o":{"a":"Reducir la impedancia de secuencia positiva de la línea de salida.","b":"Aumentar la capacidad de transporte de corriente por efecto de apantallamiento térmico.","c":"Proteger conductores y equipos situados bajo su trazado frente a descargas directas.","d":"Eliminar la necesidad de realizar el ensayo de la cubierta en cables de AT."},"c":"c","ref":"UNE-EN 61936-1 Apartado 8.6","exp":"Los cables de guarda dispuestos sobre el parque de intemperie crean una zona de sombra eléctrica que protege las fases contra impactos directos del rayo."},{"p":"Apantallamiento y descargadores son complementarios porque:","o":{"a":"El primero reduce impacto directo y el segundo limita sobretensiones conducidas.","b":"Ambos dispositivos actúan sobre la componente galvánica de la corriente de defecto.","c":"El cable de guarda elimina la necesidad de coordinación de aislamiento en la aparamenta.","d":"La normativa permite omitir uno de ellos si el BIL es superior a 1050 kV."},"c":"a","ref":"ITC-RAT-12 / UNE-EN 61936-1 8.6","exp":"El apantallamiento evita que el rayo toque los equipos, mientras que los descargadores protegen contra las ondas de sobretensión que viajan por los conductores."},{"p":"Bajantes largas y con lazos son desfavorables porque:","o":{"a":"Incrementan la resistencia galvánica de la conexión a la malla de tierra inferior.","b":"Favorecen la aparición de fenómenos de corrosión electrolítica en el soporte.","c":"Aumentan la inductancia de la trayectoria, elevando el potencial ante frentes rápidos.","d":"Reducen el Ground Potential Rise (GPR) de forma peligrosa para los equipos de control."},"c":"c","ref":"IEEE-80 Clause 11 / IEC 62305","exp":"La inductancia (L) de una bajante con lazos genera una caída de tensión (L·di/dt) muy alta ante descargas atmosféricas, pudiendo provocar arcos de retorno o fallos en el aislamiento."},{"p":"Un equipo fuera del volumen protegido debe:","o":{"a":"Ser aceptado si dispone de un nivel de aislamiento nominal (BIL) clase AT2.","b":"Motivarse un cambio en el diseño del sistema de captación o la ubicación del equipo.","c":"Protegerse exclusivamente mediante el uso de pintura bituminosa aislante.","d":"Considerarse protegido si la distancia a la punta captadora es inferior a 5 metros."},"c":"b","ref":"UNE-EN 61936-1 Apartado 8.6","exp":"Si el análisis electrogeométrico muestra zonas desprotegidas, es obligatorio rediseñar la posición de pararrayos o cables de guarda para cubrir toda la aparamenta en tensión."},{"p":"En cable de guarda próximo a fases debe comprobarse:","o":{"a":"La resistencia de la pantalla del cable bajo condiciones de saturación magnética.","b":"El cumplimiento de la normativa fiscal RUPM para el intercambio de potencia.","c":"Las distancias de aislamiento ante las hipótesis de viento y hielo más desfavorables.","d":"El burden secundario de los transformadores de intensidad de tipo toroidal."},"c":"c","ref":"RLAT ITC-LAT-07 / RAT ITC-RAT-15","exp":"Se debe verificar que el acercamiento por balanceo (viento) o aumento de flecha (hielo) no reduzca la distancia aire-fase por debajo del mínimo reglamentario."},{"p":"El diseño de bajantes debe priorizar:","o":{"a":"Recorridos sinusoidales para absorber las dilataciones térmicas del conductor.","b":"La interconexión exclusiva con la red de tierras de instrumentación (tierra limpia).","c":"El uso de conductores aislados para evitar transferencias de potencial al soporte.","d":"Trayectos directos de baja inductancia y conexiones mecánicas y eléctricas robustas."},"c":"d","ref":"IEEE-80 Clause 11 / UNE-EN 61936-1 10.3","exp":"Para asegurar una evacuación rápida y segura de corrientes transitorias, se requieren caminos de baja impedancia hacia la malla general de la subestación."}]},{"titulo":"Bloque 9: Conectores AT, contacto y corona","qs":[{"p":"Una resistencia de contacto elevada en un conector AT produce:","o":{"a":"Una redistribución de la densidad de corriente hacia conductores adyacentes por efecto inductivo.","b":"Un incremento de la temperatura local por efecto Joule y la consecuente degradación acelerada de la unión.","c":"Una reducción de la impedancia de secuencia negativa en el nudo de conexión afectado.","d":"La estabilización del gradiente de potencial superficial mitigando el riesgo de efluvios corona."},"c":"b","ref":"ITC-RAT-15 / ITC-RAT-23 Apartado 2.1","exp":"Una conexión defectuosa aumenta la resistencia óhmica local, lo cual genera calor (P=I²R) bajo carga. Este sobrecalentamiento acelera la oxidación y el aflojamiento mecánico, pudiendo derivar en un fallo catastrófico o arco eléctrico."},{"p":"La limpieza de las superficies de contacto en conectores de Al debe:","o":{"a":"Omitirse para aprovechar la capa de alúmina natural como protección dieléctrica galvánica.","b":"Realizarse con cepillo metálico bajo una capa de compuesto sellante para evitar la reoxidación instantánea.","c":"Sustituirse por un incremento del 20% en el par de apriete nominal recomendado por el fabricante.","d":"Aplicarse únicamente mediante chorreado de arena (sandblasting) para garantizar rugosidad ISO 8501."},"c":"b","ref":"ITC-RAT-15 / Especificaciones de Montaje","exp":"El aluminio genera una capa de óxido altamente resistiva en segundos; el cepillado con grasa neutra o compuesto de contacto rompe dicha capa y la grasa impide que el oxígeno vuelva a contactar con el metal puro antes del apriete."},{"p":"El par de apriete en un conector debe verificarse porque:","o":{"a":"Garantiza que la presión de contacto sea suficiente para romper la capa de óxido y mantener la estabilidad térmica.","b":"Permite compensar las variaciones de la impedancia característica del conductor ante transitorios rápidos.","c":"Asegura que el conector actúe como un fusible mecánico ante esfuerzos de cortocircuito asimétrico.","d":"Es el único parámetro que define el nivel de aislamiento nominal (BIL) de la conexión de potencia."},"c":"a","ref":"ITC-RAT-15 Apartado 3","exp":"La presión mecánica constante asegura una superficie de contacto efectiva mínima necesaria para conducir la corriente nominal y de cortocircuito sin que la unión se degrade por dilataciones diferenciales."},{"p":"Un conector bimetálico se utiliza para:","o":{"a":"Evitar la corrosión electrolítica por diferencia de potencial galvánico entre conductores de distinta naturaleza.","b":"Reducir la integral de Joule de cortocircuito mediante el uso de aleaciones de alta resistividad térmica.","c":"Incrementar la sección efectiva de paso de corriente en transiciones de barras rígidas a cables aislados.","d":"Mitigar las vibraciones mecánicas eólicas mediante la combinación de módulos de diferente elasticidad."},"c":"a","ref":"ITC-RAT-15 Apartado 3.1","exp":"Al unir cobre y aluminio en presencia de humedad, se crea un par galvánico que corroe el aluminio. Los conectores bimetálicos (habitualmente con chapas de Al-Cu soldadas por explosión) eliminan este riesgo en la interfaz de los conductores."},{"p":"El efecto corona en conectores se reduce mediante:","o":{"a":"El incremento de la tracción mecánica longitudinal del conductor para reducir su radio de curvatura.","b":"La aplicación de pinturas aislantes de alta permitividad sobre las superficies de contacto activas.","c":"El diseño de geometrías redondeadas, el uso de pantallas o anillos de grado corona y la eliminación de aristas.","d":"La reducción de la sección transversal del conector para concentrar las líneas de campo eléctrico."},"c":"c","ref":"UNE-EN 61936-1 Apartado 5.3 / ITC-RAT-12","exp":"El efecto corona depende del gradiente de potencial superficial. El uso de formas esféricas o toroidales (anillos corona) aumenta el radio de curvatura, lo que reduce la intensidad del campo eléctrico y evita la ionización del aire."},{"p":"Aristas vivas en conectores AT pueden provocar:","o":{"a":"Una mejora en la distribución de la corriente de desplazamiento capacitiva hacia tierra remota.","b":"Una reducción de la interferencia radioeléctrica (RIV) al actuar como puntos de descarga controlada.","c":"La creación de puntos de concentración de campo eléctrico que facilitan la ionización del aire y efluvios corona.","d":"Un aumento de la tracción mecánica admisible en el borne del equipo según la norma UNE-EN 61936-1."},"c":"c","ref":"ITC-RAT-12 / UNE-EN 61936-1","exp":"Las puntas y bordes afilados concentran las líneas de campo eléctrico. Cuando este excede la rigidez dieléctrica del aire (~30 kV/cm), se producen descargas parciales (efecto corona), ruido radioeléctrico y generación de ozono corrosivo."},{"p":"Un anillo equipotencial sirve para:","o":{"a":"Uniformizar el gradiente de potencial en los extremos de aisladores o equipos, mitigando el efecto corona.","b":"Incrementar la resistencia de puesta a tierra de la estructura metálica del pórtico de amarre.","c":"Sustituir mecánicamente a las juntas de dilatación en embarrados rígidos de gran longitud.","d":"Detectar corrientes de fuga superficiales mediante el acoplamiento magnético con el sistema de control."},"c":"a","ref":"ITC-RAT-12 / UNE-EN 61936-1 Apartado 5.3","exp":"Su función principal es el control de campo. Al rodear los herrajes sometidos a alta tensión, desplazan la zona de mayor gradiente hacia el aire, protegiendo los terminales del equipo de efluvios destructivos."},{"p":"La termografía en conectores permite:","o":{"a":"Sustituir legalmente la inspección visual obligatoria requerida por la ITC-RAT-23.","b":"Medir la humedad relativa del aislamiento de papel-aceite en transformadores de medida.","c":"Determinar el factor de potencia del aislamiento (tan delta) en bornes de alta tensión.","d":"Identificar de forma no invasiva puntos calientes derivados de una elevada resistencia de contacto bajo carga."},"c":"d","ref":"ITC-RAT-23 / Manual REE Mantenimiento","exp":"Es una técnica de mantenimiento preventivo esencial en subestaciones; permite visualizar el patrón de calor infrarrojo y detectar anomalías en los conectores antes de que se produzca un fallo por fusión o desprendimiento."},{"p":"Cambiar fabricante de conectores exige revisar:","o":{"a":"Compatibilidad de materiales, capacidad térmica/dinámica, dimensiones de bornes y par de apriete.","b":"Únicamente que el color del acabado superficial cumpla con la normativa estética de la subestación.","c":"El peso unitario del componente para no exceder la carga de viento calculada para la estructura.","d":"La relación de transformación asignada de los transformadores de intensidad de la posición."},"c":"a","ref":"ITC-RAT-15 / ITC-RAT-02","exp":"Cada fabricante tiene sus propios diseños y aleaciones. Es imperativo asegurar que el nuevo conector soporta mecánicamente la tracción del conductor y eléctricamente la corriente nominal y de cortocircuito simétrica."},{"p":"Un compuesto de contacto incorrecto puede:","o":{"a":"Reducir la temperatura de operación del conductor por encima de sus límites térmicos de diseño.","b":"Incrementar la clase de precisión de los equipos de medida fiscal según el reglamento RUPM.","c":"Reaccionar químicamente con el metal, aumentar la resistencia de contacto o degradar la unión.","d":"Sustituir la necesidad de aplicar presión mecánica mediante tornillería de acero inoxidable."},"c":"c","ref":"ITC-RAT-15 Apartado 3","exp":"El uso de grasas o pastas no conductoras o incompatibles con el aluminio/cobre puede provocar corrosión química, endurecimiento prematuro o incluso actuar como aislante, elevando peligrosamente la resistencia de la unión."}]},{"titulo":"Bloque 10: Pasillos, seguridad e integración de diseño","qs":[{"p":"Los pasillos de explotación deben permitir:","o":{"a":"Reducir los niveles de cortocircuito mediante el incremento de la reactancia mutua de barras.","b":"Acceso seguro, maniobra, mantenimiento de equipos y rutas de evacuación expeditas.","c":"El almacenamiento temporal de materiales de repuesto y herrajes según la ITC-RAT-14.","d":"Únicamente la inspección visual mediante sistemas de CCTV monitorizados desde el edificio de control."},"c":"b","ref":"ITC-RAT-14 Apartado 6.1.1 / UNE-EN 61936-1 7.2.4","exp":"Los pasillos deben dimensionarse para garantizar que el personal pueda circular e intervenir con seguridad, permitiendo el transporte de aparatos y una evacuación rápida en caso de emergencia."},{"p":"Si un equipo invade un pasillo, debe comprobarse:","o":{"a":"La compatibilidad electromagnética (EMC) del chasis con el sistema de tierras de instrumentación.","b":"El factor de corrección por densidad del aire (Ka) para el aislamiento autorregenerable de la envolvente.","c":"Accesibilidad, seguridad, mantenibilidad y cumplimiento de las distancias mínimas (H = 250 + d).","d":"Únicamente la visibilidad de la señalización horizontal reflectante según la normativa ISO 3864."},"c":"c","ref":"ITC-RAT-14 Apartado 6.1.2 / UNE-EN 61936-1 7.2.4","exp":"Cualquier invasión de un pasillo compromete la seguridad; se debe verificar que se mantiene la altura mínima de seguridad 'H' sobre el suelo y que no se obstaculiza el mantenimiento."},{"p":"El RD 614 obliga a considerar en trabajos próximos a tensión:","o":{"a":"Únicamente el impacto económico de las medidas preventivas en el presupuesto de ejecución por contrata.","b":"La productividad esperada del equipo de montaje para minimizar el tiempo de exposición al riesgo.","c":"La profundidad de enterramiento de los electrodos de la red de tierras según el tipo de terreno.","d":"Riesgo eléctrico, distancias Dprox, procedimientos de trabajo y cualificación del personal."},"c":"d","ref":"RD 614/2001 Anexo V / UNE-EN 61936-1 8.1","exp":"El Real Decreto establece requisitos estrictos para trabajos en proximidad de elementos en tensión, exigiendo evaluar las distancias de seguridad y asegurar que el personal sea autorizado o cualificado."},{"p":"Un diseño que exige desmontar barras para mantenimiento rutinario es:","o":{"a":"Técnicamente deficiente en términos de mantenibilidad, disponibilidad y seguridad operativa.","b":"Preferible por permitir configuraciones de diseño más compactas y reducir el volumen de gas SF6.","c":"Una solución estándar aceptada para instalaciones de tercera categoría con tensión inferior a 36 kV.","d":"El criterio recomendado por la norma UNE-EN 61936-1 para optimizar el coste de las estructuras soporte."},"c":"a","ref":"ITC-RAT-14 / UNE-EN 61936-1 8.1","exp":"La ingeniería debe prever que el mantenimiento se realice con la mínima afectación al servicio y con seguridad, evitando diseños que obliguen a desmontajes estructurales mayores para tareas comunes."},{"p":"Cambiar un equipo por otro “equivalente” requiere revisar:","o":{"a":"Únicamente que el nuevo fabricante figure en el registro de proveedores homologados del RUPM.","b":"Dimensiones, bornes, esfuerzos, aislamiento, tierras, mandos y coherencia con el proyecto técnico.","c":"Solamente el color del acabado exterior de la envolvente para evitar contrastes visuales en el parque.","d":"Que el nuevo plazo de suministro no altere el cronograma de las pruebas de puesta en servicio."},"c":"b","ref":"ITC-RAT-02 / ITC-RAT-22","exp":"La equivalencia técnica no es solo de función, sino de interfaces físicas, mecánicas y de cumplimiento con los cálculos de diseño originales (distancias, tracciones, tierras)."},{"p":"La señalización de seguridad en el parque debe ser:","o":{"a":"Permanente, clara, visible y advertir sobre riesgos de alta tensión y maniobras remotas.","b":"Opcional siempre que la subestación disponga de vigilancia presencial ininterrumpida las 24 horas.","c":"Sustituida por señales acústicas de alta intensidad en el momento en que se detecta una falta a tierra.","d":"Exclusivamente digital a través de consignas mostradas en el sistema HMI de la sala de control."},"c":"a","ref":"ITC-RAT-10 Apartado 2 / UNE-EN 61936-1 8.9.1","exp":"El RAT exige señalización física inequívoca para permitir que cualquier profesional identifique los riesgos y la función de los equipos en tensión."},{"p":"El gálibo de seguridad al suelo en un pasillo de servicio depende de:","o":{"a":"La integral de Joule (I²t) calculada para el tiempo de despeje de la protección de respaldo.","b":"La altura mínima H = 250 + d, siendo 'd' la distancia fase-tierra según el BIL de la instalación.","c":"El valor de la resistencia de contacto medida en la base de la estructura metálica del pararrayos.","d":"La longitud de fuga específica (creepage) requerida para zonas de muy fuerte contaminación salina."},"c":"b","ref":"ITC-RAT-14 4.1.2 / UNE-EN 61936-1 7.2.4","exp":"La altura 'H' garantiza que las partes activas queden fuera del alcance de las personas en los pasillos de circulación, considerando el nivel de aislamiento de la planta."},{"p":"Las puertas de acceso a celdas de AT deben:","o":{"a":"Abrirse hacia el interior para evitar invadir el pasillo de maniobra durante una emergencia.","b":"Disponer de un grado de protección IPX4 para evitar la entrada fortuita de partículas sólidas.","c":"Ser de material incombustible, abrir hacia afuera y disponer de sistemas de cierre con llave.","d":"Estar permanentemente abiertas para favorecer la ventilación natural de las cubas de transformador."},"c":"c","ref":"ITC-RAT-14 Apartado 6.2.2 / UNE-EN 61936-1 7.3","exp":"Por seguridad contra incendios y evacuación, las puertas deben facilitar la salida rápida y asegurar que solo personal autorizado acceda a las partes en tensión."},{"p":"Una desviación de distancias eléctricas es crítica si:","o":{"a":"Únicamente modifica la codificación de los activos en el sistema de gestión del inventario de la planta.","b":"Compromete el aislamiento, la seguridad del personal, el mantenimiento o la operación segura.","c":"Altera el código de colores de las fases definido en la placa de características de los TC.","d":"Reduce el tiempo de respuesta teórico del sistema de detección de incendios de la sala de mando."},"c":"b","ref":"ITC-RAT-12 / UNE-EN 61936-1 Apartado 4","exp":"Las distancias mínimas son el pilar de la seguridad dieléctrica en aire; cualquier reducción no justificada invalida el diseño y genera riesgos de arco eléctrico."},{"p":"El diseño electromecánico aceptable exige:","o":{"a":"Que el layout sea el más compacto posible, priorizando el ahorro de espacio sobre las rutas de escape.","b":"La reducción del número de aisladores soporte a un valor inferior al obtenido en el cálculo dinámico.","c":"Coherencia técnica integral entre normativa, cálculos, planos, montaje, pruebas y seguridad.","d":"Únicamente que la aparamenta principal quepa físicamente dentro de la parcela de la subestación."},"c":"c","ref":"ITC-RAT-20 / ITC-RAT-22","exp":"Un diseño robusto debe ser trazable y cumplir con todas las verificaciones reglamentarias para garantizar una vida útil segura y fiable de la instalación."}]},{"titulo":"Bloque 11: Casos de cálculo conceptual","qs":[{"p":"Si la corriente de cortocircuito pasa de 31,5 kA a 50 kA, los esfuerzos electrodinámicos aumentan aproximadamente en proporción a:","o":{"a":"La raíz cuadrada del incremento de la intensidad eficaz simétrica.","b":"El cuadrado de la relación entre las intensidades de pico de cortocircuito.","c":"La variación lineal de la tensión nominal asignada de la instalación.","d":"La integral de Joule calculada para el tiempo de despeje de la protección de respaldo."},"c":"b","ref":"ITC-RAT-05 Apartado 5.1 / UNE-EN 60865-1","exp":"La fuerza electromecánica entre conductores (F) es proporcional al producto de las intensidades circulantes; en un cortocircuito, dicha fuerza escala con el cuadrado de la corriente de pico (Ip²)."},{"p":"Si el tiempo de despeje de falta se duplica, manteniendo la misma corriente, la energía térmica aproximada I²t:","o":{"a":"Se duplica proporcionalmente, incrementando la solicitación térmica del conductor.","b":"Se reduce a la mitad debido al mayor tiempo disponible para la disipación convectiva.","c":"No experimenta cambios significativos al no verse afectado el nivel de aislamiento (BIL).","d":"Depende exclusivamente de la reactancia de secuencia cero del transformador de potencia."},"c":"a","ref":"ITC-RAT-05 Apartado 6 / IEEE-80 Clause 11","exp":"La integral de Joule (I²t), que representa la energía térmica total disipada en forma de calor, es directamente proporcional a la duración de la falta (t)."},{"p":"En una verificación térmica de conductor por cortocircuito, reducir el tiempo de despeje permite:","o":{"a":"Reducir la solicitación térmica adiabática para una misma intensidad de falta.","b":"Aumentar la temperatura final admisible del aislamiento de tipo XLPE a 250 ºC.","c":"Omitir el requisito reglamentario de sección mínima por estabilidad dinámica.","d":"Ignorar el coeficiente de temperatura del material conductor en el cálculo térmico."},"c":"a","ref":"ITC-RAT-05 / IEEE-80 Clause 11.3","exp":"Al disminuir el tiempo de despeje, se reduce la energía acumulada en el conductor, lo que permite validar secciones menores o aumentar el margen de seguridad frente al punto de fusión o recocido."},{"p":"Si la distancia entre fases de barras se reduce, manteniendo la corriente de pico:","o":{"a":"Disminuye el esfuerzo de repulsión mutua entre los conductores de fase.","b":"Se reduce la concentración del gradiente de potencial en la superficie de la barra.","c":"Aumenta el esfuerzo electrodinámico y disminuye el margen dieléctrico fase-fase.","d":"Se mejora la soportabilidad ante sobretensiones de frente muy rápido (VFT)."},"c":"c","ref":"ITC-RAT-05 / ITC-RAT-12 Apartado 6","exp":"La fuerza es inversamente proporcional a la distancia (F ∝ 1/d); acortar la separación eleva las cargas mecánicas sobre aisladores y reduce la rigidez dieléctrica del aire entre fases."},{"p":"Un aumento del Ground Potential Rise (GPR) derivado de una mayor corriente de falta exige:","o":{"a":"Revisar las tensiones de paso y contacto y la estabilidad térmica de los conductores de tierra.","b":"Reducir el potencial transferido hacia servicios externos mediante el uso de picas de acero.","c":"Eliminar la capa de grava superficial para favorecer la conducción transversal del terreno.","d":"Disminuir el nivel de aislamiento nominal (BIL) de la aparamenta de la subestación."},"c":"a","ref":"IEEE-80 Clause 8 / ITC-RAT-13 Apartado 3","exp":"Un GPR elevado (GPR = Ig·Rg) incrementa el riesgo de exceder las tensiones tolerables y requiere conductores con sección suficiente para soportar el incremento de la densidad de corriente térmica."},{"p":"Si se duplica la resistividad del terreno manteniendo la geometría de la malla:","o":{"a":"Aumenta la resistencia de puesta a tierra (Rg) y consecuentemente el GPR de la instalación.","b":"Se reduce la tensión de paso aplicada debido al efecto de apantallamiento del suelo.","c":"Mejora la sensibilidad de las protecciones de sobreintensidad de neutro para faltas a tierra.","d":"Se reduce la sección térmica requerida para el conductor principal de la red de tierra."},"c":"a","ref":"IEEE-80 Clause 14 / ITC-RAT-13","exp":"La resistencia de la malla es directamente proporcional a la resistividad del suelo (ρ). Un aumento de ρ eleva Rg y, ante la misma corriente de falta, el potencial total de la malla (GPR)."},{"p":"La incorporación de una capa de grava de alta resistividad permite:","o":{"a":"Aumentar las tensiones de paso y contacto admisibles al limitar la corriente por el cuerpo.","b":"Sustituir funcionalmente al mallado equipotencial en subestaciones de exterior.","c":"Reducir la corriente total de falta a tierra inyectada en la red de puesta a tierra.","d":"Eliminar la necesidad de coordinar el aislamiento ante sobretensiones de maniobra."},"c":"a","ref":"IEEE-80 Clause 7 / ITC-RAT-13 Apartado 4","exp":"La grava actúa como una resistencia adicional en serie con los pies del operario, lo que permite soportar diferencias de potencial mayores sin que la corriente a través del tórax alcance niveles peligrosos."},{"p":"En un TC, aumentar el burden secundario real:","o":{"a":"No tiene impacto sobre la saturación del núcleo magnético en condiciones de falta.","b":"Mejora el factor de límite de precisión (ALF) efectivo del transformador de protección.","c":"Reduce de forma sistemática el error de ángulo en el punto nominal de operación.","d":"Puede adelantar la saturación del núcleo y falsear la respuesta de las protecciones."},"c":"d","ref":"ITC-RAT-08 / UNE-EN 61869-2","exp":"Un mayor burden requiere una tensión inducida (Es) más alta en el secundario (E=I·Z); esto desplaza el punto de trabajo hacia el codo de saturación, pudiendo provocar una medida incorrecta ante faltas."},{"p":"En un conductor tendido, aumentar la temperatura de operación:","o":{"a":"Incrementa la flecha y puede comprometer las distancias mínimas de seguridad al suelo.","b":"Reduce la flecha de forma irreversible debido al fenómeno de fluencia (creep) del material.","c":"Aumenta la tensión mecánica de tracción transmitida a las cadenas de amarre.","d":"No altera la geometría del vano si el conductor dispone de alma de acero reforzada."},"c":"a","ref":"RLAT ITC-LAT-07 / ITC-RAT-15","exp":"La dilatación térmica incrementa la longitud física del conductor, lo que aumenta la profundidad de la catenaria (flecha), reduciendo el gálibo vertical de seguridad."},{"p":"En una conexión aluminio-cobre sin solución bimetálica, el riesgo principal es:","o":{"a":"Un incremento injustificado del nivel de aislamiento nominal (BIL) en el borne afectado.","b":"La corrosión galvánica y el aumento progresivo de la resistencia eléctrica de contacto.","c":"Una reducción significativa de la intensidad de cortocircuito simétrica de la posición.","d":"La mejora de la disipación térmica de la unión por el efecto bimetálico natural."},"c":"b","ref":"ITC-RAT-15 Apartado 3.1","exp":"La diferencia de potencial electroquímico entre Al y Cu en presencia de un electrolito (humedad) provoca la degradación del metal menos noble (Al), generando puntos calientes por mala conexión."}]},{"titulo":"Bloque 12: Criterios de aceptación técnica","qs":[{"p":"Una ingeniería electromecánica robusta debe demostrar:","o":{"a":"Coherencia técnica integral entre cálculos, planos, selección de equipos, montaje, operación y seguridad.","b":"Exclusivamente la optimización del diseño para minimizar el CAPEX mediante el uso de estructuras ligeras.","c":"Únicamente el cumplimiento visual de la disposición de equipos definida en el anteproyecto administrativo.","d":"La disponibilidad comercial inmediata de todos los componentes para agilizar el cronograma de obra."},"c":"a","ref":"ITC-RAT-20 / ITC-RAT-22","exp":"Una ingeniería de calidad garantiza la trazabilidad entre los cálculos justificativos (térmicos, mecánicos, eléctricos) y la ejecución real, asegurando que la instalación sea segura y operable durante toda su vida útil."},{"p":"Una desviación de campo en la posición de un equipo debe revisarse porque:","o":{"a":"Afecta exclusivamente a la estética final del montaje y a la rotulación de los activos en el sistema SCADA.","b":"Solo tiene un impacto directo en el presupuesto de obra civil por la modificación de las bancadas.","c":"Puede invalidar cálculos de distancias eléctricas, esfuerzos mecánicos, accesos, tierras y cableados.","d":"Es un requisito puramente administrativo para la obtención del acta de puesta en marcha definitiva."},"c":"c","ref":"ITC-RAT-22 / ITC-RAT-12","exp":"Cualquier cambio de ubicación geométrica respecto al diseño original puede comprometer las distancias de seguridad (dielectric clearances) o los esfuerzos transmitidos por los conductores a los aisladores."},{"p":"Para liberar montaje hacia pruebas, debe existir:","o":{"a":"Únicamente el equipo principal físicamente anclado a su cimentación de hormigón armado.","b":"Red de tierra, conexiones, regulación, inspecciones cerradas y resolución de pendientes críticos.","c":"Solo la presencia física del técnico especialista del fabricante para la supervisión de la garantía.","d":"El cableado secundario de control y servicios auxiliares terminado, independientemente del estado de la potencia."},"c":"b","ref":"ITC-RAT-22 / ITC-RAT-23","exp":"La fase de pre-comisionado exige que la seguridad eléctrica (tierra y conexiones) y la integridad mecánica estén verificadas antes de aplicar tensión para ensayos funcionales."},{"p":"Una punch list clase A debe interpretarse como:","o":{"a":"Un defecto puramente estético o documental que no impide la explotación comercial de la planta.","b":"Un comentario técnico opcional que se resolverá en la primera parada de mantenimiento programada.","c":"Una recomendación de mejora para futuras ampliaciones de la subestación no vinculante para la recepción.","d":"Un incumplimiento o riesgo crítico de seguridad que bloquea legalmente la energización o aceptación."},"c":"d","ref":"ITC-RAT-23 / Procedimientos REE","exp":"Los pendientes de Clase A (Muy Graves o Graves) son aquellos que afectan directamente a la seguridad de las personas o la integridad de los equipos, impidiendo la puesta en servicio hasta su corrección."},{"p":"Una modificación de conector principal requiere revisar:","o":{"a":"Únicamente el precio unitario y el plazo de entrega para no penalizar el hito de montaje.","b":"Compatibilidad eléctrica (ampacidad), térmica, mecánica, par de apriete y par galvánico.","c":"Exclusivamente que el diseño del conector permita el uso de herramientas manuales convencionales.","d":"Solo el diseño del embalaje para garantizar la protección del material durante el transporte a obra."},"c":"b","ref":"ITC-RAT-15 / ITC-RAT-02","exp":"Un conector es un elemento crítico que debe soportar la corriente nominal y de cortocircuito (estabilidad térmica) y las tracciones mecánicas sin degradar la unión por corrosión galvánica."},{"p":"Si se cambia el nivel de cortocircuito de proyecto, debe actualizarse:","o":{"a":"Únicamente el estudio de coordinación de protecciones y los ajustes de los relés de sobreintensidad.","b":"Solo el esquema unifilar básico y la placa de características del transformador de potencia.","c":"Verificación térmica/dinámica de barras, equipos, red de tierra, soportes y protecciones afectadas.","d":"Solamente la documentación de las instrucciones de operación para el personal de mantenimiento local."},"c":"c","ref":"ITC-RAT-05 / ITC-RAT-13 / ITC-RAT-20","exp":"El cortocircuito define los esfuerzos mecánicos (pico) y el calentamiento (eficaz); un aumento exige validar de nuevo toda la cadena electromecánica y la seguridad de la malla de tierra."},{"p":"La aceptación de distancias eléctricas debe hacerse:","o":{"a":"Basándose exclusivamente en los planos de planta teóricos aprobados durante la fase de licitación.","b":"Únicamente mediante la consulta de los catálogos técnicos de los fabricantes de la aparamenta.","c":"Solo tras el acta de recepción provisional, delegando la responsabilidad en la empresa explotadora.","d":"Mediante planos 'as-built' y la verificación técnica de las condiciones reales de montaje en campo."},"c":"d","ref":"ITC-RAT-12 / ITC-RAT-22","exp":"La conformidad reglamentaria requiere constatar que las distancias mínimas fase-tierra y fase-fase se mantienen tras las tolerancias de montaje y flechas de conductores."},{"p":"Un criterio correcto de diseño de pasillos es:","o":{"a":"Priorizar el acceso seguro y el mantenimiento ergonómico sin invadir las distancias mínimas de aislamiento.","b":"Reducirlos a la anchura mínima operativa para lograr el layout más compacto posible en zona urbana.","c":"Habilitarlos como zonas de almacenamiento temporal de herrajes y repuestos críticos de alta tensión.","d":"Definirlos basándose exclusivamente en criterios arquitectónicos de simetría respecto al edificio de control."},"c":"a","ref":"ITC-RAT-14 / UNE-EN 61936-1","exp":"Los pasillos deben permitir la operación y el transporte de equipos manteniendo los gálibos de seguridad (altura H) y las distancias de aislamiento para evitar arcos eléctricos al personal."},{"p":"Un diseño de barras correcto debe integrar:","o":{"a":"Capacidad térmica (ampacidad), cortocircuito, aislamiento, soportes, dilatación y conectores.","b":"Exclusivamente la capacidad de transporte de corriente nominal en régimen permanente a 40ºC.","c":"Únicamente el nivel de aislamiento nominal a frecuencia industrial según la categoría de la red.","d":"Solo la longitud física total de la barra para el cálculo del inventario de materiales del proyecto."},"c":"a","ref":"ITC-RAT-05 / ITC-RAT-15","exp":"El diseño de un embarrado es una tarea multidisciplinar que debe cumplir requisitos eléctricos (dieléctricos/térmicos) y mecánicos (esfuerzos dinámicos/dilatación térmica)."},{"p":"El criterio final de aceptación técnica debe ser:","o":{"a":"Que la instalación sea coherente con normativa, cálculos, planos, montaje, pruebas y operación segura.","b":"Que la totalidad de los equipos suministrados quepan físicamente en la planta proyectada.","c":"Que el fabricante de la aparamenta principal sea ampliamente conocido en el sector eléctrico nacional.","d":"Que el plano final de montaje (As-built) contenga el menor número posible de notas aclaratorias."},"c":"a","ref":"ITC-RAT-22 / ITC-RAT-23","exp":"La aceptación técnica es la validación formal de que el sistema cumple con el marco reglamentario y los requisitos de seguridad industrial de forma integral."}]}];

// Estado persistente en memoria: respuestas por bloque
const estado = BLOQUES.map(b=>({
  answers: new Array(b.qs.length).fill(null),
  done: false
}));

let bloqueActual = 0;
let curQ = 0;

/* ── INICIO ── */
function renderInicio(){
  document.getElementById('s-inicio').style.display='block';
  document.getElementById('s-test').style.display='none';
  document.getElementById('s-result').style.display='none';
  const lista = document.getElementById('lista-bloques');
  lista.innerHTML='';
  BLOQUES.forEach((b,i)=>{
    const ans = estado[i].answers;
    const total = b.qs.length;
    const respondidas = ans.filter(a=>a!==null).length;
    const correctas = ans.filter((a,j)=>a!==null && a===b.qs[j].c).length;
    const incorrectas = respondidas - correctas;
    const enBlanco = total - respondidas;
    const pct = respondidas>0 ? Math.round(correctas/respondidas*100) : null;

    let estadoClass = '';
    if(respondidas>0 && respondidas<total) estadoClass='estado-progress';
    else if(respondidas===total) estadoClass='estado-done';

    let statsHTML = '';
    if(respondidas>0){
      statsHTML = `
        <div class="bloque-stats">
          <span class="bs-pill bs-ok">✓ ${correctas}</span>
          <span class="bs-pill bs-fail">✗ ${incorrectas}</span>
          ${enBlanco>0?`<span class="bs-pill bs-blank">○ ${enBlanco}</span>`:''}
          ${pct!==null?`<span class="bs-pct">${pct}%</span>`:''}
        </div>`;
    }

    const tituloLimpio = b.titulo.replace(/^Bloque \d+[:\s(]*/i,'').replace(/[)]/g,'').trim();

    lista.innerHTML+=`
      <div class="bloque-card ${estadoClass}" onclick="iniciarBloque(${i})">
        <div class="bloque-num">${i+1}</div>
        <div class="bloque-info">
          <div class="bloque-titulo">${tituloLimpio}</div>
          <div class="bloque-meta">${total} preguntas${respondidas>0?' · '+respondidas+' respondidas':''}</div>
        </div>
        ${statsHTML}
      </div>`;
  });
}

/* ── TEST ── */
function iniciarBloque(idx){
  bloqueActual = idx;
  const b = BLOQUES[idx];
  curQ = 0;
  // Si ya terminado, ir a resultado
  if(estado[idx].done){
    mostrarResultado();
    return;
  }
  // Ir a primera no respondida
  const primeraSinRes = estado[idx].answers.findIndex(a=>a===null);
  if(primeraSinRes>=0) curQ = primeraSinRes;

  document.getElementById('s-inicio').style.display='none';
  document.getElementById('s-result').style.display='none';
  document.getElementById('s-test').style.display='block';

  const tituloLimpio = b.titulo.replace(/^Bloque \d+[:\s(]*/i,'').replace(/[)]/g,'').trim();
  document.getElementById('t-titulo').textContent = 'Bloque '+(idx+1);
  document.getElementById('t-subtitulo').textContent = tituloLimpio;
  document.getElementById('s-rem').textContent = b.qs.length;

  buildNav(); renderQ();
}

function buildNav(){
  const b = BLOQUES[bloqueActual];
  const ans = estado[bloqueActual].answers;
  const nav = document.getElementById('q-nav');
  nav.innerHTML='';
  b.qs.forEach((_,i)=>{
    const d = document.createElement('div');
    let cls='q-dot';
    if(i===curQ) cls+=' current';
    else if(ans[i]!==null) cls+=(ans[i]===b.qs[i].c?' correct':' wrong');
    d.className=cls; d.textContent=i+1;
    d.onclick=()=>goTo(i);
    nav.appendChild(d);
  });
}

function renderQ(){
  const b = BLOQUES[bloqueActual];
  const ans = estado[bloqueActual].answers;
  const q = b.qs[curQ];
  const answered = ans[curQ]!==null;

  document.getElementById('q-label').textContent=`Pregunta ${curQ+1} de ${b.qs.length}`;
  document.getElementById('q-text').textContent=q.p;

  const opts=document.getElementById('options'); opts.innerHTML='';
  Object.entries(q.o).forEach(([k,v])=>{
    const d=document.createElement('div');
    let cls='opt';
    if(answered){
      cls+=' locked';
      if(k===q.c) cls+=' show-ok';
      if(k===ans[curQ] && ans[curQ]!==q.c) cls+=' sel-fail';
    }
    d.className=cls;
    d.innerHTML=`<span class="opt-key">${k.toUpperCase()})</span><span>${v}</span>`;
    if(!answered) d.onclick=()=>selectAnswer(k);
    opts.appendChild(d);
  });

  const fb=document.getElementById('feedback');
  if(answered){
    const isOk=ans[curQ]===q.c;
    fb.className='feedback show '+(isOk?'fb-ok':'fb-fail');
    document.getElementById('fb-title').textContent=isOk?'✓ Respuesta correcta':'✗ Respuesta incorrecta';
    document.getElementById('fb-body').textContent=q.exp;
    document.getElementById('fb-ref').textContent='📖 '+q.ref;
  } else {
    fb.className='feedback';
  }
  buildNav(); updateStats();
}

function selectAnswer(k){
  estado[bloqueActual].answers[curQ]=k;
  renderQ();
}

function navigate(d){
  const n=curQ+d;
  const total=BLOQUES[bloqueActual].qs.length;
  if(n>=0&&n<total){curQ=n;renderQ();}
}

function goTo(i){curQ=i;renderQ();}

function updateStats(){
  const ans=estado[bloqueActual].answers;
  const total=BLOQUES[bloqueActual].qs.length;
  const resp=ans.filter(a=>a!==null).length;
  document.getElementById('s-ans').textContent=resp;
  document.getElementById('s-blank').textContent=total-resp;
  document.getElementById('s-rem').textContent=total-resp;
}

function volverInicio(){
  document.getElementById('s-test').style.display='none';
  document.getElementById('s-result').style.display='none';
  renderInicio();
}

/* ── RESULTADO ── */
function finishBloque(){
  estado[bloqueActual].done=true;
  mostrarResultado();
}

function mostrarResultado(){
  document.getElementById('s-test').style.display='none';
  document.getElementById('s-inicio').style.display='none';
  document.getElementById('s-result').style.display='block';

  const b=BLOQUES[bloqueActual];
  const ans=estado[bloqueActual].answers;
  let ok=0,fail=0,blank=0;
  ans.forEach((a,i)=>{
    if(a===null)blank++;
    else if(a===b.qs[i].c)ok++;
    else fail++;
  });
  const total=b.qs.length;
  const pct=total>0?Math.round(ok/total*100):0;

  const tituloLimpio=b.titulo.replace(/^Bloque \d+[:\s(]*/i,'').replace(/[)]/g,'').trim();
  document.getElementById('res-bname').textContent='Bloque '+(bloqueActual+1)+' — '+tituloLimpio;
  document.getElementById('res-ok').textContent=ok;
  document.getElementById('res-fail').textContent=fail;
  document.getElementById('res-blank').textContent=blank;
  document.getElementById('res-pct').textContent=`${pct}% de respuestas correctas sobre el total del bloque`;

  const list=document.getElementById('review-list');
  list.innerHTML='';
  const toReview=b.qs.map((q,i)=>({q,i,a:ans[i]})).filter(({a,q})=>a===null||a!==q.c);

  if(toReview.length===0){
    document.getElementById('rev-title').textContent='¡Perfecto! Todas las respuestas son correctas.';
  } else {
    document.getElementById('rev-title').textContent=`Para repasar — ${toReview.length} pregunta${toReview.length>1?'s':''}:`;
    toReview.forEach(({q,i,a})=>{
      const isBlank=a===null;
      const cls=isBlank?'blank':'fail';
      const tag=isBlank?'<span class="tag tag-blank">En blanco</span>':'<span class="tag tag-fail">Incorrecta ✗</span>';
      const ua=a?`Tu respuesta: <strong>${a.toUpperCase()}) ${q.o[a]}</strong>`:'No respondida.';
      const ca=`<br>Correcta: <strong>${q.c.toUpperCase()}) ${q.o[q.c]}</strong>`;
      list.innerHTML+=`
        <div class="rev-item ${cls}">
          ${tag}
          <div class="rev-q"><strong>${i+1}.</strong> ${q.p}</div>
          <div class="rev-ans">${ua}${ca}</div>
          <div class="rev-exp">${q.exp}</div>
          <div class="rev-ref">📖 ${q.ref}</div>
        </div>`;
    });
  }
  window.scrollTo(0,0);
}

function reiniciarBloque(){
  estado[bloqueActual].answers=new Array(BLOQUES[bloqueActual].qs.length).fill(null);
  estado[bloqueActual].done=false;
  iniciarBloque(bloqueActual);
}

/* Arrancar */
renderInicio();
</script>
